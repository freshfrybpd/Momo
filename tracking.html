<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Order | Freshfry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .status-line { position: relative; }
        .status-line::before { content: ''; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; z-index: 0; }
        .active-step::before { background: #f97316; }
        .pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); } 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); } }
    </style>
</head>
<body class="pb-10">

    <nav class="p-6 bg-white shadow-sm sticky top-0 z-50 flex items-center gap-4">
        <a href="index.html" class="text-slate-400"><i class="fa-solid fa-chevron-left text-xl"></i></a>
        <h1 class="text-xl font-900 italic uppercase tracking-tighter">Track <span class="text-orange-500">Order</span></h1>
    </nav>

    <main class="max-w-md mx-auto p-4">
        <div id="tracking-container">
            <div class="text-center py-20 text-slate-400 font-bold italic">Finding your active orders...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userPhone = localStorage.getItem('ffPhone');

        if (!userPhone) {
            document.getElementById('tracking-container').innerHTML = `<div class="p-10 text-center font-bold">Please login first!</div>`;
        } else {
            // Fetch Latest Active Order
            const q = query(
                collection(db, "orders"), 
                where("customer", "==", userPhone),
                orderBy("time", "desc"),
                limit(1)
            );

            onSnapshot(q, (snap) => {
                const container = document.getElementById('tracking-container');
                if (snap.empty) {
                    container.innerHTML = `<div class="text-center py-20 text-slate-300 font-900 uppercase italic">No Active Orders found</div>`;
                    return;
                }

                const order = snap.docs[0].data();
                const status = order.status;

                container.innerHTML = `
                    <div class="bg-slate-900 rounded-[2.5rem] p-8 text-center text-white mb-6 shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl"><i class="fa-solid fa-shield-check"></i></div>
                        <p class="text-[10px] font-900 text-slate-400 uppercase tracking-widest mb-2">Delivery Verification PIN</p>
                        <h2 class="text-5xl font-900 tracking-[0.4em] text-orange-500">${order.deliveryPin}</h2>
                        <p class="text-[9px] mt-4 text-slate-400 font-bold">SHARE THIS ONLY WITH THE RIDER</p>
                    </div>

                    ${order.riderName ? `
                    <div class="bg-white rounded-[2rem] p-6 mb-6 shadow-sm border border-slate-100 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-orange-100 rounded-2xl flex items-center justify-center text-orange-600 text-2xl">
                                <i class="fa-solid fa-motorcycle"></i>
                            </div>
                            <div>
                                <p class="text-[9px] font-900 text-slate-400 uppercase">Your Rider</p>
                                <h3 class="text-lg font-900 italic uppercase text-slate-800">${order.riderName}</h3>
                            </div>
                        </div>
                        <a href="tel:0000000000" class="w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-green-100">
                            <i class="fa-solid fa-phone"></i>
                        </a>
                    </div>
                    ` : `
                    <div class="bg-white rounded-[2rem] p-6 mb-6 shadow-sm border border-slate-100 text-center">
                        <p class="text-xs font-900 text-slate-400 uppercase italic">Waiting for Rider Assignment...</p>
                    </div>
                    `}

                    <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 mb-6">
                        <h3 class="text-xs font-900 text-slate-400 uppercase tracking-widest mb-8">Order Journey</h3>
                        
                        <div class="status-line space-y-10">
                            <div class="flex items-start gap-6 relative z-10">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${status === 'pending' || status === 'preparing' || status === 'out_for_delivery' || status === 'delivered' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-slate-100 text-slate-300'}">
                                    <i class="fa-solid fa-receipt text-sm"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-900 uppercase italic ${status === 'pending' ? 'text-orange-500 pulse px-2 rounded-lg' : 'text-slate-800'}">Order Received</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase">We have got your order</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-6 relative z-10">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${status === 'preparing' || status === 'out_for_delivery' || status === 'delivered' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-slate-100 text-slate-300'}">
                                    <i class="fa-solid fa-fire-burner text-sm"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-900 uppercase italic ${status === 'preparing' ? 'text-orange-500 pulse px-2 rounded-lg' : 'text-slate-800'}">Kitchen Cooking</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase">Your momos are being fried</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-6 relative z-10">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${status === 'out_for_delivery' || status === 'delivered' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-slate-100 text-slate-300'}">
                                    <i class="fa-solid fa-person-biking text-sm"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-900 uppercase italic ${status === 'out_for_delivery' ? 'text-orange-500 pulse px-2 rounded-lg' : 'text-slate-800'}">Out for Delivery</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase">Rider is on the way</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-6 relative z-10">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${status === 'delivered' ? 'bg-green-500 text-white shadow-lg shadow-green-100' : 'bg-slate-100 text-slate-300'}">
                                    <i class="fa-solid fa-house-chimney-check text-sm"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-900 uppercase italic ${status === 'delivered' ? 'text-green-500' : 'text-slate-800'}">Delivered</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase">Enjoy your Freshfry!</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-[2rem] p-6 border border-slate-100 shadow-sm">
                         <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-900 text-slate-400 uppercase">Items Ordered</span>
                            <span class="text-sm font-900 italic">Total: ₹${order.total}</span>
                         </div>
                         <div class="space-y-2">
                            ${order.items.map(i => `
                                <div class="flex justify-between text-[11px] font-bold uppercase tracking-tighter text-slate-600">
                                    <span>${i.qty}x ${i.name}</span>
                                    <span>₹${i.price * i.qty}</span>
                                </div>
                            `).join('')}
                         </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
