<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Tracking Your Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #fffcf9; }
        
        .step-line { width: 2px; height: 50px; background: #e2e8f0; margin-left: 15px; }
        .active-line { background: #ff5e00; }
        .pulse-orange { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">

    <div class="w-full max-w-md">
        <header class="text-center mt-8 mb-12">
            <h1 class="text-3xl font-900 italic tracking-tighter">Freshfry<span class="text-orange-500"> Go.</span></h1>
            <p class="text-gray-400 font-bold text-[10px] uppercase tracking-widest mt-2">Preparing your happiness</p>
        </header>

        <div class="bg-white rounded-[3rem] p-8 shadow-2xl shadow-orange-100 border border-orange-50 mb-8 relative overflow-hidden">
            <div id="status-icon" class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-6 pulse-orange">
                <i class="fa-solid fa-fire-burner"></i>
            </div>
            <h2 id="status-text" class="text-2xl font-900 text-center text-gray-800">Momo is Steaming...</h2>
            <p id="status-desc" class="text-center text-gray-400 text-sm mt-2 font-medium">Chef is adding special spices to your box.</p>
        </div>

        <div class="px-6">
            <div class="flex items-start gap-4">
                <div id="dot-1" class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-xs shadow-lg"><i class="fa-solid fa-check"></i></div>
                <div>
                    <h4 class="font-900 text-gray-800">Order Confirmed</h4>
                    <p class="text-xs text-gray-400 font-bold">Kitchen received your box</p>
                </div>
            </div>
            <div id="line-1" class="step-line active-line"></div>

            <div class="flex items-start gap-4">
                <div id="dot-2" class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-xs shadow-lg shadow-orange-200"><i class="fa-solid fa-fire"></i></div>
                <div>
                    <h4 class="font-900 text-gray-800">Cooking in Progress</h4>
                    <p class="text-xs text-gray-400 font-bold">Freshly steaming in the pot</p>
                </div>
            </div>
            <div id="line-2" class="step-line"></div>

            <div class="flex items-start gap-4">
                <div id="dot-3" class="w-8 h-8 rounded-full bg-gray-200 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-motorcycle"></i></div>
                <div>
                    <h4 class="font-900 text-gray-400">Out for Delivery</h4>
                    <p class="text-xs text-gray-400 font-bold">Rider is picking up your box</p>
                </div>
            </div>
        </div>

        <div class="mt-12 bg-gray-900 text-white p-6 rounded-[2.5rem] flex items-center justify-between shadow-xl">
            <div>
                <p class="text-[10px] font-black text-orange-500 uppercase">Estimated Time</p>
                <p class="text-xl font-900">15-20 Mins</p>
            </div>
            <button onclick="window.open('https://wa.me/917008186187')" class="bg-white/10 p-4 rounded-2xl hover:bg-white/20">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
            </button>
        </div>
    </div>

    <script>
        // Automatic Animation Script
        const steps = [
            { icon: 'fa-fire-burner', text: 'Momo is Steaming...', desc: 'Chef is adding special spices to your box.' },
            { icon: 'fa-box-open', text: 'Packing Your Box', desc: 'Adding your favorite chutney and mayo.' },
            { icon: 'fa-motorcycle', text: 'Rider on the Way!', desc: 'Freshfry rider is zooming towards you.' }
        ];

        let currentStep = 0;
        const iconDiv = document.getElementById('status-icon');
        const textDiv = document.getElementById('status-text');
        const descDiv = document.getElementById('status-desc');

        const updateTracking = () => {
            if (currentStep < steps.length) {
                const step = steps[currentStep];
                iconDiv.innerHTML = `<i class="fa-solid ${step.icon}"></i>`;
                textDiv.innerText = step.text;
                descDiv.innerText = step.desc;

                if(currentStep === 1) {
                    document.getElementById('line-2').classList.add('active-line');
                    document.getElementById('dot-3').classList.add('bg-orange-500', 'shadow-lg');
                    document.getElementById('dot-3').innerHTML = `<i class="fa-solid fa-motorcycle"></i>`;
                }
                currentStep++;
            }
        };

        // Har 5 second mein status change hoga
        setInterval(updateTracking, 5000);
    </script>
</body>
</html>
