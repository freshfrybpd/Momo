<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order | Freshfry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .step-line { position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; z-index: -1; }
        .step-active { color: #f97316; }
        .dot-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="p-6 flex flex-col items-center">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-900 italic tracking-tighter">Freshfry<span class="text-orange-500 text-sm">Live.</span></h1>
            <p id="order-id-display" class="text-[10px] font-black text-gray-400 uppercase tracking-widest mt-2">Fetching Order...</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 border border-slate-100 mb-6 relative overflow-hidden">
            <div id="status-bg" class="absolute top-0 left-0 w-full h-2 bg-orange-100">
                <div id="status-progress" class="h-full bg-orange-500 transition-all duration-1000" style="width: 20%"></div>
            </div>

            <div class="text-center mt-4">
                <div class="w-20 h-20 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i id="status-icon" class="fa-solid fa-utensils text-3xl text-orange-500"></i>
                </div>
                <h2 id="status-text" class="text-xl font-800 text-slate-800">Waiting for Confirmation</h2>
                <p id="status-desc" class="text-sm font-bold text-slate-400 mt-2 px-4 leading-relaxed">Please wait, Freshfry Admin is reviewing your order.</p>
            </div>
        </div>

        <div class="space-y-10 relative px-2">
            <div class="step-line"></div>

            <div class="flex items-center gap-6">
                <div id="step1-dot" class="w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center z-10 shadow-lg shadow-orange-100">
                    <i class="fa-solid fa-check text-xs"></i>
                </div>
                <div>
                    <p class="text-xs font-black text-slate-800 uppercase tracking-widest">Order Placed</p>
                    <p class="text-[10px] font-bold text-slate-400">Successfully received by Freshfry</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div id="step2-dot" class="w-10 h-10 rounded-full bg-slate-200 text-white flex items-center justify-center z-10 transition-all duration-500">
                    <i class="fa-solid fa-fire-burner text-xs"></i>
                </div>
                <div>
                    <p id="step2-text" class="text-xs font-black text-slate-300 uppercase tracking-widest transition-colors">Kitchen is Cooking</p>
                    <p class="text-[10px] font-bold text-slate-400">Chef is preparing your fresh momos</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div id="step3-dot" class="w-10 h-10 rounded-full bg-slate-200 text-white flex items-center justify-center z-10 transition-all duration-500">
                    <i class="fa-solid fa-motorcycle text-xs"></i>
                </div>
                <div>
                    <p id="step3-text" class="text-xs font-black text-slate-300 uppercase tracking-widest transition-colors">Out for Delivery</p>
                    <p class="text-[10px] font-bold text-slate-400">Rider is on the way to Baripada</p>
                </div>
            </div>
        </div>

        <button onclick="window.location.href='bill.html'" class="mt-12 w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] shadow-xl active:scale-95 transition-all">
            View Digital Bill <i class="fa-solid fa-receipt ml-2 text-orange-400"></i>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get Order ID from LocalStorage (Saved in index.html)
        const orderId = localStorage.getItem('currentOrderId');
        document.getElementById('order-id-display').innerText = `Order ID: #${orderId ? orderId.slice(-6) : 'N/A'}`;

        if (orderId) {
            onSnapshot(doc(db, "orders", orderId), (snapshot) => {
                if (!snapshot.exists()) return;
                
                const data = snapshot.data();
                const status = data.status || 'pending';

                const text = document.getElementById('status-text');
                const desc = document.getElementById('status-desc');
                const progress = document.getElementById('status-progress');
                const icon = document.getElementById('status-icon');

                // UI Status Update Logic
                if (status === 'pending') {
                    text.innerText = "Waiting for Confirmation";
                    progress.style.width = "20%";
                    icon.className = "fa-solid fa-utensils text-3xl text-orange-500";
                } 
                else if (status === 'accepted') {
                    text.innerText = "Chef is Cooking!";
                    desc.innerText = "Your order has been accepted and is being prepared with love.";
                    progress.style.width = "50%";
                    icon.className = "fa-solid fa-fire-burner text-3xl text-orange-500";
                    
                    document.getElementById('step2-dot').className = "w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center z-10 shadow-lg shadow-orange-100";
                    document.getElementById('step2-text').className = "text-xs font-black text-slate-800 uppercase tracking-widest";
                } 
                else if (status === 'out_for_delivery') {
                    text.innerText = "Out for Delivery!";
                    desc.innerText = "A Freshfry partner is zooming towards your location.";
                    progress.style.width = "80%";
                    icon.className = "fa-solid fa-motorcycle text-3xl text-orange-500 animate-bounce";

                    // Highlight Step 2 & 3
                    document.getElementById('step2-dot').classList.replace('bg-slate-200', 'bg-orange-500');
                    document.getElementById('step3-dot').className = "w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center z-10 shadow-lg shadow-orange-100 dot-pulse";
                    document.getElementById('step3-text').className = "text-xs font-black text-slate-800 uppercase tracking-widest";
                } 
                else if (status === 'delivered') {
                    text.innerText = "Order Delivered!";
                    desc.innerText = "Enjoy your freshfry momos. Don't forget to visit again!";
                    progress.style.width = "100%";
                    icon.className = "fa-solid fa-circle-check text-3xl text-green-500";
                    progress.className = "h-full bg-green-500 transition-all duration-1000";
                }
            });
        }
    </script>
</body>
</html>
