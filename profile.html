<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Settings | Freshfry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0d0d0d; color: #fff; }
        
        .profile-card { background: #1c1c1c; border-radius: 1.5rem; border: 1px solid #2d2d2d; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #262626; }
        .setting-item:last-child { border-bottom: none; }
        
        /* Logout animation */
        .logout-btn:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="pb-10">

    <header class="p-5 flex items-center gap-4 sticky top-0 bg-black/90 backdrop-blur-md z-50">
        <button onclick="window.location.href='index.html'" class="text-xl text-gray-400">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 class="font-900 uppercase italic tracking-tighter">My Account</h1>
    </header>

    <main class="px-5">
        <div class="profile-card p-6 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="relative">
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fresh" class="w-16 h-16 rounded-full border-2 border-orange-500">
                    <div class="absolute bottom-0 right-0 bg-green-500 h-4 w-4 rounded-full border-2 border-black"></div>
                </div>
                <div>
                    <h2 id="display-name" class="text-2xl font-900 italic uppercase">Loading...</h2>
                    <p id="display-phone" class="text-xs text-gray-400 font-bold tracking-tight">+91-XXXXXXXXXX</p>
                    <button class="text-[10px] text-orange-500 font-black uppercase mt-1 tracking-widest">Edit Profile <i class="fa-solid fa-chevron-right text-[8px]"></i></button>
                </div>
            </div>
            
            <div class="bg-zinc-800/50 p-4 rounded-2xl flex items-center justify-between border border-zinc-700">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-crown text-yellow-500"></i>
                    <span class="text-sm font-bold tracking-tight">Freshfry Gold</span>
                </div>
                <span class="text-[10px] font-black text-orange-500 bg-orange-500/10 px-3 py-1 rounded-full uppercase">Renew</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="profile-card p-4 flex flex-col gap-2">
                <i class="fa-solid fa-wallet text-orange-500 opacity-50"></i>
                <p class="text-[10px] text-gray-500 font-black uppercase">Wallet</p>
                <h3 class="text-lg font-900 italic">₹0.00</h3>
            </div>
            <div class="profile-card p-4 flex flex-col gap-2">
                <i class="fa-solid fa-ticket text-orange-500 opacity-50"></i>
                <p class="text-[10px] text-gray-500 font-black uppercase">Coupons</p>
                <h3 class="text-lg font-900 italic">5 Active</h3>
            </div>
        </div>

        <section class="mb-10">
            <h3 class="text-[10px] text-gray-500 font-black uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                <span class="w-1 h-4 bg-green-500 rounded-full"></span> Preferences
            </h3>
            <div class="profile-card px-5">
                <div class="setting-item">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-leaf text-green-500"></i>
                        <span class="text-sm font-bold">Pure Veg Mode</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="veg-toggle" onchange="toggleVegMode()" class="sr-only peer">
                        <div class="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-green-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bell text-blue-400"></i>
                        <span class="text-sm font-bold">Notifications</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-zinc-600"></i>
                </div>
            </div>
        </section>

        <section class="mb-10">
            <div class="profile-card px-5">
                <div onclick="handleLogout()" class="setting-item border-none cursor-pointer logout-btn">
                    <div class="flex items-center gap-3 text-red-500">
                        <i class="fa-solid fa-power-off"></i>
                        <span class="text-sm font-black uppercase">Log out</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="text-center mt-10">
            <h2 class="text-2xl font-900 italic text-zinc-800 tracking-tighter">Freshfry.</h2>
            <p class="text-[9px] text-zinc-600 font-bold tracking-widest uppercase">Baripada • Version 1.8.64</p>
        </div>
    </main>

    <script>
        // Backend Working Logic
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Fetch User from LocalStorage (Sync with Login Page)
            const name = localStorage.getItem('ff_user') || "Guest User";
            const phone = localStorage.getItem('ff_phone') || "Not Linked";
            const vegStatus = localStorage.getItem('ff_veg_only') === 'true';

            // 2. Update UI
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-phone').innerText = phone !== "Not Linked" ? `+91-${phone}` : phone;
            document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            document.getElementById('veg-toggle').checked = vegStatus;
        });

        // Veg Mode Backend Logic
        function toggleVegMode() {
            const isChecked = document.getElementById('veg-toggle').checked;
            localStorage.setItem('ff_veg_only', isChecked);
            // Alert for user feedback
            const msg = isChecked ? "Veg Mode Enabled" : "Veg Mode Disabled";
            console.log(msg);
        }

        // Logout Backend Logic
        function handleLogout() {
            const confirmOut = confirm("Do you want to logout from Freshfry?");
            if(confirmOut) {
                // Clear only user session data
                localStorage.removeItem('ff_user');
                localStorage.removeItem('ff_phone');
                localStorage.removeItem('ff_veg_only');
                
                // Redirect to Index (which will trigger Login Modal)
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
