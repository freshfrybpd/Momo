<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .profile-input { border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .profile-input:focus { border-color: #f97316; outline: none; background-color: white; box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.1); }
        .toast-active { transform: translate(-50%, -20px) !important; opacity: 1 !important; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <button onclick="saveProfile(this)" class="text-sm font-bold text-orange-600 bg-orange-50 px-5 py-2.5 rounded-xl hover:bg-orange-100 transition-colors">Save</button>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-10 mb-24">
        
        <div class="flex flex-col items-center text-center mb-10">
            <div class="relative group">
                <div class="w-32 h-32 bg-orange-100 rounded-[2.5rem] overflow-hidden border-4 border-white shadow-2xl transition-transform active:scale-95">
                    <img id="profile-preview" src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="w-full h-full object-cover">
                </div>
                <label for="photo-upload" class="absolute -bottom-2 -right-2 bg-gray-900 text-white p-3.5 rounded-2xl cursor-pointer hover:bg-orange-500 transition-all shadow-lg border-4 border-white">
                    <i class="fa-solid fa-camera text-sm"></i>
                    <input type="file" id="photo-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
                </label>
            </div>
            <p class="text-[10px] font-black text-gray-400 mt-5 uppercase tracking-[0.2em]">Update Profile Photo</p>
        </div>

        <div class="space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100">
                <h3 class="text-lg font-black text-gray-900 mb-6 flex items-center">
                    <span class="w-2 h-6 bg-orange-500 rounded-full mr-3"></span>
                    Personal Details
                </h3>
                
                <div class="space-y-2 mb-6">
                    <label class="text-[11px] font-black text-gray-400 uppercase ml-1">Full Name</label>
                    <input type="text" id="user-name-input" placeholder="Enter your name" 
                           class="w-full profile-input bg-slate-50 p-4 rounded-2xl font-bold text-gray-800">
                </div>

                <div class="space-y-2 mb-6">
                    <label class="text-[11px] font-black text-gray-400 uppercase ml-1">Phone Number (Locked)</label>
                    <div class="flex items-center bg-slate-100 p-4 rounded-2xl font-bold text-gray-400 cursor-not-allowed border-2 border-transparent">
                        <span class="mr-2 text-gray-400">+91</span>
                        <input type="text" value="98765 43210" disabled class="bg-transparent w-full outline-none pointer-events-none">
                        <i class="fa-solid fa-shield-halved text-[12px] opacity-50"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[11px] font-black text-gray-400 uppercase ml-1">Primary Address</label>
                    <textarea id="user-address-input" rows="3" placeholder="Flat, Street, Landmark..."
                              class="w-full profile-input bg-slate-50 p-4 rounded-2xl font-bold text-gray-800"></textarea>
                </div>
            </div>

            <button onclick="saveProfile(this)" id="main-update-btn" class="w-full bg-gray-900 text-white py-6 rounded-[2.2rem] font-black tracking-[0.15em] text-sm hover:bg-orange-500 transition-all shadow-xl active:scale-95 flex items-center justify-center gap-3">
                UPDATE PROFILE
            </button>
        </div>
    </main>

    <div id="toast" class="fixed bottom-0 left-1/2 -translate-x-1/2 mb-10 px-8 py-4 bg-gray-900 text-white rounded-2xl font-bold shadow-2xl opacity-0 transition-all duration-500 z-[100] flex items-center gap-3 whitespace-nowrap pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-message">Update successful!</span>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. IMAGE PREVIEW ---
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('profile-preview').src = reader.result;
                showToast("Photo updated preview!", "fa-image", "text-blue-400");
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // --- 3. SAVE TO FIREBASE ---
        async function saveProfile(btnElement) {
            const name = document.getElementById('user-name-input').value;
            const address = document.getElementById('user-address-input').value;
            const originalContent = btnElement.innerHTML;

            if(!name || !address) {
                showToast("Please fill all fields!", "fa-triangle-exclamation", "text-yellow-400");
                return;
            }

            // UI Loading State
            btnElement.disabled = true;
            btnElement.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> SAVING...`;
            btnElement.classList.add('opacity-80', 'bg-orange-500');

            try {
                // Update Firebase (User ID 123 as example)
                await database.ref('users/user_123').update({
                    fullName: name,
                    address: address,
                    updatedAt: new Date().toISOString()
                });

                showToast("Profile Synced to Cloud!", "fa-cloud-arrow-up", "text-green-400");
                
                // Success Visual
                btnElement.innerHTML = `<i class="fa-solid fa-check mr-2"></i> UPDATED`;
                btnElement.classList.replace('bg-orange-500', 'bg-green-600');

            } catch (error) {
                console.error(error);
                showToast("Error: " + error.message, "fa-circle-xmark", "text-red-400");
                btnElement.classList.replace('bg-orange-500', 'bg-red-600');
            } finally {
                setTimeout(() => {
                    btnElement.innerHTML = originalContent;
                    btnElement.disabled = false;
                    btnElement.classList.remove('opacity-80', 'bg-green-600', 'bg-red-600', 'bg-orange-500');
                }, 2000);
            }
        }

        // --- 4. CUSTOM TOAST LOGIC ---
        function showToast(msg, iconClass, iconColor) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;
            
            toast.classList.add('toast-active');
            
            setTimeout(() => {
                toast.classList.remove('toast-active');
            }, 3000);
        }
    </script>

</body>
</html>
