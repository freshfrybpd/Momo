<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .profile-input {
            border: 2px solid #f1f5f9;
            transition: all 0.3s ease;
        }
        .profile-input:focus {
            border-color: #f97316;
            outline: none;
            background-color: white;
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <button onclick="saveProfile()" class="text-sm font-bold text-orange-600 bg-orange-50 px-4 py-2 rounded-xl">Save</button>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-10 mb-24">
        
        <div class="flex flex-col items-center text-center mb-10">
            <div class="relative group">
                <div class="w-32 h-32 bg-orange-100 rounded-[3rem] overflow-hidden border-4 border-white shadow-2xl">
                    <img id="profile-preview" src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="w-full h-full object-cover">
                </div>
                <label for="photo-upload" class="absolute bottom-0 right-0 bg-gray-900 text-white p-3 rounded-2xl cursor-pointer hover:bg-orange-500 transition-colors shadow-lg border-4 border-white">
                    <i class="fa-solid fa-camera text-sm"></i>
                    <input type="file" id="photo-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
                </label>
            </div>
            <p class="text-xs font-bold text-gray-400 mt-4 uppercase tracking-widest">Tap camera to change photo</p>
        </div>

        <div class="space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100">
                <h3 class="text-lg font-black text-gray-900 mb-6">Personal Details</h3>
                
                <div class="space-y-2 mb-6">
                    <label class="text-xs font-black text-gray-400 uppercase ml-1">Your Full Name</label>
                    <input type="text" id="user-name-input" value="Foodie Admin" 
                           class="w-full profile-input bg-slate-50 p-4 rounded-2xl font-bold text-gray-800">
                </div>

                <div class="space-y-2 mb-6">
                    <label class="text-xs font-black text-gray-400 uppercase ml-1">Phone Number</label>
                    <div class="flex items-center bg-slate-100 p-4 rounded-2xl font-bold text-gray-400 cursor-not-allowed">
                        <span class="mr-2">+91</span>
                        <input type="text" value="98765 43210" disabled class="bg-transparent w-full outline-none">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase ml-1">Primary Address</label>
                    <textarea id="user-address-input" rows="2" 
                              class="w-full profile-input bg-slate-50 p-4 rounded-2xl font-bold text-gray-800">Station Road, Baripada, Odisha</textarea>
                </div>
            </div>

            <button onclick="saveProfile()" class="w-full bg-gray-900 text-white py-6 rounded-[2.5rem] font-black tracking-widest text-sm hover:bg-orange-500 transition-all shadow-xl active:scale-95">
                UPDATE PROFILE
            </button>
        </div>
    </main>

    <script>
        // Photo Preview Function
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profile-preview');
                output.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // Save Functionality (Local Feedback)
        function saveProfile() {
            const name = document.getElementById('user-name-input').value;
            const address = document.getElementById('user-address-input').value;

            // Visual Success Feedback
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "SAVING... <i class='fa-solid fa-spinner fa-spin ml-2'></i>";
            btn.classList.replace('bg-gray-900', 'bg-green-600');

            setTimeout(() => {
                alert(`Success! Profile updated for ${name}`);
                btn.innerHTML = originalText;
                btn.classList.replace('bg-green-600', 'bg-gray-900');
            }, 1000);

            // Note: Firebase update logic can be added here
        }
    </script>

</body>
</html>
