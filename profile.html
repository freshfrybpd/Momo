<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Freshfry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0d0d0d; color: #fff; }
        .profile-card { background: #1c1c1c; border-radius: 1.5rem; border: 1px solid #2d2d2d; }
    </style>
</head>
<body>
    <header class="p-5 flex items-center gap-4">
        <button onclick="location.href='index.html'"><i class="fa-solid fa-arrow-left text-xl"></i></button>
        <h1 class="font-900 uppercase italic">My Account</h1>
    </header>

    <main class="px-5">
        <div class="profile-card p-6 mb-6">
            <div class="flex items-center gap-4">
                <div class="relative cursor-pointer" onclick="document.getElementById('imgInput').click()">
                    <img id="profile-pic" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fresh" class="w-16 h-16 rounded-full border-2 border-orange-500 object-cover">
                    <div class="absolute -bottom-1 -right-1 bg-orange-500 h-6 w-6 rounded-full border-2 border-black flex items-center justify-center text-[10px]">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <input type="file" id="imgInput" class="hidden" accept="image/*" onchange="previewImg(this)">
                </div>
                <div>
                    <h2 id="u-name" class="text-2xl font-900 italic uppercase">User</h2>
                    <p id="u-phone" class="text-xs text-gray-400 font-bold">+91-0000000000</p>
                </div>
            </div>
        </div>

        <div class="profile-card px-5 py-4 flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-leaf text-green-500"></i>
                <span class="font-bold">Pure Veg Mode</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="vegSwitch" class="sr-only peer" onchange="updateVegMode()">
                <div class="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:bg-green-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
            </label>
        </div>

        <button onclick="logout()" class="w-full p-4 text-red-500 font-black uppercase profile-card">Log Out</button>
    </main>

    <script>
        // 1. Photo Preview & Local Save
        function previewImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profile-pic').src = e.target.result;
                    localStorage.setItem('user_photo', e.target.result);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 2. Veg Mode Save
        function updateVegMode() {
            const val = document.getElementById('vegSwitch').checked;
            localStorage.setItem('ff_veg_only', val);
        }

        // 3. Load Data
        window.onload = () => {
            document.getElementById('u-name').innerText = localStorage.getItem('ff_user') || "Guest";
            document.getElementById('u-phone').innerText = "+91-" + (localStorage.getItem('ff_phone') || "0000000000");
            
            // Load saved photo
            const pic = localStorage.getItem('user_photo');
            if(pic) document.getElementById('profile-pic').src = pic;

            // Load saved veg status
            document.getElementById('vegSwitch').checked = localStorage.getItem('ff_veg_only') === 'true';
        };

        function logout() {
            localStorage.clear();
            location.href = 'index.html';
        }
    </script>
</body>
</html>
