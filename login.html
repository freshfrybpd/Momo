<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #000; color: #fff; margin: 0; overflow: hidden; }
        
        /* Background Image Layout (Reference: Screenshot 4 & 15) */
        .hero-bg {
            height: 65vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,1) 100%), 
                        url('https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .login-card {
            background: white;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            height: 40vh;
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 30px 24px;
            color: #1c1c1c;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .input-group {
            border: 1.5px solid #e8e8e8;
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        
        .input-group:focus-within { border-color: #ef4f5f; }

        .btn-main {
            background-color: #ef4f5f; /* Brand Red */
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(239, 79, 95, 0.3);
        }

        /* Branding Animation */
        .brand-tag {
            background: #ef4f5f;
            padding: 5px 20px;
            transform: rotate(-2deg);
            font-weight: 900;
            font-style: italic;
            font-size: 2.5rem;
            letter-spacing: -2px;
        }
    </style>
</head>
<body>

    <div class="hero-bg">
        <h1 class="text-4xl font-900 tracking-tighter uppercase leading-tight">Your Daily Dose<br>Of Momos</h1>
        <div class="mt-4">
            <div class="brand-tag">freshfry</div>
        </div>
    </div>

    <div class="login-card">
        <h2 class="text-center font-bold text-gray-500 text-sm tracking-widest uppercase mb-6">Log in or sign up</h2>
        
        <div class="input-group">
            <i class="fa-regular fa-user text-gray-400"></i>
            <input type="text" id="custName" placeholder="Enter Your Name" class="w-full outline-none text-[15px] font-semibold bg-transparent">
        </div>

        <div class="input-group">
            <div class="flex items-center gap-2 border-r border-gray-200 pr-3">
                <img src="https://flagcdn.com/w20/in.png" class="w-5 rounded-sm">
                <span class="text-sm font-bold">+91</span>
            </div>
            <input type="tel" id="custPhone" maxlength="10" placeholder="Enter Phone Number" class="w-full outline-none text-[15px] font-semibold tracking-widest bg-transparent">
        </div>

        <button onclick="submitToFirebase()" id="subBtn" class="btn-main mt-2">
            Continue
        </button>

        <div class="mt-8 flex items-center justify-center gap-6 opacity-40 grayscale">
            <i class="fa-brands fa-google text-xl"></i>
            <i class="fa-brands fa-apple text-2xl"></i>
            <i class="fa-solid fa-envelope text-xl"></i>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Exact Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
          authDomain: "freshfry-39a10.firebaseapp.com",
          projectId: "freshfry-39a10",
          storageBucket: "freshfry-39a10.firebasestorage.app",
          messagingSenderId: "928483976893",
          appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitToFirebase = async function() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const btn = document.getElementById('subBtn');

            if (name === "" || phone.length !== 10) {
                alert("Please enter a valid Name and 10-digit Phone Number.");
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                // Storing in 'users' collection
                await addDoc(collection(db, "users"), {
                    fullName: name,
                    phoneNumber: phone,
                    createdAt: serverTimestamp(),
                    device: navigator.userAgent
                });

                // Local storage for session
                localStorage.setItem('ff_user', name);
                localStorage.setItem('ff_phone', phone);

                alert("Welcome to Freshfry!");
                window.location.href = "index.html"; // Yahan apne main menu page ka link dein
            } catch (e) {
                console.error("Firebase Error: ", e);
                alert("Something went wrong. Please try again.");
                btn.innerText = "Continue";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
