<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Delivery Partner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .order-card { background: #1e293b; border-left: 4px solid #f97316; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-200">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Function to listen for New Orders
        const ordersList = document.getElementById('new-orders-list');
        const orderCountBadge = document.getElementById('order-count-badge');

        const q = query(collection(db, "orders"), where("status", "==", "pending"));

        onSnapshot(q, (snapshot) => {
            ordersList.innerHTML = '';
            orderCountBadge.innerText = `${snapshot.size} NEW`;
            
            if(snapshot.empty) {
                ordersList.innerHTML = `<p class="text-slate-500 text-center py-10">No new requests available.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const order = doc.data();
                const orderId = doc.id;
                
                const card = `
                    <div class="order-card p-5 rounded-2xl mb-6 shadow-xl">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-white">Order #${orderId.slice(-4).toUpperCase()}</h3>
                                <p class="text-slate-400 text-xs">Items: ${order.itemName || 'Momo Combo'}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-orange-500 font-bold">${order.price || '₹65.00'}</p>
                                <p class="text-[10px] text-slate-400">Cash on Delivery</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-3 mb-6 bg-slate-900/50 p-3 rounded-xl">
                            <i class="fa-solid fa-location-dot text-red-500"></i>
                            <p class="text-sm font-medium">Customer: ${order.category || 'Baripada User'}</p>
                        </div>

                        <div class="flex space-x-3">
                            <button onclick="updateStatus('${orderId}', 'declined')" class="flex-1 bg-slate-700 text-white py-3 rounded-xl font-bold hover:bg-slate-600 transition">Decline</button>
                            <button onclick="updateStatus('${orderId}', 'accepted')" class="flex-[2] bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-500/20">
                                Accept Order
                            </button>
                        </div>
                    </div>
                `;
                ordersList.innerHTML += card;
            });
        });

        // Global function to update order status
        window.updateStatus = async (id, status) => {
            try {
                const orderRef = doc(db, "orders", id);
                await updateDoc(orderRef, { status: status, riderId: "FF992" });
                alert(`Order ${status === 'accepted' ? 'Accepted! Go to kitchen.' : 'Declined.'}`);
            } catch (e) {
                console.error("Error updating status: ", e);
            }
        };
    </script>

    <nav class="flex items-center justify-between px-6 py-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center font-bold text-white shadow-lg shadow-orange-500/30">R</div>
            <div>
                <p class="text-xs text-slate-400 leading-none">Rider ID: #FF992</p>
                <p class="font-bold text-sm">Rahul Sharma</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-green-500/10 px-3 py-1 rounded-full border border-green-500/20">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-green-500 text-xs font-bold uppercase tracking-wider">Online</span>
        </div>
    </nav>

    <section class="p-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
                <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest mb-1">Today's Pay</p>
                <h2 class="text-2xl font-black text-white tracking-tight">₹840.50</h2>
            </div>
            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
                <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest mb-1">Orders Done</p>
                <h2 class="text-2xl font-black text-white tracking-tight">12</h2>
            </div>
        </div>
    </section>

    <section class="px-6 pb-24">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold">New Delivery Requests</h2>
            <span id="order-count-badge" class="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-md font-bold italic">0 NEW</span>
        </div>

        <div id="new-orders-list">
            <div class="text-center py-10 opacity-50">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Loading live requests...</p>
            </div>
        </div>

        <h2 class="text-lg font-bold mb-4 opacity-60">Recent History</h2>
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 flex justify-between items-center opacity-60">
            <div class="flex items-center space-x-4">
                <div class="bg-green-500/20 p-2 rounded-lg"><i class="fa-solid fa-check text-green-500"></i></div>
                <div><p class="font-bold text-sm">Order #5518</p><p class="text-xs">Delivered • 2:15 PM</p></div>
            </div>
            <p class="font-bold text-sm">₹42.00</p>
        </div>
    </section>

    <div class="fixed bottom-0 w-full bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 flex justify-around py-4 shadow-2xl z-50">
        <div class="flex flex-col items-center text-orange-500 cursor-pointer">
            <i class="fa-solid fa-motorcycle text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">Deliveries</span>
        </div>
        <div class="flex flex-col items-center text-slate-500 cursor-pointer hover:text-white transition">
            <i class="fa-solid fa-chart-simple text-xl"></i>
            <span class="text-[10px] mt-1">Earnings</span>
        </div>
        <div class="flex flex-col items-center text-slate-500 cursor-pointer hover:text-white transition">
            <i class="fa-solid fa-gear text-xl"></i>
            <span class="text-[10px] mt-1">Settings</span>
        </div>
    </div>

</body>
</html>
