<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5e00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Freshfry Partner">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/partner-manifest.json">
<title>Freshfry Partner Delivery</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7f0;color:#242424;font-family:Arial,sans-serif}
header{background:#ff5e00;color:white;padding:18px;font-size:23px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #00000012}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{border:0;background:#ff5e00;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#252525}
button:disabled{opacity:.5}
.muted{color:#777;font-size:14px}
.status{font-weight:bold;color:#e65a00}
a{color:#e65300;font-weight:bold}
.hidden{display:none}
</style>
</head>

<body>
<header>🍜 Freshfry Partner</header>

<main>
  <section class="card" id="loginCard">
    <h2>Delivery Partner Login</h2>
    <input id="riderName" placeholder="Your registered rider name" autocomplete="name">
    <input id="riderPhone" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10">
    <button id="loginBtn">Continue</button>
    <p class="muted">Enter the name and phone number registered with Freshfry.</p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2 id="welcome">Welcome</h2>
      <button id="soundBtn" class="secondary">🔔 Enable New Order Sound</button>
      <p id="soundStatus" class="muted">Sound is not enabled.</p>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>

    <h2>🛵 Active Deliveries</h2>
    <div id="orders"><div class="card">Loading orders…</div></div>

    <h2>✅ Delivery History</h2>
    <div id="history"><div class="card">No history loaded.</div></div>
  </section>

  <p id="message" class="muted"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc,
  query, where, onSnapshot, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDC8bZ8RaDfMc--BzT2S_LllBA4G2d0dfUM",
  authDomain: "freshfry-39a10.firebaseapp.com",
  projectId: "freshfry-39a10",
  storageBucket: "freshfry-39a10.firebasestorage.app",
  messagingSenderId: "928483976893",
  appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let rider = null;
let stopActive = null;
let stopHistory = null;
let audioContext = null;
let soundEnabled = false;
let initialSnapshotReceived = false;
const knownOrderIds = new Set();

function showMessage(text) {
  $("message").textContent = text;
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function playOrderAlert() {
  if (!soundEnabled) return;

  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();

    [0, 0.35, 0.7].forEach(delay => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sawtooth";
      oscillator.frequency.value = 880;
      gain.gain.value = 0.22;
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(audioContext.currentTime + delay);
      oscillator.stop(audioContext.currentTime + delay + 0.22);
    });
  } catch (error) {
    console.warn("Sound could not play:", error);
  }
}

$("soundBtn").addEventListener("click", async () => {
  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    soundEnabled = true;
    $("soundStatus").textContent = "Sound enabled. Keep this page open for alerts.";
    $("soundBtn").textContent = "🔔 Sound Enabled";

    playOrderAlert();
  } catch {
    $("soundStatus").textContent = "Sound could not start. Check your phone settings.";
  }
});

$("loginBtn").addEventListener("click", async () => {
  const name = $("riderName").value.trim();
  const phone = $("riderPhone").value.trim();

  if (!name || !/^\d{10}$/.test(phone)) {
    showMessage("Enter the registered rider name and valid 10-digit phone number.");
    return;
  }

  $("loginBtn").disabled = true;
  showMessage("Checking rider details…");

  try {
    const riderRef = doc(db, "riders", name.toUpperCase());
    const riderSnap = await getDoc(riderRef);

    if (!riderSnap.exists()) {
      showMessage("Rider record not found. Please contact Freshfry admin.");
      return;
    }

    const riderData = riderSnap.data();

    if (String(riderData.phone || "").replace(/\D/g, "").slice(-10) !== phone) {
      showMessage("Phone number does not match the registered rider.");
      return;
    }

    rider = { ...riderData, name: riderData.name || name, phone };
    $("loginCard").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("welcome").textContent = "Welcome, " + rider.name;

    listenForOrders();
    showMessage("");
  } catch (error) {
    console.error(error);
    showMessage("Login failed. Check your internet and Firebase rules.");
  } finally {
    $("loginBtn").disabled = false;
  }
});

function listenForOrders() {
  stopActive?.();
  stopHistory?.();

  initialSnapshotReceived = false;
  knownOrderIds.clear();

  const activeQuery = query(
    collection(db, "orders"),
    where("status", "==", "out_for_delivery"),
    where("riderName", "==", rider.name)
  );

  stopActive = onSnapshot(activeQuery, snapshot => {
    const newOrders = [];

    snapshot.forEach(orderDoc => {
      if (initialSnapshotReceived && !knownOrderIds.has(orderDoc.id)) {
        newOrders.push(orderDoc.data());
      }
    });

    snapshot.forEach(orderDoc => knownOrderIds.add(orderDoc.id));
    initialSnapshotReceived = true;

    if (newOrders.length) {
      playOrderAlert();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Freshfry: New Delivery!", {
          body: "You have " + newOrders.length + " new order(s) assigned."
        });
      }
    }

    renderOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
  }, error => {
    console.error(error);
    $("orders").innerHTML = '<div class="card">Could not load orders. Check Firestore permissions.</div>';
  });

  const historyQuery = query(
    collection(db, "orders"),
    where("status", "==", "delivered"),
    where("riderName", "==", rider.name)
  );

  stopHistory = onSnapshot(historyQuery, snapshot => {
    const orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    $("history").innerHTML = orders.length
      ? orders.map(order => `
        <div class="card">
          <strong>Order #${escapeHTML(order.id.slice(-6))}</strong>
          <p>Customer: ${escapeHTML(order.customerName || order.name || "Customer")}</p>
          <p class="status">Delivered</p>
        </div>`).join("")
      : '<div class="card">No delivered orders yet.</div>';
  }, error => {
    console.error(error);
    $("history").innerHTML = '<div class="card">Could not load history.</div>';
  });
}

function getCoordinates(order) {
  const locations = [
    order.customerLocation,
    order.location,
    order.coordinates,
    order.deliveryLocation
  ].filter(v => v && typeof v === "object");

  let lat = order.latitude ?? order.lat ?? order.customerLatitude;
  let lng = order.longitude ?? order.lng ?? order.lon ?? order.customerLongitude;

  if (lat == null || lng == null) {
    for (const location of locations) {
      lat ??= location.latitude ?? location.lat;
      lng ??= location.longitude ?? location.lng ?? location.lon;
    }
  }

  lat = Number(lat);
  lng = Number(lng);

  if (Number.isFinite(lat) && Number.isFinite(lng) &&
      lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
    return { lat, lng };
  }
  return null;
}

function getNavigationUrl(order) {
  const coords = getCoordinates(order);

  if (coords) {
    return "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(coords.lat + "," + coords.lng) +
      "&travelmode=driving";
  }

  const storedMap = order.mapUrl ||
    (typeof order.customerLocation === "string" ? order.customerLocation : "");

  if (storedMap) {
    try {
      const url = new URL(storedMap);
      if (url.protocol === "https:" &&
          /(^|\.)google\.[a-z.]+$|(^|\.)goo\.gl$|(^|\.)maps\.app\.goo\.gl$/i.test(url.hostname)) {
        return url.href;
      }
    } catch {}
  }

  const address = order.address || order.customerAddress || order.deliveryAddress || "";
  if (address) {
    return "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(address) + "&travelmode=driving";
  }

  return "";
}

function renderOrders(orders) {
  orders.sort((a, b) => {
    const ta = a.createdAt?.toMillis?.() || 0;
    const tb = b.createdAt?.toMillis?.() || 0;
    return tb - ta;
  });

  $("orders").innerHTML = orders.length ? orders.map(order => {
    const name = order.customerName || order.name || "Customer";
    const phone = String(order.customerPhone || order.phone || "");
    const address = order.address || order.customerAddress || order.deliveryAddress || "Address not provided";
    const items = Array.isArray(order.items)
      ? order.items.map(item => typeof item === "string"
          ? item
          : `${item.name || item.title || "Item"} × ${item.quantity || item.qty || 1}`).join(", ")
      : "Order details unavailable";
    const mapUrl = getNavigationUrl(order);

    return `
      <div class="card">
        <h3>Order #${escapeHTML(order.id.slice(-6))}</h3>
        <p><strong>Customer:</strong> ${escapeHTML(name)}</p>
        <p><strong>Phone:</strong> ${escapeHTML(phone || "Not provided")}</p>
        <p><strong>Address:</strong> ${escapeHTML(address)}</p>
        <p><strong>Items:</strong> ${escapeHTML(items)}</p>
        <p><strong>Total:</strong> ₹${escapeHTML(order.total ?? order.totalAmount ?? order.amount ?? "—")}</p>
        ${phone ? `<a href="tel:${escapeHTML(phone)}">📞 Call Customer</a>` : ""}
        ${mapUrl ? `<p><a href="${escapeHTML(mapUrl)}" target="_blank" rel="noopener">🗺️ NAVIGATE WITH GOOGLE MAPS</a></p>`
          : '<p class="muted">No map coordinates or address saved for this order.</p>'}
        <hr>
        <label for="pin-${escapeHTML(order.id)}">Customer delivery PIN</label>
        <input id="pin-${escapeHTML(order.id)}" inputmode="numeric" maxlength="8" placeholder="Enter delivery PIN">
        <button data-deliver="${escapeHTML(order.id)}">Confirm Delivered</button>
      </div>`;
  }).join("") : '<div class="card">No active deliveries assigned to you.</div>';

  $("orders").querySelectorAll("[data-deliver]").forEach(button => {
    button.addEventListener("click", () => markDelivered(button.dataset.deliver, button));
  });
}

async function markDelivered(orderId, button) {
  const pinInput = $("pin-" + orderId);
  const enteredPin = pinInput.value.trim();

  if (!enteredPin) {
    alert("Enter the customer's delivery PIN.");
    return;
  }

  button.disabled = true;

  try {
    const orderRef = doc(db, "orders", orderId);
    const orderSnap = await getDoc(orderRef);

    if (!orderSnap.exists()) throw new Error("Order not found.");

    const order = orderSnap.data();
    const expectedPin = String(order.orderPin ?? order.deliveryPin ?? "");

    if (!expectedPin || enteredPin !== expectedPin) {
      throw new Error("Incorrect delivery PIN.");
    }

    if (order.status !== "out_for_delivery" || order.riderName !== rider.name) {
      throw new Error("This order is no longer assigned to you.");
    }

    await updateDoc(orderRef, {
      status: "delivered",
      deliveredAt: serverTimestamp()
    });

    alert("Delivery marked as completed.");
  } catch (error) {
    alert(error.message || "Could not update delivery.");
  } finally {
    button.disabled = false;
  }
}

$("logoutBtn").addEventListener("click", () => {
  stopActive?.();
  stopHistory?.();
  rider = null;
  soundEnabled = false;
  $("dashboard").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  $("riderName").value = "";
  $("riderPhone").value = "";
  $("soundStatus").textContent = "Sound is not enabled.";
  $("soundBtn").textContent = "🔔 Enable New Order Sound";
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(console.warn);
}
</script>
</body>
</html>
