<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Duty App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .rider-card { border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .earning-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        #main-app { display: none; }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="pb-24">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6 text-white text-center">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-8 shadow-2xl text-slate-800">
            <div class="w-20 h-20 bg-slate-900 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-xl border-4 border-white">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-800 mb-6 italic tracking-tighter uppercase">Rider Login</h2>
            <div class="space-y-3">
                <input type="text" id="riderNameInput" placeholder="YOUR NAME" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-center">
                <input type="password" id="riderPassInput" placeholder="PASS KEY" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-center">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl uppercase text-xs tracking-widest">Start Duty 🚀</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2rem]">
            <div>
                <p id="currentDateDisplay" class="text-[9px] font-black text-orange-500 uppercase tracking-widest"></p>
                <h1 id="displayRiderName" class="text-xl font-800 italic text-slate-900">Rider</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-2 h-2 bg-green-500 rounded-full pulse-green"></div>
                <button onclick="logoutRider()" class="text-slate-300"><i class="fa-solid fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <section class="p-4 grid grid-cols-2 gap-3">
            <div class="earning-card p-5 rounded-[2rem] text-white">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Today's Earnings</p>
                <h3 id="todayEarning" class="text-3xl font-800">₹0</h3>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Lifetime Wallet</p>
                <h3 id="lifetimeEarning" class="text-3xl font-800 text-slate-900">₹0</h3>
            </div>
        </section>

        <main class="p-4 max-w-lg mx-auto">
            <h2 class="text-xs font-900 text-slate-400 uppercase tracking-widest mb-4 ml-2">Active Tasks</h2>
            <div id="rider-orders-list" class="space-y-5"></div>
        </main>
    </div>

    <audio id="orderAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 USE YOUR CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Auth Management ---
        window.checkRiderLogin = () => {
            const name = document.getElementById('riderNameInput').value.trim().toUpperCase();
            const pass = document.getElementById('riderPassInput').value;
            if(pass === "freshfry2026") {
                sessionStorage.setItem('rider_auth', 'true');
                sessionStorage.setItem('rider_name', name);
                unlockUI(name);
            } else { alert("Wrong Passkey!"); }
        };

        window.logoutRider = () => { sessionStorage.clear(); location.reload(); };

        function unlockUI(name) {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('displayRiderName').innerText = name;
            document.getElementById('currentDateDisplay').innerText = new Date().toDateString();
            loadEarningUI(name);
            loadMyOrders(name);
        }

        // --- Wallet Logic (LocalStorage for Persistency) ---
        function loadEarningUI(name) {
            const todayKey = `ff_earning_${name}_${new Date().toLocaleDateString().replace(/\//g, '')}`;
            const lifeKey = `ff_life_${name}`;
            
            document.getElementById('todayEarning').innerText = `₹${localStorage.getItem(todayKey) || 0}`;
            document.getElementById('lifetimeEarning').innerText = `₹${localStorage.getItem(lifeKey) || 0}`;
        }

        function updateWallet(name) {
            const todayKey = `ff_earning_${name}_${new Date().toLocaleDateString().replace(/\//g, '')}`;
            const lifeKey = `ff_life_${name}`;
            
            let todayVal = parseInt(localStorage.getItem(todayKey) || 0) + 20;
            let lifeVal = parseInt(localStorage.getItem(lifeKey) || 0) + 20;
            
            localStorage.setItem(todayKey, todayVal);
            localStorage.setItem(lifeKey, lifeVal);
            loadEarningUI(name);
        }

        // --- Real-time Orders & Notification ---
        let lastOrderCount = 0;
        function loadMyOrders(riderName) {
            const q = query(
                collection(db, "orders"), 
                where("status", "==", "out_for_delivery"),
                where("riderName", "==", riderName),
                orderBy("time", "desc")
            );

            onSnapshot(q, (snap) => {
                if(snap.size > lastOrderCount) {
                    document.getElementById('orderAudio').play(); // Play notification sound
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("New Order Assigned! 🏍️");
                    }
                }
                lastOrderCount = snap.size;

                const list = document.getElementById('rider-orders-list');
                list.innerHTML = '';

                if(snap.empty) {
                    list.innerHTML = `<div class="text-center py-20 bg-white rounded-[2.5rem] text-slate-300 font-bold border-2 border-dashed border-slate-100">Waiting for New Tasks...</div>`;
                    return;
                }

                snap.forEach(d => {
                    const order = d.data();
                    list.innerHTML += `
                    <div class="bg-white p-6 rider-card relative overflow-hidden">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-800 text-slate-900 tracking-tighter italic capitalize">${order.customerName || 'Freshfry Customer'}</h3>
                                <p class="text-xs font-bold text-orange-500">${order.customer || 'No Number'}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Collect Price</p>
                                <p class="text-xl font-900 text-slate-800">₹${order.total}</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-6">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-location-dot mr-1"></i> Delivery Address</p>
                            <p class="text-sm font-800 text-slate-700 leading-tight">${order.address}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}" target="_blank" class="bg-slate-100 text-slate-700 py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-xs uppercase tracking-tighter">
                                <i class="fa-solid fa-map-location-dot"></i> Navigate
                            </a>
                            <a href="tel:${order.customer}" class="bg-green-500 text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-xs shadow-lg shadow-green-100">
                                <i class="fa-solid fa-phone"></i> Call
                            </a>
                        </div>
                        
                        <button onclick="completeOrder('${d.id}')" class="w-full mt-3 bg-slate-900 text-white py-5 rounded-2xl font-black text-xs uppercase shadow-xl tracking-widest">Delivered & Collect ✅</button>
                        
                        <div class="mt-4 pt-4 border-t border-slate-50">
                             <p class="text-[9px] font-black text-slate-300 uppercase mb-2">Order Summary:</p>
                             ${order.items.map(i => `<span class="inline-block bg-gray-50 text-[10px] font-bold px-3 py-1 rounded-full mr-1 mb-1 border border-slate-100">${i.qty}x ${i.name}</span>`).join('')}
                             <p class="text-[10px] font-bold mt-2 text-slate-400 uppercase">Payment: <span class="text-blue-500">${order.paymentMethod || 'COD'}</span></p>
                        </div>
                    </div>`;
                });
            });
        }

        window.completeOrder = async (id) => {
            if(confirm("Order Delivered? Pocket ₹20 Earning?")) {
                await updateDoc(doc(db, "orders", id), { status: 'delivered' });
                updateWallet(sessionStorage.getItem('rider_name'));
                alert("Task Completed! ₹20 added to your wallet. 💸");
            }
        };

        // Persistent Login & Notifications Request
        if(sessionStorage.getItem('rider_auth') === 'true') {
            unlockUI(sessionStorage.getItem('rider_name'));
            if ("Notification" in window) Notification.requestPermission();
        }
    </script>
</body>
</html>
