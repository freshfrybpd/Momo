<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Partner | Rider App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F7FE; color: #1e293b; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .premium-card { background: white; border-radius: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); }
        .wallet-gradient { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .progress-container { height: 8px; background: #f1f5f9; border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff8a00, #ff5e00); transition: width 1s ease; }
        #main-app { display: none; }
        .pulse-online { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .bottom-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-36">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6 text-white">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-8 shadow-2xl text-slate-800">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-800 mb-6 text-center tracking-tighter italic">FRESH<span class="text-orange-500">FRY</span> PARTNER</h2>
            <div class="space-y-3">
                <input type="text" id="riderNameInput" placeholder="FULL NAME" class="w-full px-5 py-4 bg-slate-50 rounded-xl outline-none font-bold border focus:border-orange-500 uppercase text-xs">
                <input type="tel" id="riderPhoneInput" maxlength="10" placeholder="PHONE NUMBER" class="w-full px-5 py-4 bg-slate-50 rounded-xl outline-none font-bold border focus:border-orange-500 text-xs">
                <input type="text" id="riderUpiInput" placeholder="UPI ID" class="w-full px-5 py-4 bg-slate-50 rounded-xl outline-none font-bold border focus:border-orange-500 text-xs">
                <input type="password" id="riderPassInput" placeholder="PASS KEY" class="w-full px-5 py-4 bg-slate-50 rounded-xl outline-none font-bold border focus:border-orange-500 text-xs">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-xl font-black uppercase text-[10px] tracking-widest mt-2 active:scale-95 transition-all">Start Duty 🚀</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <nav class="glass-nav px-6 py-5 sticky top-0 z-50 flex justify-between items-center">
            <div>
                <h1 id="displayRiderName" class="text-sm font-800 text-slate-900 uppercase italic leading-none">Rider</h1>
                <p id="displayRiderUpi" class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-widest"></p>
            </div>
            <button id="statusToggle" onclick="toggleDuty()" class="px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all bg-green-500 text-white pulse-online">Online</button>
        </nav>

        <section class="p-6 space-y-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                <div class="flex justify-between items-end mb-2">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Daily Goal (₹500)</p>
                    <p id="goalPercent" class="text-xs font-900 text-orange-500 italic">0%</p>
                </div>
                <div class="progress-container">
                    <div id="goalProgress" class="progress-fill" style="width: 0%"></div>
                </div>
                <p id="goalMessage" class="text-[9px] font-bold text-slate-500 uppercase italic mt-2">Loading progress...</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="wallet-gradient p-6 rounded-[2.5rem] text-white">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Today's Pay</p>
                    <h3 id="todayEarning" class="text-2xl font-800 italic tracking-tighter">₹0</h3>
                </div>
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Orders</p>
                    <h3 id="orderCountDisplay" class="text-2xl font-800 italic text-slate-900 tracking-tighter">0</h3>
                </div>
            </div>

            <h2 class="text-[10px] font-900 uppercase text-slate-400 px-2 tracking-[0.2em]">Active Tasks</h2>
            <div id="rider-orders-list" class="space-y-6"></div>

            <h2 class="text-[10px] font-900 uppercase text-slate-400 px-2 tracking-[0.2em] mt-8">Recent History</h2>
            <div id="rider-history-list" class="space-y-3 pb-10"></div>
        </section>

        <div class="fixed bottom-6 left-6 right-6 bottom-nav rounded-[2rem] p-4 flex justify-around items-center shadow-2xl z-50">
            <button class="text-orange-500 text-xl w-12 h-12 flex items-center justify-center bg-white/10 rounded-2xl"><i class="fa-solid fa-house"></i></button>
            <button onclick="location.reload()" class="text-slate-400 text-xl"><i class="fa-solid fa-rotate"></i></button>
            <button onclick="logoutRider()" class="text-red-400 text-xl"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, setDoc, serverTimestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- DISTANCE CALCULATION (HAIVERSINE) ---
        function calculateDistance(lat2, lon2) {
            const shopLat = 21.9348; 
            const shopLon = 86.7513; 
            const R = 6371; 
            const dLat = (lat2 - shopLat) * Math.PI / 180;
            const dLon = (lon2 - shopLon) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(shopLat * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        window.checkRiderLogin = async () => {
            const name = document.getElementById('riderNameInput').value.trim().toUpperCase();
            const phone = document.getElementById('riderPhoneInput').value.trim();
            const upi = document.getElementById('riderUpiInput').value.trim().toLowerCase();
            const pass = document.getElementById('riderPassInput').value;
            if (name.length < 3 || !/^[6-9]\d{9}$/.test(phone) || !upi.includes('@') || pass !== "freshfry2026") return alert("Invalid Details!");
            
            await setDoc(doc(db, "riders", name), { riderName: name, riderPhone: phone, riderUpi: upi, status: "Online", lastLogin: serverTimestamp() }, { merge: true });
            sessionStorage.setItem('rider_auth', 'true');
            sessionStorage.setItem('rider_name', name);
            sessionStorage.setItem('rider_upi', upi);
            unlockUI(name);
        };

        function unlockUI(name) {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('displayRiderName').innerText = name;
            document.getElementById('displayRiderUpi').innerText = sessionStorage.getItem('rider_upi');
            const today = new Date().toLocaleDateString();
            if (localStorage.getItem(`ff_date_${name}`) !== today) {
                localStorage.setItem(`ff_earn_${name}`, 0);
                localStorage.setItem(`ff_orders_${name}`, 0);
                localStorage.setItem(`ff_date_${name}`, today);
            }
            loadEarningUI(name);
            loadMyOrders(name);
            loadHistory(name);
        }

        function loadEarningUI(name) {
            const earn = parseInt(localStorage.getItem(`ff_earn_${name}`) || 0);
            const orders = localStorage.getItem(`ff_orders_${name}`) || 0;
            document.getElementById('todayEarning').innerText = `₹${earn}`;
            document.getElementById('orderCountDisplay').innerText = orders;
            
            const goal = 500;
            const percent = Math.min((earn / goal) * 100, 100).toFixed(0);
            document.getElementById('goalProgress').style.width = percent + '%';
            document.getElementById('goalPercent').innerText = percent + '%';
            document.getElementById('goalMessage').innerText = earn >= goal ? "Goal Achieved! 🏆" : `${Math.ceil((goal-earn)/20)} more orders to reach ₹500`;
        }

        function loadMyOrders(riderName) {
            const q = query(collection(db, "orders"), where("status", "==", "out_for_delivery"), where("riderName", "==", riderName));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('rider-orders-list');
                list.innerHTML = '';
                if(snap.empty) {
                    list.innerHTML = `<div class="bg-white p-12 rounded-[2rem] text-center text-slate-300 font-bold uppercase text-[10px] tracking-widest border border-dashed border-slate-200 italic">No orders assigned</div>`;
                    return;
                }
                snap.forEach(d => {
                    const o = d.data();
                    let navBtnHtml = '';
                    let distHtml = '';
                    
                    // Same OLD logic for Map & Distance
                    const mapLinkMatch = o.customerLocation.match(/q=([\d.-]+),([\d.-]+)/);
                    if(mapLinkMatch) {
                        const dist = calculateDistance(parseFloat(mapLinkMatch[1]), parseFloat(mapLinkMatch[2]));
                        distHtml = `<div class="bg-orange-500 text-white px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-tighter italic">📍 ${dist} KM AWAY</div>`;
                        navBtnHtml = `<a href="${o.customerLocation}" target="_blank" class="flex items-center gap-4 bg-orange-50 p-4 rounded-2xl border border-orange-100 active:scale-95 transition">
                            <div class="h-10 w-10 bg-orange-500 text-white rounded-xl flex items-center justify-center shadow-lg"><i class="fa-solid fa-location-arrow"></i></div>
                            <span class="font-800 text-sm text-orange-700 italic uppercase">Navigate to Location</span>
                        </a>`;
                    } else {
                        const searchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customerLocation)}`;
                        navBtnHtml = `<a href="${searchUrl}" target="_blank" class="flex items-center gap-4 bg-slate-100 p-4 rounded-2xl border border-slate-200"><div class="h-10 w-10 bg-slate-800 text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-magnifying-glass-location"></i></div><span class="font-800 text-sm text-slate-700 italic uppercase">Search Address</span></a>`;
                    }

                    list.innerHTML += `<div class="premium-card p-6 border-l-8 border-orange-500">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-xl font-800 text-slate-900 tracking-tighter uppercase italic">${o.customerName}</h3>
                                <p class="text-[9px] font-black text-orange-500 uppercase tracking-widest mt-1">ORDER ID #${d.id.slice(-5)}</p>
                            </div>
                            <div class="text-right">
                                ${distHtml}
                                <h3 class="text-xl font-900 text-slate-900 mt-1">₹${o.total}</h3>
                            </div>
                        </div>
                        <div class="space-y-3 mb-6">
                            <a href="tel:${o.customerPhone}" class="flex items-center gap-4 bg-blue-50 p-4 rounded-2xl border border-blue-100 active:scale-95 transition"><div class="h-10 w-10 bg-blue-500 text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-phone"></i></div><span class="font-800 text-sm text-blue-700 uppercase italic">CALL CUSTOMER</span></a>
                            ${navBtnHtml}
                            <div class="flex items-start gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <i class="fa-solid fa-location-dot text-slate-400 mt-1"></i>
                                <span class="text-[11px] font-bold text-slate-500 leading-tight">${o.customerLocation}</span>
                            </div>
                        </div>
                        <div class="bg-slate-900 p-6 rounded-[1.5rem] shadow-xl">
                            <p class="text-center text-[9px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4">Verification PIN</p>
                            <input type="tel" id="pin-${d.id}" maxlength="4" placeholder="••••" class="w-full bg-white/5 border border-white/10 text-center text-3xl font-900 tracking-[1.2rem] outline-none text-white py-3 rounded-xl">
                            <button onclick="verifyAndDeliver('${d.id}', '${o.orderPin}')" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest mt-5 active:scale-95 italic">Complete Delivery 🔥</button>
                        </div>
                    </div>`;
                });
            });
        }

        function loadHistory(riderName) {
            const q = query(collection(db, "orders"), where("status", "==", "delivered"), where("riderName", "==", riderName), orderBy("deliveredAt", "desc"), limit(5));
            onSnapshot(q, (snap) => {
                const histList = document.getElementById('rider-history-list');
                histList.innerHTML = '';
                if(snap.empty) { histList.innerHTML = `<p class="text-center text-[10px] text-slate-400 font-bold py-4 italic uppercase">No tasks completed yet</p>`; return; }
                snap.forEach(d => {
                    const o = d.data();
                    histList.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-50 shadow-sm"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></div><div><p class="text-[11px] font-800 text-slate-800 uppercase italic">${o.customerName}</p><p class="text-[8px] font-bold text-slate-400 uppercase">Order #${d.id.slice(-5)}</p></div></div><p class="font-900 text-sm text-green-600">+₹20</p></div>`;
                });
            });
        }

        window.verifyAndDeliver = async (orderId, correctPin) => {
            const inputPin = document.getElementById(`pin-${orderId}`).value;
            if(String(inputPin) === String(correctPin)) {
                const name = sessionStorage.getItem('rider_name');
                await updateDoc(doc(db, "orders", orderId), { status: 'delivered', deliveredAt: serverTimestamp() });
                let todayEarn = parseInt(localStorage.getItem(`ff_earn_${name}`) || 0) + 20;
                let orders = parseInt(localStorage.getItem(`ff_orders_${name}`) || 0) + 1;
                localStorage.setItem(`ff_earn_${name}`, todayEarn);
                localStorage.setItem(`ff_orders_${name}`, orders);
                loadEarningUI(name);
                alert("Order Delivered! ₹20 added to your wallet.");
            } else { alert("Incorrect PIN!"); }
        };

        window.toggleDuty = async () => {
            const name = sessionStorage.getItem('rider_name');
            const btn = document.getElementById('statusToggle');
            const isOnline = btn.innerText === "Online";
            const newStatus = isOnline ? "Offline" : "Online";
            await updateDoc(doc(db, "riders", name), { status: newStatus });
            btn.innerText = newStatus;
            btn.className = `px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all ${newStatus === 'Online' ? 'bg-green-500 pulse-online' : 'bg-slate-400'} text-white`;
        };

        window.logoutRider = async () => {
            if (confirm("Logout?")) {
                const name = sessionStorage.getItem('rider_name');
                await updateDoc(doc(db, "riders", name), { status: "Offline" });
                sessionStorage.clear();
                location.reload();
            }
        };

        if(sessionStorage.getItem('rider_auth') === 'true') unlockUI(sessionStorage.getItem('rider_name'));
    </script>
</body>
</html>
