<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; display: none; }
        .rider-card { border-radius: 2.5rem; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2.5rem]">
        <div>
            <h1 class="text-xl font-800 italic">Freshfry <span class="text-orange-500">Rider.</span></h1>
            <div class="flex items-center gap-1.5 mt-1">
                <div class="w-2 h-2 bg-green-500 rounded-full pulse-green"></div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Active & Online</p>
            </div>
        </div>
        <div class="bg-gray-100 px-4 py-2 rounded-2xl">
            <p class="text-[10px] font-black text-gray-400 uppercase">Today's Deliveries</p>
            <p id="delivery-count" class="text-lg font-800 text-center">0</p>
        </div>
    </nav>

    <main class="p-4 space-y-4 max-w-lg mx-auto mt-4">
        <h2 class="text-sm font-800 text-gray-400 uppercase tracking-widest px-2">Assigned Tasks</h2>
        
        <div id="rider-orders-list" class="space-y-4">
            <div class="text-center py-20 bg-white rounded-[3rem] border border-dashed border-gray-300">
                <i class="fa-solid fa-box-open text-4xl text-gray-200 mb-4"></i>
                <p class="text-gray-400 font-bold">Waiting for new orders...</p>
            </div>
        </div>
    </main>

    <script type="module">
        // --- 1. Security Logic ---
        const pass = prompt("Partner Access Password:");
        if (pass !== "freshfry2026") {
            alert("Access Denied!");
            window.location.href = "index.html";
        } else {
            document.body.style.display = "block";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let previousCount = 0;
        let deliveriesDone = localStorage.getItem('rider_deliveries') || 0;
        document.getElementById('delivery-count').innerText = deliveriesDone;

        // --- 2. Real-time Order Tracking ---
        const q = query(collection(db, "orders"), orderBy("time", "desc"));
        
        onSnapshot(q, (snap) => {
            const list = document.getElementById('rider-orders-list');
            
            // Sound Alert for new orders
            if (snap.size > previousCount && previousCount !== 0) {
                document.getElementById('orderSound').play();
            }
            previousCount = snap.size;

            if(snap.empty) {
                list.innerHTML = `<div class="text-center py-20 bg-white rounded-[3rem] border-dashed border-2 border-gray-100 text-gray-400 font-bold">No Pending Orders</div>`;
                return;
            }

            list.innerHTML = '';
            snap.forEach(d => {
                const order = d.data();
                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address + " " + order.location + " Baripada")}`;

                list.innerHTML += `
                <div class="bg-white p-6 rider-card shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="bg-orange-500 text-white text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-tighter">Instant Delivery</span>
                            <h3 class="text-xl font-800 mt-2 text-gray-900">${order.location}</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black text-gray-400 uppercase">Cash to Collect</p>
                            <p class="text-lg font-800 text-orange-600">${order.total}</p>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <a href="tel:${order.customer}" class="flex-1 bg-green-500 text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-sm shadow-lg shadow-green-100">
                            <i class="fa-solid fa-phone"></i> CALL CUSTOMER
                        </a>
                        <a href="${googleMapsUrl}" target="_blank" class="w-16 bg-blue-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-100">
                            <i class="fa-solid fa-location-arrow text-xl"></i>
                        </a>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-100">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-1">Drop Location:</p>
                        <p class="text-sm font-bold text-gray-700 leading-relaxed">${order.address}</p>
                    </div>

                    <div class="mb-6 px-1">
                        <p class="text-[10px] font-black text-gray-400 uppercase mb-3">Items in Box:</p>
                        <div class="space-y-2">
                            ${order.items.map(item => `
                                <div class="flex justify-between items-center text-sm">
                                    <span class="font-bold text-gray-800">${item.qty} x ${item.name}</span>
                                    <i class="fa-solid fa-circle-check text-green-200"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="markDelivered('${d.id}')" class="w-full bg-gray-900 text-white py-5 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] hover:bg-green-600 transition-all shadow-xl">
                        Order Delivered ✅
                    </button>
                </div>`;
            });
        });

        // --- 3. Complete Order Logic ---
        window.markDelivered = async (id) => {
            if(confirm("Confirm delivery and payment collection?")) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    
                    // Update Earnings Tracker
                    deliveriesDone++;
                    localStorage.setItem('rider_deliveries', deliveriesDone);
                    document.getElementById('delivery-count').innerText = deliveriesDone;
                    
                    alert("Order Delivered! Keep it up. 🚀");
                } catch(e) { alert("Error finishing order."); }
            }
        };
    </script>
</body>
</html>
