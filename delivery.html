<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; display: none; }
        .rider-card { border-radius: 2.5rem; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-8 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-100 rounded-full opacity-50"></div>
            <div class="relative w-24 h-24 bg-slate-900 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-xl border-4 border-white">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-900 text-slate-800 mb-1 italic">Rider<span class="text-orange-500">Connect.</span></h2>
            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-8">Delivery Partner Login</p>
            <div class="space-y-4 relative z-10">
                <input type="password" id="riderPassInput" placeholder="Enter Rider Key" 
                    class="w-full px-6 py-5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-black text-center text-lg transition-all text-slate-700">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase tracking-[0.2em] text-xs">
                    Start My Shift 🚀
                </button>
            </div>
        </div>
    </div>

    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2.5rem]">
        <div>
            <h1 class="text-xl font-800 italic">Freshfry <span class="text-orange-500">Rider.</span></h1>
            <div class="flex items-center gap-1.5 mt-1">
                <div class="w-2 h-2 bg-green-500 rounded-full pulse-green"></div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Active & Online</p>
            </div>
        </div>
        <div class="bg-gray-100 px-4 py-2 rounded-2xl">
            <p class="text-[10px] font-black text-gray-400 uppercase">Today's Deliveries</p>
            <p id="delivery-count" class="text-lg font-800 text-center">0</p>
        </div>
    </nav>

    <main class="p-4 space-y-4 max-w-lg mx-auto mt-4">
        <h2 class="text-sm font-800 text-gray-400 uppercase tracking-widest px-2">Assigned Tasks</h2>
        <div id="rider-orders-list" class="space-y-4">
            <div class="text-center py-20 bg-white rounded-[3rem] border border-dashed border-gray-300">
                <i class="fa-solid fa-box-open text-4xl text-gray-200 mb-4"></i>
                <p class="text-gray-400 font-bold">Waiting for new orders...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let previousCount = 0;
        let deliveriesDone = localStorage.getItem('rider_deliveries') || 0;
        document.getElementById('delivery-count').innerText = deliveriesDone;

        // --- Login Logic ---
        window.checkRiderLogin = () => {
            const pass = document.getElementById('riderPassInput').value;
            if(pass === "freshfry2026") {
                document.getElementById('rider-login-screen').style.transform = "translateY(-100%)";
                setTimeout(() => {
                    document.getElementById('rider-login-screen').style.display = 'none';
                    document.body.style.display = 'block';
                }, 600);
                sessionStorage.setItem('riderActive', 'true');
            } else {
                alert("Incorrect Key!");
            }
        };

        // --- Real-time Orders ---
        const q = query(collection(db, "orders"), orderBy("time", "desc"));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('rider-orders-list');
            if (snap.size > previousCount && previousCount !== 0) document.getElementById('orderSound').play();
            previousCount = snap.size;

            if(snap.empty) {
                list.innerHTML = `<div class="text-center py-20 bg-white rounded-[3rem] text-gray-400 font-bold">No Pending Orders</div>`;
                return;
            }

            list.innerHTML = '';
            snap.forEach(d => {
                const order = d.data();
                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address + " " + order.location + " Baripada")}`;

                list.innerHTML += `
                <div class="bg-white p-6 rider-card shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="bg-orange-500 text-white text-[9px] font-black px-3 py-1 rounded-full uppercase">Instant Delivery</span>
                            <h3 class="text-xl font-800 mt-2 text-gray-900">${order.location}</h3>
                        </div>
                        <p class="text-lg font-800 text-orange-600">${order.total}</p>
                    </div>
                    <div class="flex gap-2 mb-6">
                        <a href="tel:${order.customer}" class="flex-1 bg-green-500 text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-sm"><i class="fa-solid fa-phone"></i> CALL</a>
                        <a href="${googleMapsUrl}" target="_blank" class="w-16 bg-blue-500 text-white rounded-2xl flex items-center justify-center"><i class="fa-solid fa-location-arrow text-xl"></i></a>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-100 text-sm font-bold text-gray-700">${order.address}</div>
                    <button onclick="markDelivered('${d.id}')" class="w-full bg-gray-900 text-white py-5 rounded-[2rem] font-black text-xs uppercase tracking-widest">Order Delivered ✅</button>
                </div>`;
            });
        });

        window.markDelivered = async (id) => {
            if(confirm("Delivery complete?")) {
                await deleteDoc(doc(db, "orders", id));
                deliveriesDone++;
                localStorage.setItem('rider_deliveries', deliveriesDone);
                document.getElementById('delivery-count').innerText = deliveriesDone;
            }
        };

        if(sessionStorage.getItem('riderActive') === 'true') {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.body.style.display = 'block';
        }
    </script>
</body>
</html>
