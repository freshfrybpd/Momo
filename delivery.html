<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Secure Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .rider-card { border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        #main-app { display: none; }
    </style>
</head>
<body class="pb-24">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6 text-white text-center">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-10 shadow-2xl text-slate-800">
            <h2 class="text-2xl font-800 mb-6 uppercase tracking-tighter">Rider Login</h2>
            <div class="space-y-3">
                <input type="text" id="riderNameInput" placeholder="NAME" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center uppercase">
                <input type="password" id="riderPassInput" placeholder="PASS KEY" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase text-[10px] tracking-widest">Start Duty 🚀</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2.5rem]">
            <div>
                <p id="currentDateDisplay" class="text-[9px] font-black text-orange-500 uppercase"></p>
                <h1 id="displayRiderName" class="text-xl font-800 italic text-slate-900 uppercase tracking-tighter">Rider</h1>
            </div>
            <button onclick="logoutRider()" class="text-red-500 bg-red-50 p-3 rounded-xl"><i class="fa-solid fa-power-off"></i></button>
        </nav>

        <main class="p-4 max-w-lg mx-auto space-y-5" id="rider-orders-list">
            </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- AUTH ---
        window.checkRiderLogin = async () => {
            const name = document.getElementById('riderNameInput').value.trim().toUpperCase();
            const pass = document.getElementById('riderPassInput').value;
            if(pass === "freshfry2026") {
                await setDoc(doc(db, "riders", name), { riderName: name, status: "Online", lastLogin: serverTimestamp() }, { merge: true });
                sessionStorage.setItem('rider_auth', 'true');
                sessionStorage.setItem('rider_name', name);
                unlockUI(name);
            } else { alert("Wrong Key!"); }
        };

        window.logoutRider = async () => {
            const name = sessionStorage.getItem('rider_name');
            if (confirm("Go Offline?")) {
                await updateDoc(doc(db, "riders", name), { status: "Offline" });
                sessionStorage.clear();
                location.reload();
            }
        };

        function unlockUI(name) {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('displayRiderName').innerText = name;
            loadMyOrders(name);
        }

        // --- ORDER LIST WITH PIN INPUT ---
        function loadMyOrders(riderName) {
            const q = query(collection(db, "orders"), where("status", "==", "out_for_delivery"), where("riderName", "==", riderName));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('rider-orders-list');
                list.innerHTML = '';
                
                snap.forEach(d => {
                    const order = d.data();
                    list.innerHTML += `
                    <div class="bg-white p-8 rider-card">
                        <div class="flex justify-between mb-4">
                            <h3 class="text-xl font-800 uppercase italic">${order.customerName}</h3>
                            <p class="text-2xl font-900 italic text-orange-500">₹${order.total}</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl mb-6 text-sm font-bold text-slate-600">
                            ${order.address}
                        </div>
                        
                        <div class="mb-6">
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-2 tracking-widest">Ask Customer for PIN:</p>
                            <input type="tel" id="pin-${d.id}" maxlength="4" placeholder="ENTER 4-DIGIT PIN" 
                                class="w-full bg-slate-100 border-2 border-slate-100 focus:border-orange-500 rounded-2xl py-4 text-center text-xl font-900 tracking-[0.5em] outline-none transition-all">
                        </div>

                        <button onclick="verifyAndDeliver('${d.id}', ${order.deliveryPin})" 
                            class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-xl">
                            Verify & Deliver ✅
                        </button>
                    </div>`;
                });
            });
        }

        // --- PIN VERIFICATION LOGIC ---
        window.verifyAndDeliver = async (orderId, correctPin) => {
            const enteredPin = document.getElementById(`pin-${orderId}`).value;
            
            if(enteredPin == correctPin) {
                try {
                    await updateDoc(doc(db, "orders", orderId), { status: 'delivered' });
                    // Update Local Wallet Logic (Optional)
                    alert("PIN Matched! Order Delivered Successfully 💸");
                } catch (e) { alert("Error updating order."); }
            } else {
                alert("❌ Wrong PIN! Please ask the customer for the correct 4-digit code.");
                document.getElementById(`pin-${orderId}`).classList.add('border-red-500');
            }
        };

        if(sessionStorage.getItem('rider_auth') === 'true') unlockUI(sessionStorage.getItem('rider_name'));
    </script>
</body>
</html>
