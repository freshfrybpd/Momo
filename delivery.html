<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .order-card { background: #1e293b; border-radius: 24px; border: 1px solid #334155; transition: 0.3s; }
        .active-glow { box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); border: 1px solid #f97316; }
        .btn-call { background: linear-gradient(135deg, #22c55e, #16a34a); }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const riderId = "FF992";

        // Real-time Listeners
        const ordersList = document.getElementById('orders-list');
        const activeContainer = document.getElementById('active-order-container');

        // 1. Listen for Pending Orders
        onSnapshot(query(collection(db, "orders"), where("status", "==", "pending")), (snap) => {
            ordersList.innerHTML = '';
            if(snap.empty) ordersList.innerHTML = '<div class="text-center py-10 opacity-30 text-sm italic">Waiting for new orders...</div>';
            snap.forEach(d => renderNewOrder(d.id, d.data()));
        });

        // 2. Listen for My Active Order
        onSnapshot(query(collection(db, "orders"), where("riderId", "==", riderId), where("status", "==", "accepted")), (snap) => {
            activeContainer.innerHTML = '';
            snap.forEach(d => renderActiveOrder(d.id, d.data()));
        });

        function renderNewOrder(id, data) {
            ordersList.innerHTML += `
                <div class="order-card p-5 mb-4 animate-pulse">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-400 font-bold tracking-widest">NEW REQUEST</span>
                        <span class="text-orange-500 font-black">${data.price || '₹100'}</span>
                    </div>
                    <p class="font-bold text-white mb-4">📍 ${data.itemName || 'Momo Combo'}</p>
                    <div class="flex gap-2">
                        <button onclick="updateStatus('${id}', 'accepted')" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold">Accept Order</button>
                    </div>
                </div>`;
        }

        function renderActiveOrder(id, data) {
            activeContainer.innerHTML = `
                <div class="order-card active-glow p-6 mb-8 bg-slate-800/50">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-xs text-orange-500 font-black uppercase tracking-tighter">On Delivery</p>
                            <h2 class="text-xl font-black text-white">Order #${id.slice(-4)}</h2>
                        </div>
                        <a href="tel:9199999999" class="btn-call w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-lg">
                            <i class="fa-solid fa-phone"></i>
                        </a>
                    </div>
                    <div class="space-y-4 mb-6">
                        <div class="flex items-start gap-3">
                            <i class="fa-solid fa-circle-dot text-orange-500 mt-1 text-xs"></i>
                            <p class="text-sm">Pickup: <span class="text-slate-400">Freshfry Kitchen</span></p>
                        </div>
                        <div class="flex items-start gap-3">
                            <i class="fa-solid fa-location-arrow text-blue-500 mt-1 text-xs"></i>
                            <p class="text-sm">Customer: <span class="text-white font-bold">${data.category || 'Baripada User'}</span></p>
                        </div>
                    </div>
                    <button onclick="updateStatus('${id}', 'delivered')" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black shadow-xl">MARK AS DELIVERED</button>
                </div>`;
        }

        window.updateStatus = async (id, status) => {
            const ref = doc(db, "orders", id);
            await updateDoc(ref, { status, riderId });
            if(status === 'delivered') alert("Good Job! Earnings added to wallet.");
        };
    </script>

    <nav class="p-6 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center font-black">R</div>
            <div>
                <p class="text-[10px] text-slate-500 font-bold">RIDER #FF992</p>
                <p class="text-sm font-bold">Rahul Sharma</p>
            </div>
        </div>
        <div class="bg-green-500/10 border border-green-500/20 px-3 py-1 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-green-500 text-[10px] font-bold">ONLINE</span>
        </div>
    </nav>

    <main class="p-6">
        <div id="active-order-container"></div>

        <h3 class="text-sm font-black text-slate-500 uppercase tracking-widest mb-4">Nearby Requests</h3>
        <div id="orders-list">
            <div class="text-center py-10 opacity-50">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                <p class="text-xs">Searching for orders...</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 w-full bg-slate-900/80 backdrop-blur-md border-t border-slate-800 p-4 flex justify-around items-center">
        <i class="fa-solid fa-motorcycle text-orange-500 text-xl"></i>
        <i class="fa-solid fa-wallet text-slate-500 text-xl"></i>
        <i class="fa-solid fa-user text-slate-500 text-xl"></i>
    </div>

</body>
</html>
