<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Duty App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .rider-card { border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .earning-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        #main-app { display: none; }
        .pulse-green { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24 no-scrollbar">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6 text-white text-center">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-10 shadow-2xl text-slate-800">
            <div class="w-20 h-20 bg-slate-900 text-white rounded-[2rem] flex items-center justify-center text-3xl mx-auto mb-6 shadow-xl border-4 border-white">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-800 mb-2 italic tracking-tighter uppercase">Rider Login</h2>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8">Enter your duty details</p>
            <div class="space-y-3">
                <input type="text" id="riderNameInput" placeholder="YOUR NAME" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-center uppercase">
                <input type="password" id="riderPassInput" placeholder="PASS KEY" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-center">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl uppercase text-[10px] tracking-widest">Start My Duty 🚀</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2.5rem]">
            <div>
                <p id="currentDateDisplay" class="text-[9px] font-black text-orange-500 uppercase tracking-widest"></p>
                <h1 id="displayRiderName" class="text-xl font-800 italic text-slate-900 uppercase">Rider</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-2 h-2 bg-green-500 rounded-full pulse-green"></div>
                <button onclick="logoutRider()" class="text-slate-300 hover:text-red-500 transition"><i class="fa-solid fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <section class="p-4 grid grid-cols-2 gap-3">
            <div class="earning-card p-6 rounded-[2.5rem] text-white shadow-lg shadow-slate-200">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Today's Wallet</p>
                <h3 id="todayEarning" class="text-3xl font-800 tracking-tighter">₹0</h3>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Lifetime</p>
                <h3 id="lifetimeEarning" class="text-3xl font-800 text-slate-900 tracking-tighter">₹0</h3>
            </div>
        </section>

        <main class="p-4 max-w-lg mx-auto">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-xs font-900 text-slate-400 uppercase tracking-widest">Active Deliveries</h2>
                <span id="active-count" class="bg-orange-100 text-orange-600 text-[10px] px-2 py-1 rounded-lg font-black">0</span>
            </div>
            <div id="rider-orders-list" class="space-y-5">
                </div>
        </main>
    </div>

    <audio id="orderAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, updateDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Rider Authentication & Status Sync ---
        window.checkRiderLogin = async () => {
            const name = document.getElementById('riderNameInput').value.trim().toUpperCase();
            const pass = document.getElementById('riderPassInput').value;

            if(!name) return alert("Enter Name!");
            
            if(pass === "freshfry2026") {
                // ✅ Save/Update Rider in Firebase
                await setDoc(doc(db, "riders", name), {
                    riderName: name,
                    status: "Online",
                    lastLogin: new Date().toLocaleString(),
                    timestamp: serverTimestamp()
                }, { merge: true });

                sessionStorage.setItem('rider_auth', 'true');
                sessionStorage.setItem('rider_name', name);
                unlockUI(name);
            } else { 
                alert("Incorrect Key!"); 
            }
        };

        window.logoutRider = async () => {
            const name = sessionStorage.getItem('rider_name');
            if(name && confirm("End your duty?")) {
                await updateDoc(doc(db, "riders", name), { status: "Offline" });
                sessionStorage.clear();
                location.reload();
            }
        };

        function unlockUI(name) {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('displayRiderName').innerText = name;
            document.getElementById('currentDateDisplay').innerText = new Date().toDateString();
            loadEarningUI(name);
            loadMyOrders(name);
        }

        // --- Earning Logic ---
        function loadEarningUI(name) {
            const todayKey = `ff_earn_${name}_${new Date().toLocaleDateString().replace(/\//g,'')}`;
            const lifeKey = `ff_life_${name}`;
            document.getElementById('todayEarning').innerText = `₹${localStorage.getItem(todayKey) || 0}`;
            document.getElementById('lifetimeEarning').innerText = `₹${localStorage.getItem(lifeKey) || 0}`;
        }

        function updateWallet(name) {
            const todayKey = `ff_earn_${name}_${new Date().toLocaleDateString().replace(/\//g,'')}`;
            const lifeKey = `ff_life_${name}`;
            localStorage.setItem(todayKey, (parseInt(localStorage.getItem(todayKey)||0) + 20));
            localStorage.setItem(lifeKey, (parseInt(localStorage.getItem(lifeKey)||0) + 20));
            loadEarningUI(name);
        }

        // --- Real-time Order Fetching ---
        let lastCount = 0;
        function loadMyOrders(riderName) {
            const q = query(
                collection(db, "orders"),
                where("status", "==", "out_for_delivery"),
                where("riderName", "==", riderName)
            );

            onSnapshot(q, (snap) => {
                const list = document.getElementById('rider-orders-list');
                document.getElementById('active-count').innerText = snap.size;
                
                if(snap.size > lastCount) {
                    document.getElementById('orderAudio').play();
                    if(Notification.permission === "granted") new Notification("New Order Assigned! 🏍️");
                }
                lastCount = snap.size;
                list.innerHTML = '';

                if(snap.empty) {
                    list.innerHTML = `<div class="text-center py-20 bg-white rounded-[3rem] text-slate-300 font-bold border-2 border-dashed border-slate-50">Waiting for orders...</div>`;
                    return;
                }

                snap.forEach(d => {
                    const order = d.data();
                    list.innerHTML += `
                    <div class="bg-white p-6 rider-card relative overflow-hidden">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-800 text-slate-900 tracking-tighter italic uppercase">${order.customerName || 'Customer'}</h3>
                                <p class="text-xs font-bold text-orange-500">${order.customer}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Collect</p>
                                <p class="text-xl font-900 text-slate-800 tracking-tighter">₹${order.total}</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-6">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 italic">Delivery Address:</p>
                            <p class="text-sm font-800 text-slate-700 leading-tight">${order.address}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}" target="_blank" class="bg-slate-100 text-slate-700 py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-[10px] uppercase">
                                <i class="fa-solid fa-location-arrow"></i> Navigate
                            </a>
                            <a href="tel:${order.customer}" class="bg-green-500 text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-[10px] uppercase shadow-lg shadow-green-100">
                                <i class="fa-solid fa-phone"></i> Call User
                            </a>
                        </div>
                        
                        <button onclick="completeOrder('${d.id}')" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] shadow-xl">Delivered ✅</button>
                        
                        <div class="mt-5 pt-4 border-t border-slate-50 flex flex-wrap gap-2">
                             ${order.items.map(i => `<span class="bg-gray-100 text-[9px] font-black px-3 py-1 rounded-full text-slate-500 uppercase">${i.qty}x ${i.name}</span>`).join('')}
                        </div>
                        <p class="mt-3 text-[9px] font-bold text-slate-300 uppercase tracking-widest">Payment: <span class="text-blue-500">${order.paymentMethod || 'COD'}</span></p>
                    </div>`;
                });
            });
        }

        window.completeOrder = async (id) => {
            if(confirm("Confirm delivery? Payment received?")) {
                await updateDoc(doc(db, "orders", id), { status: 'delivered' });
                updateWallet(sessionStorage.getItem('rider_name'));
                alert("Order Finished! ₹20 Earned 💸");
            }
        };

        if(sessionStorage.getItem('rider_auth') === 'true') {
            unlockUI(sessionStorage.getItem('rider_name'));
            if(window.Notification) Notification.requestPermission();
        }
    </script>
</body>
</html>
