<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Rider | Secure Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .rider-card { border-radius: 2.5rem; border: 1px solid #f1f5f9; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.05); overflow: hidden; }
        #main-app { display: none; }
        .wallet-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #ff5e00; transition: width 0.5s ease; }
    </style>
</head>
<body class="pb-24">

    <div id="rider-login-screen" class="fixed inset-0 z-[100] bg-orange-500 flex items-center justify-center p-6 text-white text-center">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-10 shadow-2xl text-slate-800">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-800 mb-6 uppercase tracking-tighter">Rider Login</h2>
            <div class="space-y-3">
                <input type="text" id="riderNameInput" placeholder="FULL NAME" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center uppercase border focus:border-orange-500">
                <input type="tel" id="riderPhoneInput" maxlength="10" placeholder="10 DIGIT PHONE" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center border focus:border-orange-500">
                <input type="text" id="riderUpiInput" placeholder="UPI ID (e.g. 98xxxx@ybl)" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center border focus:border-orange-500 lowercase">
                <input type="password" id="riderPassInput" placeholder="PASS KEY" class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-center border focus:border-orange-500">
                <button onclick="checkRiderLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition">Start Duty 🚀</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center rounded-b-[2.5rem]">
            <div>
                <p id="currentDateDisplay" class="text-[9px] font-black text-orange-500 uppercase tracking-widest"></p>
                <h1 id="displayRiderName" class="text-xl font-800 italic text-slate-900 uppercase tracking-tighter">Rider</h1>
                <p id="displayRiderUpi" class="text-[8px] font-bold text-slate-400 mt-1"></p>
            </div>
            <div class="flex items-center gap-3">
                <button id="statusToggle" onclick="toggleDuty()" class="px-4 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-green-500 text-white">Online</button>
                <button onclick="logoutRider()" class="text-red-500 bg-red-50 p-3 rounded-xl active:scale-90 transition"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </nav>

        <section class="p-4 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="wallet-card p-6 rounded-[2.5rem] text-white shadow-xl">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Today's Earnings</p>
                    <h3 id="todayEarning" class="text-3xl font-800 italic tracking-tighter">₹0</h3>
                </div>
                <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Lifetime</p>
                    <h3 id="lifetimeEarning" class="text-3xl font-800 italic text-slate-900 tracking-tighter">₹0</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-[2rem] border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Daily Goal (10 Orders)</p>
                    <p id="orderCountDisplay" class="text-[10px] font-black text-orange-500">0/10</p>
                </div>
                <div class="progress-bar">
                    <div id="goalFill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <main class="p-4 max-w-lg mx-auto space-y-6" id="rider-orders-list"></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- AUTH & VALIDATION ---
        window.checkRiderLogin = async () => {
            const name = document.getElementById('riderNameInput').value.trim().toUpperCase();
            const phone = document.getElementById('riderPhoneInput').value.trim();
            const upi = document.getElementById('riderUpiInput').value.trim().toLowerCase();
            const pass = document.getElementById('riderPassInput').value;

            if (name.length < 3) return alert("Enter valid name");
            if (phone.length !== 10) return alert("Enter valid 10-digit number");
            if (!upi.includes('@')) return alert("Enter a valid UPI ID (e.g. 98xxxx@ybl)");
            if (pass !== "freshfry2026") return alert("Wrong Pass Key!");

            await setDoc(doc(db, "riders", name), { 
                riderName: name, 
                riderPhone: phone,
                riderUpi: upi,
                status: "Online", 
                lastLogin: serverTimestamp() 
            }, { merge: true });

            sessionStorage.setItem('rider_auth', 'true');
            sessionStorage.setItem('rider_name', name);
            sessionStorage.setItem('rider_upi', upi);
            unlockUI(name);
        };

        window.toggleDuty = async () => {
            const name = sessionStorage.getItem('rider_name');
            const btn = document.getElementById('statusToggle');
            const isOnline = btn.innerText === "Online";
            
            const newStatus = isOnline ? "Offline" : "Online";
            await updateDoc(doc(db, "riders", name), { status: newStatus });
            
            btn.innerText = newStatus;
            btn.className = `px-4 py-2 rounded-full text-[10px] font-black uppercase transition-all ${newStatus === 'Online' ? 'bg-green-500' : 'bg-slate-400'} text-white`;
        };

        window.logoutRider = async () => {
            if (confirm("Go Offline and Logout?")) {
                const name = sessionStorage.getItem('rider_name');
                await updateDoc(doc(db, "riders", name), { status: "Offline" });
                sessionStorage.clear();
                location.reload();
            }
        };

        function unlockUI(name) {
            document.getElementById('rider-login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('displayRiderName').innerText = name;
            document.getElementById('displayRiderUpi').innerText = "UPI: " + sessionStorage.getItem('rider_upi');
            document.getElementById('currentDateDisplay').innerText = new Date().toDateString();
            
            const lastDate = localStorage.getItem(`ff_date_${name}`);
            const today = new Date().toLocaleDateString();
            if (lastDate !== today) {
                localStorage.setItem(`ff_earn_${name}`, 0);
                localStorage.setItem(`ff_orders_${name}`, 0);
                localStorage.setItem(`ff_date_${name}`, today);
            }

            loadEarningUI(name);
            loadMyOrders(name);
        }

        function loadEarningUI(name) {
            const todayEarn = localStorage.getItem(`ff_earn_${name}`) || 0;
            const lifeEarn = localStorage.getItem(`ff_life_${name}`) || 0;
            const orders = localStorage.getItem(`ff_orders_${name}`) || 0;

            document.getElementById('todayEarning').innerText = `₹${todayEarn}`;
            document.getElementById('lifetimeEarning').innerText = `₹${lifeEarn}`;
            document.getElementById('orderCountDisplay').innerText = `${orders}/10`;
            document.getElementById('goalFill').style.width = `${Math.min((orders / 10) * 100, 100)}%`;
        }

        function loadMyOrders(riderName) {
            const q = query(collection(db, "orders"), where("status", "==", "out_for_delivery"), where("riderName", "==", riderName));
            
            let firstLoad = true;
            onSnapshot(q, (snap) => {
                const list = document.getElementById('rider-orders-list');
                
                if (!firstLoad && !snap.empty) {
                    if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                }
                firstLoad = false;

                list.innerHTML = '';
                if(snap.empty) {
                    list.innerHTML = `<div class="text-center py-20 text-slate-300 font-bold uppercase text-[10px] tracking-widest">Waiting for orders...</div>`;
                    return;
                }

                snap.forEach(d => {
                    const order = d.data();
                    list.innerHTML += `
                    <div class="bg-white p-8 rider-card border-t-8 border-orange-500">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-2xl font-900 uppercase italic tracking-tighter">${order.customerName}</h3>
                                <p class="text-[10px] font-black text-orange-500 uppercase">${order.customerPhone}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-900 text-slate-900 tracking-tighter">₹${order.total}</p>
                                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">${order.paymentMethod || 'Online'}</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-5 rounded-[1.5rem] mb-6">
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-2 tracking-widest">Customer Details:</p>
                            <a href="tel:${order.customerPhone}" class="text-blue-600 font-800 text-sm flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-phone"></i> ${order.customerPhone}
                            </a>
                            <p class="text-sm font-bold text-slate-700 leading-tight mb-4">${order.customerLocation}</p>
                            
                            <div class="mt-4 p-3 bg-white border border-slate-200 rounded-xl flex justify-between items-center">
                                 <div>
                                    <p class="text-[7px] font-black text-slate-400 uppercase">Rider UPI for Payment</p>
                                    <p class="text-[10px] font-bold text-slate-800">${sessionStorage.getItem('rider_upi')}</p>
                                 </div>
                                 <i class="fa-solid fa-qrcode text-slate-400"></i>
                            </div>
                        </div>
                        
                        <div class="bg-orange-50 p-6 rounded-[2rem] border-2 border-orange-100 mb-6 text-center">
                            <label class="text-[10px] font-black text-orange-600 uppercase tracking-widest">Verification PIN</label>
                            <input type="tel" id="pin-${d.id}" maxlength="4" placeholder="XXXX" 
                                class="w-full bg-transparent text-center text-4xl font-900 tracking-[1rem] outline-none text-slate-800 placeholder-orange-200">
                        </div>

                        <button onclick="verifyAndDeliver('${d.id}', ${order.deliveryPin})" 
                            class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition">
                            Delivered (Earn ₹20)
                        </button>
                    </div>`;
                });
            });
        }

        window.verifyAndDeliver = async (orderId, correctPin) => {
            const pinInput = document.getElementById(`pin-${orderId}`);
            if(pinInput.value == correctPin) {
                const name = sessionStorage.getItem('rider_name');
                await updateDoc(doc(db, "orders", orderId), { status: 'delivered' });
                
                // Update Local Wallet
                const todayEarn = parseInt(localStorage.getItem(`ff_earn_${name}`) || 0) + 20;
                const lifeEarn = parseInt(localStorage.getItem(`ff_life_${name}`) || 0) + 20;
                const orders = parseInt(localStorage.getItem(`ff_orders_${name}`) || 0) + 1;

                localStorage.setItem(`ff_earn_${name}`, todayEarn);
                localStorage.setItem(`ff_life_${name}`, lifeEarn);
                localStorage.setItem(`ff_orders_${name}`, orders);
                
                loadEarningUI(name);
                alert("Order Successful! ₹20 added.");
            } else {
                alert("Incorrect PIN!");
            }
        };

        if(sessionStorage.getItem('rider_auth') === 'true') unlockUI(sessionStorage.getItem('rider_name'));
    </script>
</body>
</html>
