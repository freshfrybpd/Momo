<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFry | Baripada's Best Momos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        .momo-card:active { transform: scale(0.98); }
        #cart-modal { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="login-section" class="min-h-screen flex items-center justify-center bg-orange-500 p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-black text-orange-600 mb-2 italic">FreshFry 🥟</h1>
            <p class="text-gray-500 mb-8 font-medium">Authentic Momos in Baripada</p>
            
            <div class="space-y-4">
                <input type="text" id="userName" placeholder="Apna Naam Likhein" class="w-full p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-400">
                <input type="tel" id="userPhone" placeholder="Mobile Number" class="w-full p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-400">
                
                <p class="text-left text-xs font-bold text-gray-400 uppercase ml-1">Select Delivery Area</p>
                <select id="areaSelector" class="w-full p-4 bg-gray-100 rounded-xl outline-none border-none font-semibold text-gray-700">
                    <option>Badbazar</option>
                    <option>Station Bazar</option>
                    <option>Bhanjpur</option>
                    <option>Baghra Road</option>
                    <option>Near Ambika Temple</option>
                    <option>Near Jagganath Temple</option>
                    <option>Other</option>
                </select>

                <button onclick="handleLogin()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-orange-700 transition transform active:scale-95">
                    Start Ordering
                </button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden pb-24">
        <nav class="sticky top-0 bg-white shadow-md p-4 flex justify-between items-center z-50">
            <div>
                <span class="text-[10px] text-gray-400 font-bold uppercase block">Delivering to</span>
                <span id="displayArea" class="font-bold text-orange-600 flex items-center">
                    <i class="fa-solid fa-location-dot mr-1"></i> Loading...
                </span>
            </div>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping text-2xl text-gray-800"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
            </div>
        </nav>

        <div class="p-4">
            <h2 class="text-2xl font-black text-gray-800">Momo Menu 🥢</h2>
            <p class="text-gray-400 text-sm">Freshly made, just for you.</p>
        </div>

        <div class="p-4 space-y-4" id="momo-list">
            </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-end">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8 shadow-2xl overflow-y-auto max-h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-800">Review Order 🛍️</h2>
                <button onclick="toggleCart()" class="text-gray-300 text-3xl">&times;</button>
            </div>
            
            <div id="cart-items-list" class="space-y-4 mb-8">
                </div>

            <div class="border-t-2 border-dashed pt-6">
                <div class="flex justify-between font-black text-xl mb-6">
                    <span>Total Bill:</span>
                    <span id="total-price" class="text-orange-600">₹0</span>
                </div>
                <button onclick="placeOrder()" id="order-btn" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl active:scale-95 transition">
                    Place Order Now
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = {};
        let cart = [];

        // 2. MENU DATA
        const momoMenu = [
            { id: 1, name: "Veg Steamed Momos", hPrice: 60, fPrice: 110, img: "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?w=300" },
            { id: 2, name: "Paneer Fried Momos", hPrice: 80, fPrice: 150, img: "https://images.unsplash.com/photo-1534422298391-e4f8c170db06?w=300" },
            { id: 3, name: "Chicken Steamed Momos", hPrice: 90, fPrice: 170, img: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=300" },
            { id: 4, name: "FreshFry Special Platter", hPrice: 120, fPrice: 220, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300" }
        ];

        // 3. LOGIN & RENDER
        async function handleLogin() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const area = document.getElementById('areaSelector').value;

            if(!name || !phone) return alert("Please enter your name and phone!");

            currentUser = { name, phone, area };
            document.getElementById('displayArea').innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i> ${area}`;
            
            // Switch Screens
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');

            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('momo-list');
            momoMenu.forEach(m => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl flex shadow-sm border border-gray-100 momo-card">
                        <img src="${m.img}" class="w-24 h-24 rounded-xl object-cover">
                        <div class="ml-4 flex-1">
                            <h3 class="font-extrabold text-gray-800">${m.name}</h3>
                            <p class="text-xs text-gray-400 italic">Freshly handmade</p>
                            <div class="mt-3 flex justify-between items-center">
                                <select id="size-${m.id}" class="text-sm font-bold bg-gray-50 border-none p-1 rounded">
                                    <option value="Half">Half - ₹${m.hPrice}</option>
                                    <option value="Full">Full - ₹${m.fPrice}</option>
                                </select>
                                <button onclick="addToCart(${m.id})" class="bg-orange-50 text-orange-600 border border-orange-200 px-4 py-1 rounded-lg font-black hover:bg-orange-600 hover:text-white transition-all">ADD</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 4. CART LOGIC
        function addToCart(id) {
            const item = momoMenu.find(m => m.id === id);
            const size = document.getElementById(`size-${id}`).value;
            const price = size === "Half" ? item.hPrice : item.fPrice;

            cart.push({ name: item.name, size, price });
            document.getElementById('cart-count').innerText = cart.length;
            
            // Notification
            const toast = document.createElement('div');
            toast.className = "fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl z-[110]";
            toast.innerText = `Added ${item.name} to bag!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
            renderCartDetails();
        }

        function renderCartDetails() {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = cart.length === 0 ? "<p class='text-center text-gray-400 py-10'>Your bag is empty 🥟</p>" : "";

            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl">
                        <div>
                            <p class="font-bold text-gray-800">${item.name}</p>
                            <p class="text-xs text-orange-500 font-bold">${item.size}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-black text-gray-700">₹${item.price}</span>
                            <button onclick="remove(${index})" class="text-gray-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('total-price').innerText = `₹${total}`;
        }

        function remove(i) {
            cart.splice(i, 1);
            document.getElementById('cart-count').innerText = cart.length;
            renderCartDetails();
        }

        // 5. FIREBASE PLACE ORDER
        async function placeOrder() {
            if(cart.length === 0) return alert("Kuch toh select karo bhai!");

            const btn = document.getElementById('order-btn');
            btn.disabled = true;
            btn.innerText = "Placing Order...";

            const orderData = {
                customer: currentUser.name,
                phone: currentUser.phone,
                location: currentUser.area,
                items: cart,
                total: cart.reduce((s, i) => s + i.price, 0),
                status: "Received",
                time: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("orders").add(orderData);
                alert("🎉 Order Successful! Hum aapko call karenge.");
                cart = [];
                document.getElementById('cart-count').innerText = "0";
                toggleCart();
            } catch (err) {
                alert("Error! Firebase Rules check karein.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Place Order Now";
            }
        }
    </script>
</body>
</html>
