<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Master Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }
        .food-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 12px; }
    </style>
</head>
<body class="flex">

    <aside class="w-64 h-screen bg-white border-r sticky top-0 hidden lg:block p-6">
        <div class="text-2xl font-black text-orange-500 mb-10">Freshfry<span class="text-gray-900">.</span></div>
        <nav class="space-y-2">
            <div class="p-3 text-orange-600 font-bold bg-orange-50 rounded-xl"><i class="fa-solid fa-grid-2 mr-3"></i> Dashboard</div>
            <div class="p-3 text-gray-400 font-semibold"><i class="fa-solid fa-utensils mr-3"></i> Menu Management</div>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-extrabold">Master Console</h1>
            <div class="flex items-center gap-2 bg-green-100 px-4 py-2 rounded-full text-green-700 font-bold text-xs animate-pulse">
                ● Store Online
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 h-fit">
                <h3 class="font-bold mb-4">Add Food Item</h3>
                <div class="space-y-4">
                    <input type="text" id="foodName" placeholder="Item Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold focus:ring-2 focus:ring-orange-500">
                    <input type="number" id="foodPrice" placeholder="Price (₹)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold focus:ring-2 focus:ring-orange-500">
                    <input type="text" id="foodImage" placeholder="Image URL (Unsplash/Imgur)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold focus:ring-2 focus:ring-orange-500">
                    <select id="foodType" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold">
                        <option value="veg">Veg</option>
                        <option value="non-veg">Non-Veg</option>
                    </select>
                    <button onclick="saveFood()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all">UPLOAD TO FIREBASE</button>
                </div>
            </div>

            <div class="lg:col-span-3 bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b font-bold">Live Menu Items</div>
                <div class="max-h-[500px] overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-[10px] uppercase font-black text-gray-400">
                            <tr>
                                <th class="px-6 py-4">Item Info</th>
                                <th class="px-6 py-4">Badge</th>
                                <th class="px-6 py-4">Price</th>
                                <th class="px-6 py-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="menuTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // SAVE FOOD TO FIREBASE
        window.saveFood = async () => {
            const name = document.getElementById('foodName').value;
            const price = document.getElementById('foodPrice').value;
            const image = document.getElementById('foodImage').value;
            const type = document.getElementById('foodType').value;

            if(!name || !price || !image) return alert("Pura details bhariye!");

            try {
                await addDoc(collection(db, "menu"), { name, price, image, type });
                alert("Menu Updated!");
                document.getElementById('foodName').value = '';
                document.getElementById('foodPrice').value = '';
                document.getElementById('foodImage').value = '';
            } catch (e) { alert("Error: " + e.message); }
        };

        // RENDER MENU IN REAL-TIME
        onSnapshot(collection(db, "menu"), (snap) => {
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                tbody.innerHTML += `
                    <tr class="border-b border-gray-50 hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 flex items-center gap-3">
                            <img src="${item.image}" class="food-preview" onerror="this.src='https://via.placeholder.com/50'">
                            <span class="font-bold text-gray-800">${item.name}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${item.type === 'veg' ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50'}">${item.type}</span>
                        </td>
                        <td class="px-6 py-4 font-black">₹${item.price}</td>
                        <td class="px-6 py-4">
                            <button onclick="deleteItem('${d.id}')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        });

        window.deleteItem = async (id) => {
            if(confirm("Item delete karein?")) await deleteDoc(doc(db, "menu", id));
        };
    </script>
</body>
</html>
