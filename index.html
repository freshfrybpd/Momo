<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada's Best Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .page-active { display: block; animation: fadeIn 0.3s ease-in; }
        .page-hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .premium-shadow { box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global function to add orders to Firebase
        window.placeOrder = async (item, price, type) => {
            try {
                await addDoc(collection(db, "orders"), {
                    item: item,
                    price: price,
                    type: type,
                    timestamp: new Date()
                });
                console.log("Order saved to Firebase!");
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        }
    </script>

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer" onclick="showPage('home')">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <div class="flex items-center space-x-4">
            <div onclick="showPage('profile')" class="bg-gray-100 p-2.5 rounded-full cursor-pointer hover:bg-orange-100 transition">
                <i class="fa-solid fa-user text-gray-700"></i>
            </div>
            <div class="relative bg-orange-100 p-2.5 rounded-full">
                <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
                <span id="cart-total" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <main id="page-home" class="page-active px-6 py-8 max-w-2xl mx-auto mb-24">
        <header class="mb-10 text-center">
            <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Our Special Menu</h2>
            <p class="text-gray-500 mt-2">Authentic taste, freshly prepared.</p>
        </header>

        <div class="space-y-12">
            <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-gray-100">
                <div class="relative h-64">
                    <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute top-5 right-5 bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest text-orange-600">Bestseller</div>
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Fried</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-fried">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-fried" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleAddToCart('Fried Momos', 'price-fried', 'type-fried')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all active:scale-95">Add +</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-gray-100">
                <div class="relative h-64">
                    <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute top-5 right-5 bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest text-blue-600">Fresh & Light</div>
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Stream</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-stream">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-stream" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleAddToCart('Stream Momos', 'price-stream', 'type-stream')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all active:scale-95">Add +</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <main id="page-profile" class="page-hidden px-6 py-8 max-w-2xl mx-auto">
        <div class="flex items-center space-x-6 mb-10">
            <div class="w-24 h-24 bg-orange-500 rounded-[2rem] flex items-center justify-center text-white text-4xl shadow-xl shadow-orange-200">
                <i class="fa-solid fa-user-check"></i>
            </div>
            <div>
                <h2 class="text-3xl font-black text-gray-900">Freshfry Admin</h2>
                <p class="text-gray-500 font-medium">Baripada, Odisha</p>
            </div>
        </div>
        <div class="space-y-4">
            <div class="bg-white p-6 rounded-3xl flex items-center justify-between border border-gray-100 shadow-sm hover:bg-gray-50 cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-orange-50 text-orange-500 rounded-2xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <span class="font-bold text-gray-700">Order History</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300"></i>
            </div>
            <div class="bg-white p-6 rounded-3xl flex items-center justify-between border border-gray-100 shadow-sm hover:bg-gray-50 cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-green-50 text-green-500 rounded-2xl"><i class="fa-solid fa-location-dot"></i></div>
                    <span class="font-bold text-gray-700">Manage Address</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300"></i>
            </div>
            <button onclick="showPage('home')" class="w-full bg-red-50 text-red-500 py-5 rounded-3xl font-black tracking-wide mt-10">LOGOUT</button>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 bg-gray-900 text-white py-4 px-12 rounded-full flex justify-between items-center shadow-2xl z-50 md:hidden">
        <i onclick="showPage('home')" class="fa-solid fa-house cursor-pointer"></i>
        <div onclick="showPage('home')" class="bg-orange-500 p-3.5 rounded-full -mt-14 border-4 border-slate-50 shadow-lg">
            <i class="fa-solid fa-plus text-white"></i>
        </div>
        <i onclick="showPage('profile')" class="fa-solid fa-user cursor-pointer opacity-50 hover:opacity-100"></i>
    </nav>

    <script>
        let cartCount = 0;

        function showPage(page) {
            document.getElementById('page-home').className = page === 'home' ? 'page-active px-6 py-8 max-w-2xl mx-auto mb-24' : 'page-hidden';
            document.getElementById('page-profile').className = page === 'profile' ? 'page-active px-6 py-8 max-w-2xl mx-auto' : 'page-hidden';
            window.scrollTo(0,0);
        }

        function toggleType(btn, type) {
            const btns = btn.parentElement.querySelectorAll('button');
            btns.forEach(b => b.className = "px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400");
            btn.className = `px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm ${type === 'veg' ? 'text-green-600' : 'text-red-600'}`;
        }

        async function handleAddToCart(name, selectId, typeContainerId) {
            const price = document.getElementById(selectId).value;
            const activeBtn = document.querySelector(`#${typeContainerId} .bg-white`);
            const type = activeBtn.innerText;
            
            cartCount++;
            document.getElementById('cart-total').innerText = cartCount;

            // Save to Firebase
            if(window.placeOrder) {
                await window.placeOrder(name, price, type);
            }

            // Button Feedback
            const btn = event.target;
            btn.innerText = "Added ✓";
            btn.classList.replace('bg-gray-900', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = "Add +";
                btn.classList.replace('bg-green-600', 'bg-gray-900');
            }, 1000);
        }
    </script>
</body>
</html>
