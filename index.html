<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Crunchy Momos & PIN Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .freshfry-gradient { background: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%); }
        .momo-card { border-radius: 2.5rem; transition: all 0.4s ease; background: white; border: 1px solid #f1f5f9; }
        .momo-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(242,153,74,0.15); }
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.85, 0, 0.15, 1); }
        .cart-closed { transform: translateX(100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="no-scrollbar">

    <div id="login-modal" class="fixed inset-0 z-[200] bg-white flex items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm">
            <div class="text-5xl font-extrabold text-orange-500 mb-2">Fresh<span class="text-gray-900">fry</span>.</div>
            <p class="text-gray-400 font-bold text-xs mb-10 tracking-[0.3em] uppercase">Premium Momo Hub</p>
            <div class="space-y-4">
                <input id="user-name" type="text" placeholder="Your Name" class="w-full px-6 py-5 bg-gray-100 rounded-[2rem] outline-none font-bold text-center focus:ring-2 focus:ring-orange-400">
                <input id="user-phone" type="tel" maxlength="10" placeholder="WhatsApp Number" class="w-full px-6 py-5 bg-gray-100 rounded-[2rem] outline-none font-bold text-center focus:ring-2 focus:ring-orange-400">
                <button onclick="handleLogin()" class="w-full freshfry-gradient text-white py-6 rounded-[2rem] font-800 shadow-xl active:scale-95 transition">Enter Menu</button>
            </div>
        </div>
    </div>

    <nav class="flex items-center justify-between px-8 py-6 bg-white sticky top-0 z-50 shadow-sm">
        <div class="text-3xl font-extrabold tracking-tighter text-orange-500">Fresh<span class="text-gray-900">fry</span>.</div>
        <div onclick="toggleCart(true)" class="relative bg-orange-100 p-4 rounded-full cursor-pointer">
            <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-800 rounded-full h-6 w-6 flex items-center justify-center border-4 border-white">0</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white z-[160] cart-sidebar cart-closed flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center">
            <h2 class="text-2xl font-800 italic">My <span class="text-orange-500 font-900">Box</span></h2>
            <button onclick="toggleCart(false)" class="h-12 w-12 bg-gray-50 rounded-full"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar"></div>
        <div class="p-8 border-t space-y-4 bg-slate-50">
            <input id="exact-address" type="text" placeholder="House No / Landmark / Street" class="w-full px-6 py-5 bg-white rounded-[1.5rem] outline-none border border-gray-100 font-bold">
            <div class="flex justify-between items-center px-2">
                <span class="text-gray-400 font-800 text-xs uppercase">Grand Total</span>
                <span id="cart-total" class="text-3xl font-800">₹0</span>
            </div>
            <button onclick="checkout('upi')" class="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-800 uppercase text-xs tracking-widest shadow-xl active:scale-95 transition">Pay Online (UPI)</button>
            <button onclick="checkout('wa')" class="w-full border-2 border-green-500 text-green-600 py-6 rounded-[2rem] font-800 uppercase text-xs tracking-widest active:scale-95 transition">Cash / WhatsApp Order</button>
        </div>
    </div>

    <div id="order-success-page" class="fixed inset-0 z-[300] bg-white hidden flex flex-col items-center justify-center p-8 text-center">
        <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mb-6"><i class="fa-solid fa-check"></i></div>
        <h2 class="text-3xl font-900 mb-2 italic">Order Placed!</h2>
        <p class="text-gray-400 font-bold uppercase text-[10px] tracking-widest mb-10 italic">Your momos are being prepared</p>
        
        <div class="bg-orange-50 p-8 rounded-[3rem] border-2 border-dashed border-orange-200 mb-10">
            <p class="text-[10px] font-900 text-orange-400 uppercase tracking-widest mb-2">Delivery Verification PIN</p>
            <h3 id="display-pin" class="text-5xl font-900 text-orange-600 tracking-[0.3em]">----</h3>
            <p class="text-[9px] text-gray-500 mt-4 font-bold uppercase">Share this PIN with Rider only</p>
        </div>

        <button onclick="location.reload()" class="font-800 text-slate-400 uppercase text-[10px] tracking-widest underline decoration-2">Back to Menu</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const momoMenu = [
            { id: 1, name: "KFC Momo", half: 80, full: 120, image: "https://images.unsplash.com/photo-1563245332-692546984812?w=600&q=80" },
            { id: 2, name: "Steam Momo", half: 50, full: 90, image: "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?w=600&q=80" },
            { id: 3, name: "Fried Momo", half: 70, full: 130, image: "https://foodiko.in/wp-content/uploads/2025/08/fry-momo.jpg" },
            { id: 4, name: "Kurkure Momo", half: 100, full: 180, image: "https://images.unsplash.com/photo-1523905330026-b8bd1f5f320e?w=600&q=80" }
        ];

        let cart = [];
        let selectedPortions = {};
        momoMenu.forEach(m => selectedPortions[m.id] = { type: 'half', price: m.half });

        window.handleLogin = async () => {
            const n = document.getElementById('user-name').value.trim();
            const p = document.getElementById('user-phone').value.trim();
            if(n && p.length === 10) {
                await setDoc(doc(db, "users", p), { name: n, phone: p, joined: serverTimestamp() }, { merge: true });
                localStorage.setItem('ffUser', n);
                localStorage.setItem('ffPhone', p);
                document.getElementById('login-modal').style.display = 'none';
            } else { alert("Correct Name & Phone Required"); }
        };

        window.renderMenu = () => {
            const list = document.getElementById('menu-list');
            list.innerHTML = momoMenu.map(item => `
                <div class="momo-card p-5">
                    <img src="${item.image}" class="w-full h-56 object-cover rounded-[2rem] mb-6">
                    <h4 class="font-800 text-xl tracking-tighter mb-4 italic uppercase">${item.name}</h4>
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <button onclick="selectPortion(${item.id}, 'half', ${item.half}, this)" class="port-btn-${item.id} border-2 border-orange-500 bg-orange-500 text-white py-3 rounded-2xl font-bold text-[10px] tracking-widest">HALF ₹${item.half}</button>
                        <button onclick="selectPortion(${item.id}, 'full', ${item.full}, this)" class="port-btn-${item.id} border-2 border-gray-100 py-3 rounded-2xl font-bold text-[10px] tracking-widest">FULL ₹${item.full}</button>
                    </div>
                    <button onclick="addToCart(${item.id})" class="w-full bg-gray-100 text-slate-900 py-5 rounded-[1.5rem] font-800 text-[10px] uppercase tracking-widest hover:bg-orange-500 hover:text-white transition-all">Add to Box</button>
                </div>
            `).join('');
        };

        window.selectPortion = (id, type, price, btn) => {
            selectedPortions[id] = { type, price };
            document.querySelectorAll(`.port-btn-${id}`).forEach(b => {
                b.classList.remove('bg-orange-500', 'text-white', 'border-orange-500');
                b.classList.add('border-gray-100');
            });
            btn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
        };

        window.addToCart = (id) => {
            const momo = momoMenu.find(m => m.id === id);
            const selection = selectedPortions[id];
            const cartId = `${id}-${selection.type}`;
            const inCart = cart.find(c => c.cartId === cartId);
            if(inCart) inCart.qty++;
            else cart.push({ cartId, name: `${momo.name} (${selection.type})`, price: selection.price, image: momo.image, qty: 1 });
            updateCart();
            toggleCart(true);
        };

        window.updateCart = () => {
            let total = 0;
            document.getElementById('cart-badge').innerText = cart.reduce((a,b) => a+b.qty, 0);
            document.getElementById('cart-items-list').innerHTML = cart.map(i => {
                total += (i.price * i.qty);
                return `<div class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <img src="${i.image}" class="w-12 h-12 object-cover rounded-xl">
                    <div class="flex-1 font-800 text-[10px] uppercase italic">${i.name} (x${i.qty})</div>
                    <div class="font-900">₹${i.price*i.qty}</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = "₹" + total;
        };

        window.toggleCart = (o) => { document.getElementById('cart-sidebar').classList.toggle('cart-closed', !o); };

        // --- SECURE CHECKOUT WITH PIN ---
        window.checkout = async (type) => {
            const addr = document.getElementById('exact-address').value.trim();
            if(!addr || cart.length === 0) return alert("Add address and items!");
            
            // GENERATE 4-DIGIT PIN (Zomato Style)
            const deliveryPin = Math.floor(1000 + Math.random() * 9000);

            const orderData = {
                customerName: localStorage.getItem('ffUser'),
                customer: localStorage.getItem('ffPhone'),
                address: addr,
                items: cart,
                total: parseInt(document.getElementById('cart-total').innerText.replace('₹','')),
                status: 'pending',
                deliveryPin: deliveryPin,
                paymentMethod: type === 'upi' ? 'Online' : 'Cash/WA',
                time: Date.now()
            };

            try {
                await addDoc(collection(db, "orders"), orderData);
                
                if(type === 'upi') {
                    window.location.href = `upi://pay?pa=7008186187@ybl&pn=Freshfry&am=${orderData.total}&cu=INR`;
                }
                
                // Show Success Page & PIN
                document.getElementById('display-pin').innerText = deliveryPin;
                document.getElementById('order-success-page').classList.remove('hidden');
                toggleCart(false);
                cart = [];
                updateCart();
            } catch(e) { alert("Server Busy! Try again."); }
        };

        if(localStorage.getItem('ffUser')) document.getElementById('login-modal').style.display = 'none';
        renderMenu();
    </script>
</body>
</html>
