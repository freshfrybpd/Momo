<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada's Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        
        .page-active { display: block; animation: slideUp 0.4s ease-out; }
        .page-hidden { display: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-card { transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.05); }
        .premium-card:hover { transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        
        .active-nav { color: #f97316 !important; opacity: 1 !important; }
        .profile-input { border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .profile-input:focus { border-color: #f97316; outline: none; background-color: white; }

        /* Cart Sidebar Animation */
        #cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-open { transform: translateX(0); }
        .cart-closed { transform: translateX(100%); }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendOrderToFirebase = async (orderDetails) => {
            try {
                await addDoc(collection(db, "orders"), {
                    ...orderDetails,
                    timestamp: serverTimestamp()
                });
                return true;
            } catch (e) { return false; }
        };
    </script>

    <nav class="flex items-center justify-between px-6 py-5 bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer" onclick="showPage('home')">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <div class="flex items-center space-x-4">
            <div onclick="showPage('profile')" class="bg-gray-100 p-2.5 rounded-full cursor-pointer hover:bg-orange-100 transition group">
                <i id="top-user-icon" class="fa-solid fa-user text-gray-700 group-hover:text-orange-600 text-lg"></i>
            </div>
            <div onclick="toggleCart(true)" class="relative bg-orange-100 p-2.5 rounded-full cursor-pointer hover:bg-orange-200 transition">
                <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-[100] shadow-2xl cart-closed flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-2xl font-black tracking-tight">Your Cart</h2>
            <button onclick="toggleCart(false)" class="bg-gray-100 p-2 rounded-xl hover:bg-red-50 hover:text-red-500 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
            <div class="text-center py-20 text-gray-300">
                <i class="fa-solid fa-basket-shopping text-5xl mb-4"></i>
                <p class="font-bold">Cart is empty</p>
            </div>
        </div>

        <div class="p-6 bg-gray-50 border-t border-gray-100">
            <div class="flex justify-between mb-2 font-bold text-gray-500 text-sm">
                <span>Subtotal</span>
                <span id="cart-subtotal">₹0</span>
            </div>
            <div class="flex justify-between mb-4 font-black text-xl text-gray-900">
                <span>Total</span>
                <span id="cart-total" class="text-orange-500">₹0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gray-900 text-white py-5 rounded-3xl font-black tracking-widest hover:bg-orange-600 transition shadow-xl active:scale-95">
                PLACE ORDER
            </button>
        </div>
    </div>

    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/40 z-[90] hidden opacity-0 transition-opacity"></div>

    <main id="page-home" class="page-active px-6 py-6 max-w-2xl mx-auto mb-28">
        <div class="mb-10 text-center">
            <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Our Menu</h2>
            <p class="text-gray-500 font-medium">Freshly made, Baripada style! 🔥</p>
        </div>

        <div class="space-y-12">
            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-sm">
                <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=1000&auto=format&fit=crop" class="w-full h-64 object-cover">
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Fried</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-fried">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-fried" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleOrder('Fried Momos', 'price-fried', 'type-fried')" class="bg-gray-900 text-white px-8 py-3.5 rounded-2xl font-bold hover:bg-orange-500 transition-all shadow-lg">Add +</button>
                    </div>
                </div>
            </div>

            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-sm">
                <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=1000&auto=format&fit=crop" class="w-full h-64 object-cover">
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Stream</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-stream">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-stream" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleOrder('Stream Momos', 'price-stream', 'type-stream')" class="bg-gray-900 text-white px-8 py-3.5 rounded-2xl font-bold hover:bg-orange-500 transition-all shadow-lg">Add +</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <main id="page-profile" class="page-hidden px-6 py-10 max-w-2xl mx-auto">
        <div class="flex flex-col items-center mb-10">
            <div class="relative group">
                <div class="w-32 h-32 bg-orange-500 rounded-[2.5rem] flex items-center justify-center text-white text-5xl shadow-xl border-4 border-white overflow-hidden">
                    <img id="profile-preview" src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="w-full h-full object-cover hidden">
                    <i id="profile-icon" class="fa-solid fa-user-ninja"></i>
                </div>
                <label for="photo-upload" class="absolute bottom-0 right-0 bg-gray-900 text-white p-3 rounded-2xl cursor-pointer hover:bg-orange-500 shadow-lg border-4 border-white transition">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <input type="file" id="photo-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
                </label>
            </div>
            <h2 id="display-name" class="text-3xl font-black text-gray-900 mt-4">Freshfry Admin</h2>
            <p class="text-gray-500 font-medium italic">Verified Foodie • Baripada</p>
        </div>

        <div class="space-y-6">
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm">
                <label class="text-[10px] font-black uppercase text-gray-400 tracking-widest ml-1">Edit Name</label>
                <input type="text" id="user-name-input" oninput="updateDisplayName(this.value)" value="Freshfry Admin" class="w-full profile-input bg-slate-50 p-4 rounded-2xl font-bold text-gray-800 mt-1">
            </div>
            <button onclick="saveProfile()" class="w-full bg-gray-900 text-white py-5 rounded-3xl font-black tracking-widest hover:bg-orange-500 transition shadow-lg active:scale-95">SAVE CHANGES</button>
            <button onclick="location.reload()" class="w-full bg-red-50 text-red-500 py-5 rounded-3xl font-black tracking-widest hover:bg-red-100 transition">LOGOUT</button>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-6 left-6 right-6 bg-gray-900 text-white py-4 px-10 rounded-full flex justify-between items-center shadow-2xl z-50">
        <i onclick="showPage('home')" id="nav-home" class="fa-solid fa-house cursor-pointer active-nav text-xl"></i>
        <div onclick="showPage('home')" class="bg-orange-500 p-3.5 rounded-full -mt-14 border-4 border-slate-50 shadow-lg cursor-pointer">
            <i class="fa-solid fa-plus text-white text-xl"></i>
        </div>
        <i onclick="showPage('profile')" id="nav-profile" class="fa-solid fa-user cursor-pointer opacity-40 text-xl"></i>
    </nav>

    <script>
        let cart = [];

        function showPage(pageName) {
            document.getElementById('page-home').className = pageName === 'home' ? 'page-active px-6 py-6 max-w-2xl mx-auto mb-28' : 'page-hidden';
            document.getElementById('page-profile').className = pageName === 'profile' ? 'page-active px-6 py-10 max-w-2xl mx-auto mb-28' : 'page-hidden';
            
            document.getElementById('nav-home').classList.toggle('active-nav', pageName === 'home');
            document.getElementById('nav-profile').classList.toggle('active-nav', pageName === 'profile');
            document.getElementById('nav-profile').classList.toggle('opacity-40', pageName !== 'profile');
            window.scrollTo(0, 0);
        }

        function toggleCart(open) {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if(open) {
                sidebar.classList.replace('cart-closed', 'cart-open');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.replace('cart-open', 'cart-closed');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 400);
            }
        }

        async function handleOrder(name, priceId, typeId) {
            const price = parseInt(document.getElementById(priceId).value);
            const type = document.querySelector(`#${typeId} .bg-white`).innerText;
            
            cart.push({ name, price, type });
            updateCartUI();

            const btn = event.target;
            btn.innerText = "Added ✓";
            btn.classList.replace('bg-gray-900', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = "Add +";
                btn.classList.replace('bg-green-600', 'bg-gray-900');
            }, 1000);
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');

            badge.innerText = cart.length;

            if(cart.length === 0) {
                list.innerHTML = `<div class="text-center py-20 text-gray-300"><i class="fa-solid fa-basket-shopping text-5xl mb-4"></i><p class="font-bold">Cart is empty</p></div>`;
                subtotalEl.innerText = "₹0";
                totalEl.innerText = "₹0";
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <div>
                            <p class="font-black text-gray-800">${item.name} (${item.type})</p>
                            <p class="text-orange-500 font-bold text-sm">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            }).join('');

            subtotalEl.innerText = `₹${total}`;
            totalEl.innerText = `₹${total}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        async function checkout() {
            if(cart.length === 0) return alert("Your cart is empty!");
            
            const btn = event.target;
            btn.innerText = "Processing...";
            btn.disabled = true;

            const success = await window.sendOrderToFirebase({
                items: cart,
                totalAmount: document.getElementById('cart-total').innerText,
                status: 'pending'
            });

            if(success) {
                alert("Order Placed Successfully! 🥟");
                cart = [];
                updateCartUI();
                toggleCart(false);
            } else {
                alert("Order failed. Please try again.");
            }
            btn.innerText = "PLACE ORDER";
            btn.disabled = false;
        }

        // Profile Helper Functions
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = () => {
                const img = document.getElementById('profile-preview');
                img.src = reader.result;
                img.classList.remove('hidden');
                document.getElementById('profile-icon').classList.add('hidden');
            }
            reader.readAsDataURL(event.target.files[0]);
        }
        function updateDisplayName(val) { document.getElementById('display-name').innerText = val || "Freshfry Admin"; }
        function saveProfile() { alert("Profile saved!"); showPage('home'); }
        function toggleType(btn, type) {
            const btns = btn.parentElement.querySelectorAll('button');
            btns.forEach(b => b.className = "px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400");
            btn.className = `px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm ${type === 'veg' ? 'text-green-600' : 'text-red-600'}`;
        }
    </script>
</body>
</html>
