<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: #0f172a; overflow-x: hidden; }
        .momo-card { border-radius: 2.5rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white; border: 1px solid rgba(0,0,0,0.03); }
        .momo-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(255, 94, 0, 0.15); }
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 1000; }
        .cart-open { transform: translateX(0); }
        .cart-closed { transform: translateX(100%); }
        .btn-gradient { background: linear-gradient(135deg, #ff8a00 0%, #ff5e00 100%); }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="pb-10">

    <nav class="sticky top-0 z-40 px-6 py-4 glass-nav border-b border-gray-100 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-900 tracking-tighter flex items-center gap-1 text-orange-600">
                Freshfry.
            </h1>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Baripada's Finest</p>
        </div>
        <div class="flex items-center gap-4">
            <div onclick="toggleCart(true)" class="bg-gray-900 text-white h-12 w-12 rounded-2xl cursor-pointer relative flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </div>
            <a href="profile.html" class="h-11 w-11 rounded-2xl border-2 border-gray-100 overflow-hidden shadow-sm">
                <img id="user-profile-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" class="w-full h-full object-cover">
            </a>
        </div>
    </nav>

    <div id="promo-banner" class="hidden mx-6 mt-6 p-6 btn-gradient rounded-[2.5rem] text-white relative overflow-hidden">
        <div class="relative z-10">
            <h3 id="p-title" class="text-2xl font-900 leading-tight">--</h3>
            <p id="p-code" class="mt-2 font-black tracking-widest opacity-90 text-sm">CODE: --</p>
        </div>
    </div>

    <main class="px-6 mt-8">
        <h2 class="text-2xl font-900 mb-6 uppercase italic tracking-tighter">Premium <span class="text-orange-500">Momos</span></h2>
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full py-20 text-center text-gray-400">Loading Menu...</div>
        </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white z-[100] shadow-2xl cart-closed flex flex-col cart-sidebar">
        <div class="p-6 flex justify-between items-center border-b">
            <h2 class="text-2xl font-900 italic">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-50 h-12 w-12 rounded-2xl hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-5"></div>
        <div class="p-8 bg-white border-t space-y-6">
            <div class="flex justify-between font-900 text-2xl pt-2">
                <span>Total</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <button onclick="checkout()" class="w-full btn-gradient text-white py-5 rounded-3xl font-black text-lg">PLACE ORDER</button>
        </div>
    </div>
    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];

        // 1. Sync Photo & Data
        window.onload = () => {
            const savedPhoto = localStorage.getItem('user_photo');
            const userName = localStorage.getItem('ff_user') || "Guest";
            if(savedPhoto) document.getElementById('user-profile-img').src = savedPhoto;
            else document.getElementById('user-profile-img').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${userName}`;
        };

        // 2. Fetch Promo
        onSnapshot(doc(db, "settings", "promo"), (d) => {
            if(d.exists()) {
                document.getElementById('promo-banner').classList.remove('hidden');
                document.getElementById('p-title').innerText = d.data().text;
                document.getElementById('p-code').innerText = "CODE: " + d.data().code;
            }
        });

        // 3. Smart Filtered Menu
        onSnapshot(collection(db, "menu"), (snap) => {
            const list = document.getElementById('menu-list');
            const isVegOnly = localStorage.getItem('ff_veg_only') === 'true';
            list.innerHTML = '';
            
            snap.forEach(d => {
                const item = d.data();
                if (isVegOnly && item.type.toLowerCase() !== 'veg') return;

                list.innerHTML += `
                    <div class="momo-card p-4">
                        <img src="${item.image}" class="w-full h-56 object-cover rounded-[2rem] mb-4">
                        <div class="flex justify-between items-center">
                            <h4 class="font-900 text-xl italic uppercase">${item.name}</h4>
                            <span class="text-orange-600 font-900">₹${item.price}</span>
                        </div>
                        <p class="text-[10px] uppercase font-bold text-gray-400 mt-1">${item.type} Momo</p>
                        <button onclick="addToCart('${item.name}', ${item.price}, '${item.image}')" 
                            class="w-full bg-gray-900 text-white py-4 rounded-2xl mt-4 font-black text-sm">ADD TO BOX</button>
                    </div>`;
            });
        });

        // Cart Functions
        window.addToCart = (name, price, image) => {
            const existing = cart.find(i => i.name === name);
            if(existing) existing.qty++;
            else cart.push({ name, price, image, qty: 1 });
            updateCartUI();
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            let total = 0;
            
            badge.innerText = cart.reduce((sum, i) => sum + i.qty, 0);
            list.innerHTML = cart.map((item, index) => {
                total += (item.price * item.qty);
                return `<div class="flex items-center gap-4 bg-gray-50 p-4 rounded-3xl">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl">
                    <div class="flex-1 text-sm font-900">${item.name}<br><span class="text-orange-600">₹${item.price} x ${item.qty}</span></div>
                    <button onclick="changeQty(${index}, -1)" class="w-8 h-8 bg-white border rounded-lg">-</button>
                    <span class="font-bold">${item.qty}</span>
                    <button onclick="changeQty(${index}, 1)" class="w-8 h-8 bg-white border rounded-lg">+</button>
                </div>`;
            }).join('');
            totalEl.innerText = "₹" + total;
        };

        window.changeQty = (index, delta) => {
            cart[index].qty += delta;
            if(cart[index].qty < 1) cart.splice(index, 1);
            updateCartUI();
        };

        window.toggleCart = (open) => {
            const sb = document.getElementById('cart-sidebar');
            const ov = document.getElementById('cart-overlay');
            if(open) { sb.classList.replace('cart-closed', 'cart-open'); ov.classList.remove('hidden'); }
            else { sb.classList.replace('cart-open', 'cart-closed'); ov.classList.add('hidden'); }
        };

        window.checkout = () => {
            const uName = localStorage.getItem('ff_user') || "Guest";
            let msg = `*New Order: Freshfry Baripada*%0A*Customer:* ${uName}%0A`;
            cart.forEach(i => msg += `• ${i.name} (x${i.qty})%0A`);
            msg += `*Total: ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/918984225363?text=${msg}`);
        };
    </script>
</body>
</html>
