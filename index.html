<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .momo-card { border-radius: 2.5rem; transition: transform 0.2s; }
        .momo-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="pb-24">

    <div id="promo-banner" class="hidden mx-6 mt-6 p-5 bg-orange-500 rounded-[2rem] text-white shadow-lg shadow-orange-200">
        <div class="flex justify-between items-center">
            <div>
                <p id="p-text" class="text-[10px] font-bold uppercase tracking-widest opacity-80">Special Offer</p>
                <h3 id="p-title" class="text-xl font-900">--</h3>
            </div>
            <div id="p-code" class="bg-white text-orange-600 px-4 py-2 rounded-2xl font-900 text-sm">--</div>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center">
        <h1 class="text-2xl font-900">Freshfry<span class="text-orange-500">.</span></h1>
        <div class="bg-orange-100 p-3 rounded-full text-orange-600 relative">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-black text-white text-[10px] h-5 w-5 rounded-full flex items-center justify-center">0</span>
        </div>
    </header>

    <main id="menu-list" class="px-6 space-y-6">
        <div class="py-20 text-center opacity-20 font-bold">Connecting to Kitchen...</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOAD PROMO ---
        onSnapshot(doc(db, "settings", "promo"), (d) => {
            if(d.exists()) {
                const data = d.data();
                document.getElementById('promo-banner').classList.remove('hidden');
                document.getElementById('p-title').innerText = data.text;
                document.getElementById('p-code').innerText = data.code;
            }
        });

        // --- LOAD MENU ---
        onSnapshot(collection(db, "menu"), (snap) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '<h2 class="text-2xl font-900">Our <span class="text-orange-500">Menu</span></h2>';
            snap.forEach(d => {
                const item = d.data();
                list.innerHTML += `
                    <div class="momo-card bg-white p-4 shadow-sm border border-gray-50">
                        <img src="${item.image}" class="w-full h-48 object-cover rounded-[2rem] mb-4">
                        <div class="flex justify-between items-center px-2">
                            <div>
                                <h4 class="font-900 text-lg">${item.name}</h4>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-tighter">${item.type}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-900 text-xl text-gray-900">₹${item.price}</p>
                                <button class="text-orange-500 font-bold text-sm">+ Add</button>
                            </div>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
