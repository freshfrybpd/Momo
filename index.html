<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #FF5C00; --dark: #0A0F1D; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F0F4F8; color: var(--dark); overflow-x: hidden; }
        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        .momo-card { border-radius: 2rem; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); background: #ffffff; }
        .momo-card:hover { transform: translateY(-12px); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.15); }
        .cart-sidebar { transition: transform 0.8s cubic-bezier(0.8, 0, 0.1, 1); }
        .cart-closed { transform: translateX(110%); }
        .filter-active { background: var(--primary) !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gradient-orange { background: linear-gradient(135deg, #FF8A00 0%, #FF5C00 100%); }
        @keyframes pulse-custom { 0% { transform: scale(1); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-wa { animation: pulse-custom 2s infinite; }
        
        /* Timer Style */
        .timer-box { background: #0A0F1D; color: white; border-radius: 2rem; padding: 2rem; margin-bottom: 2rem; display: none; }
    </style>
</head>
<body class="pb-24">

    <div id="login-modal" class="fixed inset-0 z-[200] bg-white flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <h1 class="text-5xl font-800 tracking-tighter italic mb-10">F<span class="text-orange-500">f.</span></h1>
            <input id="phone-input" type="tel" maxlength="10" placeholder="WhatsApp Number" class="w-full px-8 py-6 bg-slate-100 rounded-[2rem] focus:ring-2 focus:ring-orange-500 outline-none font-bold text-center text-lg mb-4">
            <button onclick="saveUser()" class="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-800">Start Ordering</button>
        </div>
    </div>

    <nav class="sticky top-0 z-[100] px-8 py-6 glass-nav flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-800 tracking-tighter italic">Fresh<span class="text-orange-500">fry.</span></h1>
            <button onclick="showLocationPicker()" class="flex items-center gap-2 mt-1">
                <span id="current-loc" class="text-[10px] font-800 uppercase text-slate-400">Choose Location</span>
            </button>
        </div>
        <button onclick="toggleCart(true)" class="relative h-14 w-14 bg-white rounded-full flex items-center justify-center text-slate-900 shadow-xl border border-slate-50">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 gradient-orange text-[10px] font-800 h-6 w-6 rounded-full flex items-center justify-center text-white border-4 border-white">0</span>
        </button>
    </nav>

    <main class="max-w-6xl mx-auto px-8 mt-12">
        
        <div id="shop-timer" class="timer-box animate-fade shadow-2xl">
            <p class="text-[10px] font-800 uppercase tracking-[0.3em] text-orange-500 mb-2">Opening Soon</p>
            <h3 class="text-3xl font-800 italic mb-4">Evening 5:00 PM <span class="text-slate-400 font-normal text-xl">Order Starts In</span></h3>
            <div class="flex gap-4 text-center">
                <div class="bg-white/10 p-4 rounded-2xl min-w-[70px]">
                    <span id="t-hours" class="text-3xl font-800 block">00</span>
                    <span class="text-[8px] uppercase font-bold text-slate-400">Hours</span>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl min-w-[70px]">
                    <span id="t-mins" class="text-3xl font-800 block">00</span>
                    <span class="text-[8px] uppercase font-bold text-slate-400">Mins</span>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl min-w-[70px]">
                    <span id="t-secs" class="text-3xl font-800 block text-orange-500">00</span>
                    <span class="text-[8px] uppercase font-bold text-slate-400">Secs</span>
                </div>
            </div>
        </div>

        <div class="mb-12">
            <p class="text-orange-500 font-800 uppercase tracking-[0.3em] text-[10px] mb-2">Baripada's Favorite</p>
            <h2 class="text-5xl font-800 tracking-tight italic leading-tight">Authentic<br>Momo <span class="text-orange-500">Cravings.</span></h2>
        </div>

        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <script type="module">
        // Firebase Config and Initialization (Same as previous)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { /* Your Config Here */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ⏰ Timer Logic for 5:00 PM ---
        function updateShopTimer() {
            const now = new Date();
            const openTime = new Date();
            openTime.setHours(17, 0, 0); // 5:00 PM

            if (now < openTime) {
                document.getElementById('shop-timer').style.display = 'block';
                const diff = openTime - now;
                const h = Math.floor(diff / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('t-hours').innerText = h.toString().padStart(2, '0');
                document.getElementById('t-mins').innerText = m.toString().padStart(2, '0');
                document.getElementById('t-secs').innerText = s.toString().padStart(2, '0');
            } else {
                document.getElementById('shop-timer').style.display = 'none';
            }
        }
        setInterval(updateShopTimer, 1000);

        // Rest of the functions (saveUser, renderMenu, etc.) as per previous code...
        // Note: In renderMenu, check if 'now < openTime' to disable 'Add to Cart' buttons if you want.
    </script>
</body>
</html>
