<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,900&display=swap');
        
        :root { --primary: #FF5C00; --dark: #07090E; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--dark); color: white; overflow-x: hidden; }

        /* 🔥 Hero Section Styling */
        .hero-gradient {
            background: radial-gradient(circle at top right, rgba(255, 92, 0, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(124, 58, 237, 0.1), transparent);
        }

        .hero-text { font-family: 'Playfair Display', serif; font-style: italic; }

        /* ✨ Animated Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3rem;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-15px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 30px 60px -15px rgba(255, 92, 0, 0.2);
        }

        /* 🍊 Floating Glow */
        .glow-dot {
            position: absolute; width: 300px; height: 300px;
            background: var(--primary); filter: blur(150px);
            opacity: 0.2; z-index: -1; animation: float 10s infinite alternate;
        }

        @keyframes float { from { transform: translate(0,0); } to { transform: translate(50px, 100px); } }

        /* 🛒 Add to Cart Button Premium */
        .btn-premium {
            background: linear-gradient(135deg, #FF8A00 0%, #FF5C00 100%);
            box-shadow: 0 10px 20px -5px rgba(255, 92, 0, 0.5);
        }

        /* 📍 Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body class="hero-gradient pb-20">

    <div class="glow-dot top-0 left-0"></div>
    <div class="glow-dot bottom-0 right-0" style="background: #7C3AED;"></div>

    <nav class="sticky top-0 z-[100] px-8 py-8 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div>
            <h1 class="text-3xl font-800 italic tracking-tighter">Fresh<span class="text-orange-500">fry.</span></h1>
            <div class="flex items-center gap-2 mt-1">
                <span class="h-1.5 w-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span id="current-loc" class="text-[10px] font-800 uppercase text-slate-400 tracking-[0.2em]">Authentic Momos</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="toggleCart(true)" class="relative h-14 w-14 glass-card flex items-center justify-center border-none bg-white/10">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] h-6 w-6 rounded-full flex items-center justify-center text-white font-800 border-4 border-[#07090E]">0</span>
            </button>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto px-8 pt-16 pb-12">
        <div class="grid lg:grid-cols-2 gap-12 items-center">
            <div>
                <p class="text-orange-500 font-800 uppercase tracking-[0.5em] text-[10px] mb-4">Taste the Extraordinary</p>
                <h2 class="text-7xl md:text-8xl hero-text leading-[0.9] mb-8">
                    Crafting <br> <span class="text-orange-500">Magic</span> Momos.
                </h2>
                <p class="text-slate-400 font-medium text-lg max-w-md leading-relaxed mb-10">
                    Handmade with love in Baripada. Every bite is a fusion of tradition and premium flavors.
                </p>
                <div class="flex gap-4">
                    <a href="#menu-section" class="btn-premium px-10 py-5 rounded-full font-800 uppercase text-[10px] tracking-widest transition-all hover:px-14">View Menu</a>
                </div>
            </div>
            <div class="hidden lg:block relative">
                <div class="absolute inset-0 bg-orange-500/20 blur-[100px] rounded-full"></div>
                <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=800&q=80" 
                     class="relative z-10 rounded-[4rem] shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-700">
            </div>
        </div>
    </header>

    <main id="menu-section" class="max-w-6xl mx-auto px-8 py-20">
        <div class="flex justify-between items-end mb-16">
            <div>
                <h3 class="text-4xl font-800 italic uppercase tracking-tighter">Chef's <span class="text-orange-500">Specials</span></h3>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mt-2">Freshly steamed, every single day</p>
            </div>
            <div class="flex gap-2">
                <button class="h-12 w-12 glass-card flex items-center justify-center text-sm hover:bg-orange-500"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="h-12 w-12 glass-card flex items-center justify-center text-sm hover:bg-orange-500"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <footer class="max-w-6xl mx-auto px-8 py-20 border-t border-white/5 text-center">
        <h1 class="text-6xl font-800 italic opacity-10 mb-8">FRESHFRY MOMO</h1>
        <p class="text-slate-500 font-bold text-[10px] uppercase tracking-[0.5em]">Baripada · Odisha · Since 2024</p>
    </footer>

    </body>
</html>
