<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        
        .premium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .premium-card:hover { transform: translateY(-10px); }
        
        /* Premium Veg/Non-Veg Badge Styles */
        .badge-veg { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .badge-nonveg { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black tracking-tighter text-orange-500">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <div class="relative bg-orange-100 p-2.5 rounded-full cursor-pointer hover:scale-110 transition">
            <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </div>
    </nav>

    <section class="px-6 py-10 max-w-2xl mx-auto">
        <div class="mb-10">
            <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Special Menu</h2>
            <div class="h-1.5 w-20 bg-orange-500 mt-2 rounded-full"></div>
        </div>

        <div class="grid gap-12">
            
            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-2xl shadow-gray-200 border border-gray-100">
                <div class="relative h-64 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=1000&auto=format&fit=crop" 
                         alt="Fried Momos" 
                         class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5">
                        <span class="bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm">Crunchy Gold</span>
                    </div>
                </div>
                
                <div class="p-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-extrabold text-gray-900">Freshfry Fried</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl">
                            <button onclick="setType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="setType(this, 'non-veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400">Non-Veg</button>
                        </div>
                    </div>

                    <p class="text-gray-500 text-sm leading-relaxed mb-8">Deep-fried to a perfect golden crisp. Served with our signature Baripada-special spicy garlic chutney.</p>

                    <div class="flex items-center justify-between pt-6 border-t border-gray-50">
                        <div>
                            <select id="fried-price" class="bg-transparent text-2xl font-black text-gray-900 focus:outline-none cursor-pointer">
                                <option value="100">₹100 (Half)</option>
                                <option value="150">₹150 (Full)</option>
                            </select>
                        </div>
                        <button onclick="addEffect('Fried')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all shadow-xl active:scale-95">
                            Add +
                        </button>
                    </div>
                </div>
            </div>

            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-2xl shadow-gray-200 border border-gray-100">
                <div class="relative h-64 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=1000&auto=format&fit=crop" 
                         alt="Steamed Momos" 
                         class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5">
                        <span class="bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm">Steamy Fresh</span>
                    </div>
                </div>
                
                <div class="p-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-extrabold text-gray-900">Freshfry Steam</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl">
                            <button onclick="setType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="setType(this, 'non-veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400">Non-Veg</button>
                        </div>
                    </div>

                    <p class="text-gray-500 text-sm leading-relaxed mb-8">Authentic Himalayan style steamed momos with extra-thin skin and juicy fillings inside.</p>

                    <div class="flex items-center justify-between pt-6 border-t border-gray-50">
                        <div>
                            <select id="steam-price" class="bg-transparent text-2xl font-black text-gray-900 focus:outline-none cursor-pointer">
                                <option value="100">₹100 (Half)</option>
                                <option value="150">₹150 (Full)</option>
                            </select>
                        </div>
                        <button onclick="addEffect('Steamed')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all shadow-xl active:scale-95">
                            Add +
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script>
        let cart = 0;

        // Veg/Non-Veg Toggle Function
        function setType(btn, type) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('button');
            buttons.forEach(b => {
                b.classList.remove('bg-white', 'text-green-600', 'text-red-600', 'shadow-sm');
                b.classList.add('text-gray-400');
            });
            
            btn.classList.add('bg-white', 'shadow-sm');
            btn.classList.remove('text-gray-400');
            btn.classList.add(type === 'veg' ? 'text-green-600' : 'text-red-600');
        }

        // Add to Cart with feedback
        function addEffect(name) {
            cart++;
            document.getElementById('cart-count').innerText = cart;
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Added! ✓";
            btn.classList.replace('bg-gray-900', 'bg-green-600');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-gray-900');
            }, 1000);
        }
    </script>
</body>
</html>
