<!DOCTYPE html>
<html lang="en">
<head>
    <title>Freshfry | Fast & Premium</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://api.dicebear.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        
        :root { --primary: #ff5e00; --surface: #ffffff; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #f8fafc; 
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh bounce */
            -webkit-font-smoothing: antialiased;
        }

        /* Prevent Layout Shift */
        .img-container {
            aspect-ratio: 16 / 9;
            background: #e2e8f0;
            overflow: hidden;
            border-radius: 1.5rem;
        }

        /* Fast Sidebars - GPU Accelerated */
        .sidebar {
            position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 400px;
            background: var(--surface); z-index: 1000;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-closed { transform: translateX(105%); }
        .sidebar-open { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,0.05); }

        /* Hardware Accelerated Animations */
        @keyframes skeleton-move {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-move 1.5s infinite linear;
        }

        /* Glassmorphism Optimization */
        .nav-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(10px);
            -webkit-backdrop-filter: saturate(180%) blur(10px);
        }
    </style>
</head>
<body class="pb-24">

    <nav class="sticky top-0 z-50 nav-glass border-b border-gray-100 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-900 italic tracking-tighter">Fresh<span class="text-orange-600">fry.</span></h1>
        <div class="flex gap-4">
            <div onclick="toggleCart(true)" class="relative cursor-pointer">
                <i class="fa-solid fa-bag-shopping text-xl"></i>
                <span id="cart-dot" class="absolute -top-1 -right-1 bg-orange-600 w-4 h-4 rounded-full text-[8px] flex items-center justify-center text-white font-black hidden">0</span>
            </div>
            <img id="user-icon" onclick="openLogin()" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fresh" class="w-8 h-8 rounded-lg bg-orange-50">
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-3xl font-900 italic uppercase">Fast <br><span class="text-orange-600">Flavor.</span></h2>
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest pb-1">Baripada Service</p>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="skeleton h-64 rounded-3xl"></div>
            <div class="skeleton h-64 rounded-3xl"></div>
        </div>
    </main>

    <div id="order-status" class="fixed bottom-6 left-6 right-6 z-40 hidden translate-y-20 transition-transform duration-300">
        <div class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center shadow-2xl border-b-4 border-orange-500">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-fire-burner text-orange-500 animate-pulse"></i>
                <span class="text-xs font-black uppercase italic" id="status-text">Preparing...</span>
            </div>
            <button onclick="toggleOrders(true)" class="text-[9px] font-black uppercase bg-white/10 px-3 py-1 rounded-lg">View Details</button>
        </div>
    </div>

    <div id="cart-side" class="sidebar sidebar-closed flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-900 italic uppercase">Your Box</h2>
            <i onclick="toggleCart(false)" class="fa-solid fa-xmark cursor-pointer"></i>
        </div>
        <div id="cart-body" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 bg-gray-50 border-t">
            <div class="flex justify-between font-900 text-xl italic mb-4">
                <span>Total</span><span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase shadow-lg active:scale-95 transition">Order Now</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const config = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(config);
        const db = getFirestore(app);

        let cart = [];

        // UI State Controllers
        window.toggleCart = (show) => {
            document.getElementById('cart-side').className = `sidebar ${show ? 'sidebar-open' : 'sidebar-closed'}`;
        };

        // High Performance Menu Loader
        function loadMenu() {
            const grid = document.getElementById('menu-grid');
            onSnapshot(collection(db, "menu"), (snap) => {
                let html = '';
                snap.forEach(d => {
                    const item = d.data();
                    html += `
                        <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                            <div class="img-container mb-4">
                                <img src="${item.image}" loading="lazy" class="w-full h-full object-cover">
                            </div>
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-900 uppercase italic text-sm">${item.name}</h3>
                                <span class="text-[8px] font-black px-2 py-1 bg-gray-100 rounded">${item.type}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="addToCart('${item.name} (H)', ${item.halfPrice})" class="text-[10px] font-black py-2 rounded-lg bg-orange-50 text-orange-600">Half ₹${item.halfPrice}</button>
                                <button onclick="addToCart('${item.name} (F)', ${item.fullPrice})" class="text-[10px] font-black py-2 rounded-lg bg-slate-900 text-white">Full ₹${item.fullPrice}</button>
                            </div>
                        </div>`;
                });
                grid.innerHTML = html;
            });
        }

        window.addToCart = (name, price) => {
            const entry = cart.find(i => i.name === name);
            if(entry) entry.qty++; else cart.push({name, price, qty: 1});
            renderCart();
            toggleCart(true);
        };

        function renderCart() {
            const body = document.getElementById('cart-body');
            const dot = document.getElementById('cart-dot');
            let total = 0;
            
            body.innerHTML = cart.map(item => {
                total += (item.price * item.qty);
                return `<div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                    <div class="flex-1"><p class="text-xs font-black uppercase">${item.name}</p><p class="text-[10px] text-orange-600 font-black">₹${item.price}</p></div>
                    <div class="flex items-center gap-3"><span class="text-xs font-black">x${item.qty}</span></div>
                </div>`;
            }).join('');

            dot.innerText = cart.length;
            dot.classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart-total').innerText = `₹${total + (total > 0 ? 20 : 0)}`;
        }

        // Live Performance: Order Tracking
        function watchOrders() {
            const p = localStorage.getItem('ff_phone');
            if(!p) return;
            const q = query(collection(db, "orders"), where("customerPhone", "==", p), where("status", "in", ["pending", "accepted", "preparing"]));
            onSnapshot(q, snap => {
                const ticker = document.getElementById('order-status');
                if(!snap.empty) {
                    ticker.classList.remove('hidden');
                    setTimeout(() => ticker.style.transform = "translateY(0)", 100);
                    document.getElementById('status-text').innerText = snap.docs[0].data().status;
                } else {
                    ticker.style.transform = "translateY(100px)";
                    setTimeout(() => ticker.classList.add('hidden'), 300);
                }
            });
        }

        window.checkout = async () => {
            const p = localStorage.getItem('ff_phone');
            if(!p) return alert("Please Login First");
            const total = document.getElementById('cart-total').innerText;
            
            await addDoc(collection(db, "orders"), {
                customerPhone: p,
                items: cart,
                total: total,
                status: 'pending',
                createdAt: serverTimestamp()
            });
            
            alert("Order Placed! Redirecting to UPI...");
            cart = []; renderCart(); toggleCart(false);
        };

        window.onload = () => {
            loadMenu();
            watchOrders();
        };
    </script>
</body>
</html>
