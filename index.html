<!DOCTYPE html>
<html lang="en">
<head>
    <title>Freshfry | Baripada Premium Momos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5e00">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --primary: #ff5e00; --dark: #0f172a; }
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: var(--dark); overflow-x: hidden; }
        .marquee-wrapper { background: #000; overflow: hidden; white-space: nowrap; padding: 12px 0; border-bottom: 2px solid var(--primary); }
        .marquee-content { display: inline-block; animation: scroll-left 25s linear infinite; font-size: 11px; font-weight: 900; text-transform: uppercase; color: white; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .momo-card { border-radius: 2.5rem; transition: all 0.4s ease; background: white; border: 1px solid rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .momo-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(255, 94, 0, 0.1); }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 400px; background: white; }
        .sidebar-open { transform: translateX(0); box-shadow: -10px 0 50px rgba(0,0,0,0.1); }
        .sidebar-closed { transform: translateX(100%); }
        .btn-gradient { background: linear-gradient(135deg, #ff8a00 0%, #ff5e00 100%); }
        .qty-btn { width: 30px; height: 30px; background: #f1f5f9; border-radius: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .active-filter { background: #0f172a !important; color: white !important; }
    </style>
</head>
<body class="pb-10">

    <div class="marquee-wrapper">
        <div class="marquee-content font-black tracking-widest">FRESHFRY MOMOS IS LIVE IN BARIPADA! • ORDER NOW • 100% PREMIUM QUALITY •</div>
    </div>

    <div id="user-info-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-6 z-[3000]">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-900 uppercase mb-4">Welcome to <span class="text-orange-500">Freshfry</span></h3>
            <div class="space-y-4">
                <input type="text" id="modal-name" placeholder="Full Name" class="w-full bg-gray-50 rounded-2xl py-4 px-6 font-bold outline-none focus:ring-2 focus:ring-orange-500">
                <input type="tel" id="modal-phone" placeholder="Mobile Number" class="w-full bg-gray-50 rounded-2xl py-4 px-6 font-bold outline-none focus:ring-2 focus:ring-orange-500">
                <button onclick="getLocation()" id="fetch-loc-btn" class="text-[10px] font-black text-orange-600 uppercase bg-orange-50 px-4 py-2 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-location-crosshairs"></i> Fetch My Location
                </button>
                <textarea id="modal-location" rows="3" placeholder="Exact Address/Landmark" class="w-full bg-gray-50 rounded-2xl py-4 px-6 font-bold outline-none focus:ring-2 focus:ring-orange-500 resize-none"></textarea>
            </div>
            <button onclick="saveUserDetails()" class="w-full btn-gradient text-white py-5 rounded-[2rem] font-black text-lg mt-6 shadow-lg active:scale-95 transition-all">START FEASTING</button>
        </div>
    </div>

    <nav class="sticky top-0 z-40 px-6 py-4 bg-white/80 backdrop-blur-md border-b flex justify-between items-center">
        <h1 class="text-2xl font-900 italic uppercase">Fresh<span class="text-orange-600">fry.</span></h1>
        <div class="flex items-center gap-3">
            <button onclick="toggleOrders(true)" class="bg-gray-100 h-11 w-11 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-receipt"></i></button>
            <div onclick="toggleCart(true)" class="bg-gray-900 text-white h-11 w-11 rounded-2xl relative flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </div>
        </div>
    </nav>

    <div class="px-6 mt-6 max-w-xl mx-auto">
        <input type="text" id="menu-search" onkeyup="searchMenu()" placeholder="Search momos..." class="w-full border py-4 px-6 rounded-[2rem] font-bold outline-none focus:ring-2 focus:ring-orange-500 shadow-sm">
    </div>

    <div class="flex justify-center gap-2 px-6 mt-6 overflow-x-auto no-scrollbar">
        <button onclick="filterMenu('All')" id="btn-all" class="filter-btn active-filter px-6 py-2.5 rounded-xl text-[10px] font-900 uppercase border border-slate-100 bg-white shadow-sm">All</button>
        <button onclick="filterMenu('Veg')" id="btn-veg" class="filter-btn px-6 py-2.5 rounded-xl text-[10px] font-900 uppercase border border-slate-100 bg-white shadow-sm">Veg 🥗</button>
        <button onclick="filterMenu('Non-Veg')" id="btn-nonveg" class="filter-btn px-6 py-2.5 rounded-xl text-[10px] font-900 uppercase border border-slate-100 bg-white shadow-sm">Non-Veg 🍗</button>
    </div>

    <main class="px-6 mt-8 max-w-6xl mx-auto">
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="cart-sidebar" class="sidebar sidebar-closed flex flex-col">
        <div class="p-6 flex justify-between items-center border-b">
            <h2 class="text-2xl font-900 italic uppercase">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-100 h-10 w-10 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 bg-white border-t space-y-4">
            <div class="flex justify-between font-900 text-2xl uppercase italic">
                <span>Total bill</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="processOrder('whatsapp')" class="bg-[#25D366] text-white py-4 rounded-2xl font-black uppercase flex items-center justify-center gap-2 shadow-lg"><i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp</button>
                <button onclick="processOrder('online')" class="btn-gradient text-white py-4 rounded-2xl font-black uppercase shadow-lg">Pay UPI</button>
            </div>
        </div>
    </div>

    <div id="orders-sidebar" class="sidebar sidebar-closed flex flex-col">
        <div class="p-6 flex justify-between items-center border-b">
            <h2 class="text-2xl font-900 italic uppercase">Recent Orders</h2>
            <button onclick="toggleOrders(false)" class="bg-gray-100 h-10 w-10 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="my-orders-list" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50"></div>
    </div>

    <div id="overlay" onclick="closeAllSidebars()" class="fixed inset-0 z-50 hidden bg-black/30 backdrop-blur-sm"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, addDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];
        let currentFilter = 'All';

        // Fetch User Location
        window.getLocation = () => {
            const btn = document.getElementById('fetch-loc-btn');
            if (navigator.geolocation) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Locating...`;
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    document.getElementById('modal-location').value = `📍 Map: https://www.google.com/maps?q=${lat},${lon}\nBaripada, `;
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Location Captured`;
                }, () => alert("GPS access denied. Please type manually."));
            }
        };

        // Load Menu
        window.loadMenu = () => {
            onSnapshot(collection(db, "menu"), (snap) => {
                const list = document.getElementById('menu-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const item = d.data();
                    if(currentFilter !== 'All' && item.type !== currentFilter) return;
                    list.innerHTML += `
                        <div class="momo-card p-4">
                            <span class="absolute top-4 left-4 z-10 text-[9px] font-900 uppercase text-white px-3 py-1 rounded-lg ${item.type === 'Veg' ? 'bg-green-600' : 'bg-red-600'}">${item.type}</span>
                            <img src="${item.image}" class="w-full h-48 object-cover rounded-3xl mb-4">
                            <h3 class="font-900 text-lg uppercase italic mb-3 momo-name-text">${item.name}</h3>
                            <div class="flex gap-2 mb-4">
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="size-${d.id}" value="Half" checked class="hidden peer">
                                    <div class="text-center p-2 rounded-xl border-2 peer-checked:border-orange-500 peer-checked:bg-orange-50 font-black text-xs">Half ₹${item.halfPrice}</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="size-${d.id}" value="Full" class="hidden peer">
                                    <div class="text-center p-2 rounded-xl border-2 peer-checked:border-orange-500 peer-checked:bg-orange-50 font-black text-xs">Full ₹${item.fullPrice}</div>
                                </label>
                            </div>
                            <button onclick="addToCartPrep('${d.id}', '${item.name}', ${item.halfPrice}, ${item.fullPrice}, '${item.image}')" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black active:scale-95 transition-all">ADD TO BOX</button>
                        </div>`;
                });
            });
        };

        window.addToCartPrep = (id, name, hp, fp, img) => {
            const size = document.querySelector(`input[name="size-${id}"]:checked`).value;
            const price = size === 'Half' ? hp : fp;
            const itemKey = id + size;
            const existing = cart.find(x => x.id === itemKey);
            if(existing) existing.qty++;
            else cart.push({ id: itemKey, name: `${name} (${size})`, price, image: img, qty: 1 });
            updateCartUI();
            toggleCart(true);
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            let total = 0, count = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty; count += item.qty;
                return `<div class="flex items-center gap-4 bg-white p-4 rounded-3xl border">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-2xl">
                    <div class="flex-1"><p class="font-900 uppercase text-[11px] leading-tight">${item.name}</p><p class="text-orange-500 font-900">₹${item.price}</p></div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${idx},-1)" class="qty-btn">-</button>
                        <span class="font-900 w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${idx},1)" class="qty-btn">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-badge').innerText = count;
            document.getElementById('cart-total').innerText = "₹" + (total > 0 ? total + 20 : 0);
        };

        window.changeQty = (idx, d) => { cart[idx].qty += d; if(cart[idx].qty < 1) cart.splice(idx, 1); updateCartUI(); };

        // --- FIXED WHATSAPP DIRECT OPEN ---
        window.processOrder = async (method) => {
            if (cart.length === 0) return alert("Your box is empty!");
            const name = localStorage.getItem('ff_user'), phone = localStorage.getItem('ff_phone'), loc = localStorage.getItem('ff_location');
            if(!phone) return document.getElementById('user-info-modal').classList.remove('hidden');

            const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0) + 20;
            const orderPin = Math.floor(1000 + Math.random() * 9000);

            try {
                // Save to Firebase (As per your details)
                const docRef = await addDoc(collection(db, "orders"), {
                    customerName: name, customerPhone: phone, customerLocation: loc,
                    items: cart, total: "₹" + total, status: 'pending', orderPin, createdAt: serverTimestamp()
                });

                const itemText = cart.map(i => `• ${i.qty}x ${i.name}`).join('\n');
                const msg = `*🔥 NEW ORDER - FRESHFRY*\n\n👤 ${name}\n📞 ${phone}\n📍 ${loc}\n\n*ITEMS:*\n${itemText}\n\n💰 *Total: ₹${total}*\n🔑 *ORDER PIN: ${orderPin}*`;
                
                if (method === 'whatsapp') {
                    const encodedMsg = encodeURIComponent(msg);
                    const whatsappAppUrl = `whatsapp://send?phone=917008186187&text=${encodedMsg}`;
                    const whatsappWebUrl = `https://api.whatsapp.com/send?phone=917008186187&text=${encodedMsg}`;

                    // Force open App
                    window.location.assign(whatsappAppUrl);
                    // Fallback for PC
                    setTimeout(() => {
                        if(document.hasFocus()) window.location.href = whatsappWebUrl;
                    }, 1000);
                } else {
                    window.location.href = `upi://pay?pa=7008186187@ybl&pn=Freshfry&am=${total}&cu=INR&tn=FF${orderPin}`;
                }

                cart = []; updateCartUI(); toggleCart(false);
            } catch (e) { alert("Checkout error! Try again."); }
        };

        window.saveUserDetails = async () => {
            const n = document.getElementById('modal-name').value, p = document.getElementById('modal-phone').value, l = document.getElementById('modal-location').value;
            if(!n || !p || !l) return alert("All fields are mandatory!");
            localStorage.setItem('ff_user', n); localStorage.setItem('ff_phone', p); localStorage.setItem('ff_location', l);
            await setDoc(doc(db, "users", p), { name: n, phone: p, location: l, updatedAt: serverTimestamp() });
            document.getElementById('user-info-modal').classList.add('hidden');
            location.reload();
        };

        // UI Helpers
        window.toggleCart = (s) => { document.getElementById('cart-sidebar').classList.toggle('sidebar-open', s); document.getElementById('cart-sidebar').classList.toggle('sidebar-closed', !s); document.getElementById('overlay').classList.toggle('hidden', !s); };
        window.toggleOrders = (s) => { document.getElementById('orders-sidebar').classList.toggle('sidebar-open', s); document.getElementById('orders-sidebar').classList.toggle('sidebar-closed', !s); document.getElementById('overlay').classList.toggle('hidden', !s); if(s) loadMyOrders(); };
        window.closeAllSidebars = () => { toggleCart(false); toggleOrders(false); };
        window.filterMenu = (t) => { currentFilter = t; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter')); document.getElementById(`btn-${t.toLowerCase().replace('-','')}`).classList.add('active-filter'); loadMenu(); };
        window.searchMenu = () => {
            const val = document.getElementById('menu-search').value.toLowerCase();
            document.querySelectorAll('.momo-card').forEach(c => c.style.display = c.querySelector('h3').innerText.toLowerCase().includes(val) ? 'block' : 'none');
        };

        window.onload = () => {
            loadMenu();
            if(!localStorage.getItem('ff_user')) document.getElementById('user-info-modal').classList.remove('hidden');
        };
    </script>
</body>
</html>
