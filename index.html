<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFry | Baripada's Best Momos 🥟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        .momo-card:active { transform: scale(0.98); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <section id="login-section" class="fixed inset-0 z-[200] bg-orange-600 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <h1 class="text-4xl font-extrabold text-orange-600 mb-2">FreshFry</h1>
            <p class="text-gray-500 mb-8 font-medium">Delicious Momos Delivered in Baripada</p>
            
            <div class="space-y-4">
                <input type="text" id="userName" placeholder="Apna Naam Likhein" class="w-full p-4 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-orange-500 outline-none font-semibold">
                <input type="tel" id="userPhone" placeholder="Mobile Number" class="w-full p-4 bg-gray-100 rounded-xl border-none focus:ring-2 focus:ring-orange-500 outline-none font-semibold">
                
                <p class="text-left text-xs text-gray-400 px-2 font-bold uppercase">Choose Your Area:</p>
                <select id="areaSelector" class="w-full p-4 bg-gray-100 rounded-xl border-none outline-none font-bold text-gray-700">
                    <option>Badbazar</option>
                    <option>Station Bazar</option>
                    <option>Bhanjpur</option>
                    <option>Baghra Road</option>
                    <option>Near Ambika Temple</option>
                    <option>Near Jagganath Temple</option>
                    <option>Other</option>
                </select>

                <button onclick="handleLogin()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-black text-lg shadow-lg hover:bg-orange-700 transition-all">
                    START ORDERING
                </button>
            </div>
        </div>
    </section>

    <main id="main-app" class="hidden pb-24">
        <header class="sticky top-0 bg-white shadow-sm p-4 flex justify-between items-center z-50">
            <div>
                <p class="text-[10px] font-bold text-orange-600 uppercase tracking-widest">Delivering to</p>
                <h2 id="display-area" class="font-black text-lg flex items-center">
                    <i class="fa-solid fa-location-dot mr-2 text-orange-500"></i> Location
                </h2>
            </div>
            <div class="bg-orange-100 p-2 rounded-full px-4 border border-orange-200">
                <span class="font-bold text-orange-700">FreshFry 🥟</span>
            </div>
        </header>

        <div class="p-4">
            <div class="bg-gradient-to-r from-orange-500 to-red-600 rounded-2xl p-6 text-white mb-6 shadow-lg">
                <h3 class="text-2xl font-bold">50% OFF</h3>
                <p class="text-orange-100">On your first order today!</p>
            </div>
            <h2 class="text-xl font-black mb-4 flex items-center">
                <span class="w-8 h-1 bg-orange-500 mr-2 rounded"></span> Popular Momos
            </h2>
            
            <div id="momo-list" class="space-y-4"></div>
        </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden z-[300] flex items-end">
        <div class="bg-white w-full rounded-t-[2rem] p-6 max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1 bg-gray-300 mx-auto rounded-full mb-6"></div>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-800">Review Order 🛒</h2>
                <button onclick="toggleCart()" class="bg-gray-100 w-10 h-10 rounded-full text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items-list" class="space-y-4 mb-8"></div>

            <div class="border-t border-dashed border-gray-300 pt-6">
                <div class="flex justify-between text-gray-500 mb-2">
                    <span>Item Total</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="flex justify-between text-gray-500 mb-4">
                    <span>Delivery Fee</span>
                    <span class="text-green-600">FREE</span>
                </div>
                <div class="flex justify-between font-black text-2xl mb-6">
                    <span>Total to Pay</span>
                    <span id="total-price" class="text-orange-600">₹0</span>
                </div>
                <button onclick="placeOrder()" id="order-btn" class="w-full bg-orange-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl hover:bg-orange-700 active:scale-95 transition-all">
                    PLACE ORDER
                </button>
            </div>
        </div>
    </div>

    <div id="footer-cart" class="fixed bottom-6 left-4 right-4 bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center hidden z-[100]">
        <div>
            <span id="cart-count" class="font-bold bg-orange-500 px-2 py-0.5 rounded text-sm mr-2">0</span>
            <span class="font-medium text-sm">Item added</span>
        </div>
        <button onclick="toggleCart()" class="font-black text-orange-400 flex items-center">
            VIEW CART <i class="fa-solid fa-chevron-right ml-2 text-xs"></i>
        </button>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. DATA ---
        const momoMenu = [
            { id: 1, name: "Veg Steamed Momos", half: 60, full: 110, img: "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?w=300" },
            { id: 2, name: "Paneer Fried Momos", half: 80, full: 150, img: "https://images.unsplash.com/photo-1534422298391-e4f8c170db06?w=300" },
            { id: 3, name: "Chicken Steamed Momos", half: 90, full: 170, img: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=300" },
            { id: 4, name: "FreshFry Special Momos", half: 100, full: 190, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300" }
        ];

        let cart = [];
        let user = {};

        // --- 3. FUNCTIONS ---
        function handleLogin() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const area = document.getElementById('areaSelector').value;

            if(!name || !phone) return alert("Please enter your name and phone!");

            user = { name, phone, area };
            document.getElementById('display-area').innerHTML = `<i class="fa-solid fa-location-dot mr-2 text-orange-500"></i> ${area}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            renderMenu();
        }

        function renderMenu() {
            const list = document.getElementById('momo-list');
            momoMenu.forEach(item => {
                list.innerHTML += `
                    <div class="momo-card bg-white p-3 rounded-2xl flex shadow-sm border border-gray-100">
                        <img src="${item.img}" class="w-28 h-28 rounded-xl object-cover">
                        <div class="ml-4 flex-1">
                            <h3 class="font-bold text-lg">${item.name}</h3>
                            <div class="flex items-center mt-3 justify-between">
                                <select id="price-${item.id}" class="bg-gray-100 p-2 rounded-lg text-sm font-bold outline-none">
                                    <option value="${item.half}">Half - ₹${item.half}</option>
                                    <option value="${item.full}">Full - ₹${item.full}</option>
                                </select>
                                <button onclick="addToCart(${item.id})" class="bg-white border-2 border-orange-500 text-orange-600 px-6 py-1.5 rounded-xl font-black hover:bg-orange-500 hover:text-white transition-all">ADD</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const item = momoMenu.find(m => m.id === id);
            const select = document.getElementById(`price-${id}`);
            const price = parseInt(select.value);
            const size = select.options[select.selectedIndex].text.split(' -')[0];

            cart.push({ name: item.name, size: size, price: price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('footer-cart').classList.remove('hidden');
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            renderCartModal();
        }

        function renderCartModal() {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = "";
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="flex justify-between items-center font-bold border-b pb-2">
                        <div>${item.name} <span class="text-orange-500 text-xs">[${item.size}]</span></div>
                        <div class="flex items-center">₹${item.price} <button onclick="removeItem(${index})" class="ml-3 text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                    </div>
                `;
            });
            document.getElementById('subtotal').innerText = `₹${total}`;
            document.getElementById('total-price').innerText = `₹${total}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            if(cart.length === 0) {
                toggleCart();
                document.getElementById('footer-cart').classList.add('hidden');
            }
            updateCartUI();
            renderCartModal();
        }

        async function placeOrder() {
            const btn = document.getElementById('order-btn');
            btn.innerText = "SABAR KARO... SENDING ORDER";
            btn.disabled = true;

            const orderData = {
                customer: user.name,
                phone: user.phone,
                location: user.area,
                items: cart,
                total: cart.reduce((s, i) => s + i.price, 0),
                time: new Date().toLocaleString()
            };

            try {
                await db.collection("orders").add(orderData);
                alert("🎉 Order Ho Gaya! FreshFry Team Baripada aapko 5 min me call karegi.");
                cart = [];
                location.reload(); 
            } catch (e) {
                alert("Net slow hai, firse try karo!");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
