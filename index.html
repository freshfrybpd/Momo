<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Crunchy & Steamy Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .freshfry-gradient { background: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%); }
        .momo-card { border-radius: 2rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white; overflow: hidden; }
        .momo-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(242, 153, 74, 0.3); }
        .cart-sidebar { transition: transform 0.6s cubic-bezier(0.85, 0, 0.15, 1); }
        .cart-closed { transform: translateX(110%); }
        .btn-add.added { background-color: #10b981 !important; color: white; }
    </style>
</head>
<body class="no-scrollbar">

    <div id="login-modal" class="fixed inset-0 z-[200] bg-white flex items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm">
            <div class="text-4xl font-extrabold text-orange-500 mb-2">Fresh<span class="text-gray-900">fry</span>.</div>
            <p class="text-gray-400 font-semibold text-sm mb-10 tracking-widest uppercase">Premium Momo Hub</p>
            <div class="space-y-4">
                <input id="user-name" type="text" placeholder="Your Name" class="w-full px-6 py-4 bg-gray-100 rounded-2xl outline-none font-semibold text-center">
                <input id="user-phone" type="tel" maxlength="10" placeholder="WhatsApp Number" class="w-full px-6 py-4 bg-gray-100 rounded-2xl outline-none font-semibold text-center">
                <button onclick="handleLogin()" class="w-full freshfry-gradient text-white py-5 rounded-2xl font-bold shadow-lg shadow-orange-200 active:scale-95 transition">Enter Shop</button>
            </div>
        </div>
    </div>

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-3xl font-extrabold tracking-tight text-orange-500">Fresh<span class="text-gray-900">fry</span>.</div>
        <div onclick="toggleCart(true)" class="relative bg-orange-100 p-3 rounded-full cursor-pointer">
            <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </div>
    </nav>

    <section class="freshfry-gradient px-6 py-16 text-center text-white">
        <h1 class="text-5xl font-extrabold mb-4 leading-tight">Freshly Steamed. <br> Deeply Fried.</h1>
        <p class="opacity-90 mb-8 font-medium italic">"Taste the magic of Baripada"</p>
    </section>

    <main class="max-w-6xl mx-auto px-6 -mt-8">
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white z-[160] cart-sidebar cart-closed flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center">
            <h2 class="text-2xl font-bold">My <span class="text-orange-500">Box</span></h2>
            <button onclick="toggleCart(false)" class="h-10 w-10 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 border-t space-y-4 bg-gray-50">
            <input type="text" id="exact-address" placeholder="Flat No / Landmark / Street" class="w-full px-5 py-4 bg-white rounded-2xl outline-none border border-gray-200 font-semibold text-sm">
            <div class="flex justify-between items-center px-2">
                <span class="text-gray-400 font-bold text-xs uppercase tracking-widest">Total</span>
                <span id="cart-total" class="text-2xl font-extrabold">₹0</span>
            </div>
            <button onclick="checkout('upi')" class="w-full bg-gray-900 text-white py-5 rounded-2xl font-bold uppercase text-xs tracking-widest shadow-xl">Pay via UPI</button>
            <button onclick="checkout('wa')" class="w-full border-2 border-green-500 text-green-600 py-5 rounded-2xl font-bold uppercase text-xs tracking-widest">WhatsApp Order</button>
        </div>
    </div>

    <div id="tracking-page" class="fixed inset-0 z-[300] bg-white hidden flex flex-col items-center justify-center p-8 text-center">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl mb-6"><i class="fa-solid fa-check"></i></div>
        <h2 class="text-3xl font-extrabold mb-2">Order Confirmed!</h2>
        <p class="text-gray-400 font-bold uppercase text-[10px] tracking-widest mb-10">Preparing your delicious momos...</p>
        <button onclick="location.reload()" class="font-bold text-orange-500 uppercase text-xs tracking-widest">Back to Menu</button>
    </div>

    <script>
        // 🛍️ FIX YOUR DATA HERE (Fastest Loading)
        const momoMenu = [
            { id: 1, name: "Veg Steamed Momo", price: 60, image: "https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?w=500" },
            { id: 2, name: "Chicken Fried Momo", price: 100, image: "https://images.unsplash.com/photo-1534422298391-e4f8c170db76?w=500" },
            { id: 3, name: "Paneer Kurkure Momo", price: 120, image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=500" },
            { id: 4, name: "Schezwan Veg Momo", price: 80, image: "https://images.unsplash.com/photo-1563245332-692546984812?w=500" }
        ];

        let cart = [];

        // Render Menu
        const menuList = document.getElementById('menu-list');
        momoMenu.forEach(item => {
            menuList.innerHTML += `
                <div class="momo-card p-4 shadow-sm border border-gray-100">
                    <img src="${item.image}" class="w-full h-52 object-cover rounded-[1.5rem] mb-4">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h4 class="font-bold text-lg">${item.name}</h4>
                        <span class="text-orange-500 font-extrabold">₹${item.price}</span>
                    </div>
                    <button onclick="addToCart(this, ${item.id})" class="w-full bg-gray-100 text-gray-800 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-orange-500 hover:text-white transition-all">Add to Box</button>
                </div>`;
        });

        // Functions
        function handleLogin() {
            const name = document.getElementById('user-name').value;
            const ph = document.getElementById('user-phone').value;
            if(name && ph.length === 10) {
                localStorage.setItem('ffUser', name);
                document.getElementById('login-modal').style.display = 'none';
            } else { alert("Please enter valid details"); }
        }

        if(localStorage.getItem('ffUser')) document.getElementById('login-modal').style.display = 'none';

        function toggleCart(o) { document.getElementById('cart-sidebar').classList.toggle('cart-closed', !o); }

        window.addToCart = (btn, id) => {
            const item = momoMenu.find(m => m.id === id);
            const inCart = cart.find(c => c.id === id);
            if(inCart) inCart.qty++; else cart.push({...item, qty: 1});
            
            btn.innerText = "Added! ✨"; btn.classList.add('added');
            setTimeout(() => { btn.innerText = "Add to Box"; btn.classList.remove('added'); }, 800);
            updateCart();
        };

        function updateCart() {
            let total = 0;
            document.getElementById('cart-badge').innerText = cart.reduce((a,b) => a+b.qty, 0);
            document.getElementById('cart-items-list').innerHTML = cart.map(i => {
                total += (i.price * i.qty);
                return `<div class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl">
                    <img src="${i.image}" class="w-12 h-12 object-cover rounded-xl">
                    <div class="flex-1 font-bold text-[10px] uppercase">${i.name} (x${i.qty})</div>
                    <div class="font-extrabold">₹${i.price*i.qty}</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = "₹" + total;
        }

        function checkout(type) {
            const addr = document.getElementById('exact-address').value;
            const total = document.getElementById('cart-total').innerText;
            if(!addr || cart.length === 0) return alert("Details missing!");

            if(type === 'upi') {
                window.location.href = `upi://pay?pa=7008186187@ybl&pn=Freshfry&am=${total.replace('₹','')}&cu=INR`;
            } else {
                let msg = `New Order from ${localStorage.getItem('ffUser')}: ${total} at ${addr}`;
                window.location.href = `https://wa.me/917008186187?text=${encodeURIComponent(msg)}`;
            }
            document.getElementById('tracking-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
