<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --primary: #ff5e00; --dark: #0f172a; }
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: var(--dark); overflow-x: hidden; }
        .momo-card { border-radius: 2.5rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white; border: 1px solid rgba(0,0,0,0.03); }
        .momo-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(255, 94, 0, 0.15); }
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 1000; position: fixed; top: 0; right: 0; height: 100%; }
        .cart-open { transform: translateX(0); }
        .cart-closed { transform: translateX(100%); }
        .btn-gradient { background: linear-gradient(135deg, #ff8a00 0%, #ff5e00 100%); }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="pb-10">

    <div id="user-info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-6 z-[3000]">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-900 italic uppercase mb-2">Welcome to <span class="text-orange-500">Freshfry</span></h3>
            <div class="space-y-4">
                <input type="text" id="modal-name" placeholder="Full Name" class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 font-bold text-sm focus:ring-2 focus:ring-orange-500">
                <input type="tel" id="modal-phone" placeholder="Mobile Number" class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 font-bold text-sm focus:ring-2 focus:ring-orange-500">
                <textarea id="modal-location" rows="3" placeholder="Exact Location / Landmark" class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 font-bold text-sm focus:ring-2 focus:ring-orange-500 resize-none"></textarea>
            </div>
            <button id="save-user-btn" onclick="saveUserDetails()" class="w-full btn-gradient text-white py-5 rounded-[2rem] font-black text-lg mt-6 shadow-xl active:scale-95 transition-all">SAVE & CONTINUE</button>
        </div>
    </div>

    <nav class="sticky top-0 z-40 px-6 py-4 glass-nav border-b border-gray-100 flex justify-between items-center">
        <h1 class="text-2xl font-900 tracking-tighter">Fresh<span class="text-orange-600">fry.</span></h1>
        <div class="flex items-center gap-4">
            <div onclick="toggleCart(true)" class="bg-gray-900 text-white h-12 w-12 rounded-2xl cursor-pointer relative flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </div>
            <a href="profile.html"><img id="user-profile-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" class="h-11 w-11 rounded-2xl border-2 border-orange-500 object-cover"></a>
        </div>
    </nav>

    <main class="px-6 mt-8">
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="cart-sidebar" class="w-full md:w-[450px] bg-white z-[100] shadow-2xl cart-closed flex flex-col cart-sidebar transition-transform duration-500">
        <div class="p-6 flex justify-between items-center border-b">
            <h2 class="text-2xl font-900 italic uppercase">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-50 h-12 w-12 rounded-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="p-8 bg-white border-t space-y-3">
            <div class="flex justify-between font-bold text-gray-500 text-sm">
                <span>Subtotal</span>
                <span id="cart-subtotal">₹0</span>
            </div>
            <div class="flex justify-between font-bold text-green-600 text-sm">
                <span>Delivery Charge</span>
                <span>₹20</span>
            </div>
            <div class="flex justify-between font-900 text-2xl pt-2 border-t border-dashed">
                <span>Total</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="processOrder('whatsapp')" class="bg-green-600 text-white py-4 rounded-2xl font-black text-[11px] uppercase tracking-tighter shadow-lg active:scale-95 transition-all">
                    WhatsApp <i class="fa-brands fa-whatsapp ml-1"></i>
                </button>
                <button onclick="processOrder('online')" class="btn-gradient text-white py-4 rounded-2xl font-black text-[11px] uppercase tracking-tighter shadow-lg active:scale-95 transition-all">
                    Pay Online <i class="fa-solid fa-bolt ml-1"></i>
                </button>
            </div>
        </div>
    </div>
    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-md"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];

        window.saveUserDetails = async () => {
            const name = document.getElementById('modal-name').value;
            const phone = document.getElementById('modal-phone').value;
            const loc = document.getElementById('modal-location').value;
            if(!name || !phone || !loc) return alert("Fill all details!");
            
            try {
                await setDoc(doc(db, "users", phone), { name, phone, location: loc, updatedAt: serverTimestamp() }, { merge: true });
                localStorage.setItem('ff_user', name);
                localStorage.setItem('ff_phone', phone);
                localStorage.setItem('ff_location', loc);
                alert("Data saved to server ✅");
                document.getElementById('user-info-modal').classList.add('hidden');
                loadUserSession();
            } catch (e) { alert("Error saving data!"); }
        };

        function loadUserSession() {
            const user = localStorage.getItem('ff_user');
            if (!user) document.getElementById('user-info-modal').classList.remove('hidden');
            document.getElementById('user-profile-img').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user || 'Guest'}`;
        }

        onSnapshot(collection(db, "menu"), (snap) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                list.innerHTML += `<div class="momo-card p-4">
                    <img src="${item.image}" class="w-full h-48 object-cover rounded-3xl mb-4">
                    <div class="flex justify-between font-900 text-lg uppercase"><span>${item.name}</span><span>₹${item.price}</span></div>
                    <button onclick="addToCart('${item.name}', ${item.price}, '${item.image}')" class="w-full bg-gray-900 text-white py-3 rounded-2xl mt-4 font-black active:scale-95">ADD TO BOX</button>
                </div>`;
            });
        });

        window.addToCart = (name, price, image) => {
            const item = cart.find(i => i.name === name);
            if(item) item.qty++; else cart.push({name, price, image, qty: 1});
            updateCartUI();
        };

        window.changeQty = (idx, delta) => {
            cart[idx].qty += delta;
            if(cart[idx].qty < 1) cart.splice(idx, 1);
            updateCartUI();
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            const badge = document.getElementById('cart-badge');
            let subtotal = 0, totalQty = 0;
            const deliveryCharge = 20;

            list.innerHTML = cart.map((i, idx) => {
                subtotal += i.price * i.qty;
                totalQty += i.qty;
                return `<div class="flex items-center gap-4 bg-gray-50 p-4 rounded-3xl">
                    <img src="${i.image}" class="w-12 h-12 object-cover rounded-xl">
                    <div class="flex-1 font-bold text-sm">${i.name}<br>₹${i.price}</div>
                    <div class="flex items-center gap-3">
                        <button onclick="changeQty(${idx}, -1)" class="w-8 h-8 bg-white rounded-lg shadow-sm font-black">-</button>
                        <span class="font-black text-xs">${i.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-8 h-8 bg-white rounded-lg shadow-sm font-black">+</button>
                    </div>
                </div>`;
            }).join('');

            badge.innerText = totalQty;
            document.getElementById('cart-subtotal').innerText = "₹" + subtotal;
            document.getElementById('cart-total').innerText = "₹" + (subtotal > 0 ? (subtotal + deliveryCharge) : 0);
        };

        window.toggleCart = (show) => {
            document.getElementById('cart-sidebar').classList.toggle('cart-open', show);
            document.getElementById('cart-sidebar').classList.toggle('cart-closed', !show);
            document.getElementById('cart-overlay').classList.toggle('hidden', !show);
        };

        window.processOrder = async (method) => {
            if(cart.length === 0) return alert("Box is empty!");
            const finalTotal = document.getElementById('cart-total').innerText;
            const userName = localStorage.getItem('ff_user');
            const userPhone = localStorage.getItem('ff_phone');
            const userLoc = localStorage.getItem('ff_location');
            
            await addDoc(collection(db, "orders"), {
                customerName: userName,
                customerPhone: userPhone,
                customerLocation: userLoc,
                items: cart, total: finalTotal, status: 'pending', createdAt: serverTimestamp()
            });

            if(method === 'online') {
                window.location.href = `upi://pay?pa=7008186187@ybl&pn=Freshfry&am=${finalTotal.replace('₹','')}&cu=INR&tn=FreshfryOrder`;
            } else {
                let itemsList = cart.map(i => `${i.name} x${i.qty}`).join(', ');
                let msg = `🍱 *New Freshfry Order*%0A*Name:* ${userName}%0A*Phone:* ${userPhone}%0A*Items:* ${itemsList}%0A*Total:* ${finalTotal}%0A*Address:* ${userLoc}`;
                window.open(`https://wa.me/917008186187?text=${msg}`);
            }
            cart = []; updateCartUI(); toggleCart(false);
        };

        window.onload = loadUserSession;
    </script>
</body>
</html>
