<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada's Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .page-active { display: block; animation: slideUp 0.4s ease-out; }
        .page-hidden { display: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-card { transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.05); }
        .premium-card:hover { transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        
        .active-nav { color: #f97316; opacity: 1 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Function to push order to Firebase
        window.sendOrderToFirebase = async (orderDetails) => {
            try {
                await addDoc(collection(db, "orders"), {
                    ...orderDetails,
                    timestamp: serverTimestamp()
                });
                return true;
            } catch (e) {
                console.error("Firebase Error:", e);
                return false;
            }
        };
    </script>

    <nav class="flex items-center justify-between px-6 py-5 bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer" onclick="showPage('home')">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <div class="flex items-center space-x-4">
            <div onclick="showPage('profile')" class="bg-gray-100 p-2.5 rounded-full cursor-pointer hover:bg-orange-100 transition group">
                <i class="fa-solid fa-user text-gray-700 group-hover:text-orange-600 text-lg"></i>
            </div>
            <div class="relative bg-orange-100 p-2.5 rounded-full">
                <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <main id="page-home" class="page-active px-6 py-6 max-w-2xl mx-auto mb-28">
        <div class="mb-10">
            <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Our Menu</h2>
            <p class="text-gray-500 font-medium">Freshly made, Baripada style! 🔥</p>
        </div>

        <div class="space-y-12">
            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-sm">
                <div class="relative h-64 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5 bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">CRUNCHY GOLD</div>
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Fried</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-fried">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-fried" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleOrder('Fried Momos', 'price-fried', 'type-fried')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all active:scale-95 shadow-lg">Add +</button>
                    </div>
                </div>
            </div>

            <div class="premium-card bg-white rounded-[2.5rem] overflow-hidden shadow-sm">
                <div class="relative h-64 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute top-5 left-5 bg-white/90 backdrop-blur px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">STEAMY FRESH</div>
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-black text-gray-900">Freshfry Stream</h3>
                        <div class="flex bg-gray-100 p-1 rounded-xl" id="type-stream">
                            <button onclick="toggleType(this, 'veg')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-green-600 shadow-sm">Veg</button>
                            <button onclick="toggleType(this, 'nonveg')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400">Non-Veg</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                        <select id="price-stream" class="text-xl font-bold bg-transparent outline-none cursor-pointer">
                            <option value="100">Half - ₹100</option>
                            <option value="150">Full - ₹150</option>
                        </select>
                        <button onclick="handleOrder('Stream Momos', 'price-stream', 'type-stream')" class="bg-gray-900 text-white px-10 py-4 rounded-2xl font-bold hover:bg-orange-500 transition-all active:scale-95 shadow-lg">Add +</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <main id="page-profile" class="page-hidden px-6 py-10 max-w-2xl mx-auto">
        <div class="flex items-center space-x-6 mb-12">
            <div class="w-24 h-24 bg-orange-500 rounded-[2.2rem] flex items-center justify-center text-white text-4xl shadow-xl shadow-orange-200 border-4 border-white">
                <i class="fa-solid fa-user-ninja"></i>
            </div>
            <div>
                <h2 class="text-3xl font-black text-gray-900">Freshfry Admin</h2>
                <p class="text-gray-500 font-medium">Verified Foodie • Baripada</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm">
                <span class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Total Orders</span>
                <p class="text-3xl font-black mt-1">14</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm">
                <span class="text-[10px] font-black uppercase text-gray-400 tracking-widest">Wallet</span>
                <p class="text-3xl font-black mt-1">₹450</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-white p-6 rounded-3xl flex items-center justify-between border border-gray-100 hover:bg-gray-50 cursor-pointer transition">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-blue-50 text-blue-500 rounded-2xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <span class="font-bold text-gray-700">Order History</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300"></i>
            </div>
            <div class="bg-white p-6 rounded-3xl flex items-center justify-between border border-gray-100 hover:bg-gray-50 cursor-pointer transition">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-green-50 text-green-500 rounded-2xl"><i class="fa-solid fa-map-location-dot"></i></div>
                    <span class="font-bold text-gray-700">Manage Address</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300"></i>
            </div>
            <button onclick="showPage('home')" class="w-full bg-red-50 text-red-500 py-5 rounded-3xl font-black tracking-widest mt-6 hover:bg-red-100 transition">LOGOUT</button>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-6 left-6 right-6 bg-gray-900 text-white py-4 px-10 rounded-full flex justify-between items-center shadow-2xl z-50">
        <i onclick="showPage('home')" id="nav-home" class="fa-solid fa-house cursor-pointer active-nav text-xl"></i>
        <div onclick="showPage('home')" class="bg-orange-500 p-3.5 rounded-full -mt-14 border-4 border-slate-50 shadow-lg cursor-pointer">
            <i class="fa-solid fa-plus text-white text-xl"></i>
        </div>
        <i onclick="showPage('profile')" id="nav-profile" class="fa-solid fa-user cursor-pointer opacity-40 text-xl"></i>
    </nav>

    <script>
        let cartCount = 0;

        // Navigation Switcher
        function showPage(pageName) {
            const home = document.getElementById('page-home');
            const profile = document.getElementById('page-profile');
            const navHome = document.getElementById('nav-home');
            const navProfile = document.getElementById('nav-profile');

            if (pageName === 'home') {
                home.className = 'page-active px-6 py-6 max-w-2xl mx-auto mb-28';
                profile.className = 'page-hidden';
                navHome.classList.add('active-nav');
                navProfile.classList.remove('active-nav');
                navProfile.classList.add('opacity-40');
            } else {
                profile.className = 'page-active px-6 py-10 max-w-2xl mx-auto';
                home.className = 'page-hidden';
                navProfile.classList.add('active-nav');
                navProfile.classList.remove('opacity-40');
                navHome.classList.remove('active-nav');
            }
            window.scrollTo(0, 0);
        }

        // Veg/Non-Veg Toggle Logic
        function toggleType(btn, type) {
            const btns = btn.parentElement.querySelectorAll('button');
            btns.forEach(b => {
                b.className = "px-4 py-1.5 rounded-lg text-xs font-bold text-gray-400";
            });
            btn.className = `px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm ${type === 'veg' ? 'text-green-600' : 'text-red-600'}`;
        }

        // Order Handler
        async function handleOrder(name, priceId, typeId) {
            const price = document.getElementById(priceId).value;
            const type = document.querySelector(`#${typeId} .bg-white`).innerText;
            const btn = event.target;

            // Update UI
            cartCount++;
            document.getElementById('cart-badge').innerText = cartCount;
            
            // Visual Feedback
            const originalText = btn.innerText;
            btn.innerText = "Added ✓";
            btn.classList.replace('bg-gray-900', 'bg-green-600');

            // Send to Firebase
            const success = await window.sendOrderToFirebase({
                itemName: name,
                price: `₹${price}`,
                category: type,
                status: 'pending'
            });

            if(!success) console.warn("Firebase save failed, check Rules.");

            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-gray-900');
            }, 1000);
        }
    </script>
</body>
</html>
