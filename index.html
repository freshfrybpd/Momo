<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada's Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary: #FF5C00; --dark: #0F172A; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: var(--dark); }
        
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .momo-card { 
            border-radius: 2.5rem; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
        }
        .momo-card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        
        .btn-primary { 
            background: linear-gradient(135deg, #FF8A00 0%, #FF5C00 100%);
            box-shadow: 0 10px 20px -5px rgba(255, 92, 0, 0.3);
        }
        
        .cart-sidebar { transition: transform 0.6s cubic-bezier(0.85, 0, 0.15, 1); box-shadow: -20px 0 50px rgba(0,0,0,0.1); }
        .cart-closed { transform: translateX(110%); }
        
        .filter-active { background: var(--dark); color: white; transform: scale(1.05); }
        
        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .gradient-text { background: linear-gradient(to right, #FF8A00, #FF5C00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="pb-24">

    <div id="login-modal" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-[3rem] p-10 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-100 rounded-full blur-3xl"></div>
            <h1 class="text-4xl font-800 tracking-tighter mb-2 italic">Fresh<span class="text-orange-500">fry.</span></h1>
            <p class="text-slate-400 font-bold uppercase tracking-[0.2em] text-[10px] mb-10">Premium Momos Hub</p>
            
            <div class="space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-phone absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input id="phone-input" type="tel" maxlength="10" placeholder="WhatsApp Number" 
                        class="w-full pl-14 pr-6 py-5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-orange-500 outline-none font-bold text-lg transition-all">
                </div>
                <button onclick="saveUser()" class="w-full btn-primary text-white py-5 rounded-2xl font-800 shadow-xl active:scale-95 transition-all uppercase tracking-widest">Explore Menu</button>
            </div>
        </div>
    </div>

    <div id="loc-modal" class="fixed inset-0 z-[90] bg-slate-900/40 backdrop-blur-sm hidden flex items-end">
        <div class="bg-white w-full rounded-t-[3.5rem] p-10 animate-slide-up">
            <div class="w-12 h-1.5 bg-slate-100 rounded-full mx-auto mb-8"></div>
            <h3 class="text-2xl font-800 mb-8 text-center italic">Select <span class="gradient-text">Delivery Zone</span></h3>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="setLoc('Murgabadi')" class="group p-6 border-2 border-slate-50 rounded-[2rem] font-800 hover:border-orange-500 transition-all text-center">
                    <i class="fa-solid fa-building text-slate-200 group-hover:text-orange-500 mb-2 block text-xl"></i>
                    <span class="text-xs uppercase">Murgabadi</span>
                </button>
                <button onclick="setLoc('Station Bazar')" class="group p-6 border-2 border-slate-50 rounded-[2rem] font-800 hover:border-orange-500 transition-all text-center">
                    <i class="fa-solid fa-train text-slate-200 group-hover:text-orange-500 mb-2 block text-xl"></i>
                    <span class="text-xs uppercase">Station Bazar</span>
                </button>
                <button onclick="setLoc('Lal Bazar')" class="group p-6 border-2 border-slate-50 rounded-[2rem] font-800 hover:border-orange-500 transition-all text-center">
                    <i class="fa-solid fa-shop text-slate-200 group-hover:text-orange-500 mb-2 block text-xl"></i>
                    <span class="text-xs uppercase">Lal Bazar</span>
                </button>
                <button onclick="setLoc('Ambika Mandir')" class="group p-6 border-2 border-slate-50 rounded-[2rem] font-800 hover:border-orange-500 transition-all text-center">
                    <i class="fa-solid fa-om text-slate-200 group-hover:text-orange-500 mb-2 block text-xl"></i>
                    <span class="text-xs uppercase">Ambika Mandir</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 px-6 py-5 glass-nav flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-800 tracking-tighter italic">Fresh<span class="text-orange-500">fry.</span></h1>
            <button onclick="showLocationPicker()" class="flex items-center gap-1.5">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span id="current-loc" class="text-[10px] font-800 uppercase text-slate-400 tracking-widest">Select Location</span>
                <i class="fa-solid fa-chevron-down text-[8px] text-slate-300"></i>
            </button>
        </div>
        <button onclick="toggleCart(true)" class="relative h-12 w-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white shadow-2xl active:scale-90 transition-all">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-800 h-5 w-5 rounded-full flex items-center justify-center border-4 border-white">0</span>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-8">
        <header class="mb-10">
            <h2 class="text-4xl font-800 tracking-tight italic leading-tight">Authentic Momos<br><span class="gradient-text">Delivered Fast.</span></h2>
        </header>

        <div class="flex gap-4 mb-10 overflow-x-auto no-scrollbar py-2">
            <button onclick="filterMenu('all')" class="filter-btn filter-active px-8 py-3.5 rounded-2xl font-800 text-xs uppercase tracking-widest shadow-lg">Menu</button>
            <button onclick="filterMenu('veg')" class="filter-btn bg-white border border-slate-100 px-8 py-3.5 rounded-2xl font-800 text-xs uppercase tracking-widest text-slate-400">Veg</button>
            <button onclick="filterMenu('non-veg')" class="filter-btn bg-white border border-slate-100 px-8 py-3.5 rounded-2xl font-800 text-xs uppercase tracking-widest text-slate-400">Non-Veg</button>
        </div>

        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white z-[100] cart-sidebar cart-closed flex flex-col">
        <div class="p-8 border-b border-slate-50 flex justify-between items-center">
            <h2 class="text-2xl font-800 italic">Your <span class="text-orange-500">Order</span></h2>
            <button onclick="toggleCart(false)" class="h-12 w-12 bg-slate-50 rounded-2xl text-slate-400 hover:text-orange-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-8 space-y-6">
            </div>

        <div class="p-8 bg-white border-t border-slate-50 space-y-6">
            <div class="relative">
                <i class="fa-solid fa-location-arrow absolute left-5 top-1/2 -translate-y-1/2 text-orange-500"></i>
                <input type="text" id="exact-address" placeholder="Door No / Landmark / Street" 
                    class="w-full pl-12 pr-6 py-5 bg-slate-50 border border-slate-100 rounded-[1.5rem] font-bold text-sm outline-none focus:ring-2 focus:ring-orange-500 transition-all">
            </div>
            
            <div class="bg-orange-50 p-5 rounded-[1.5rem] border border-orange-100/50">
                <div class="flex justify-between items-center font-800 text-2xl">
                    <span class="text-slate-400 text-sm uppercase tracking-widest">Total Bill</span>
                    <span id="cart-total" class="gradient-text">₹0</span>
                </div>
            </div>

            <button onclick="finalCheckout()" class="w-full btn-primary text-white py-6 rounded-[1.8rem] font-800 shadow-2xl active:scale-95 transition-all uppercase tracking-[0.2em] text-xs">
                Pay & Confirm Order 🚀
            </button>
            <p class="text-[9px] text-center font-bold text-slate-300 uppercase tracking-widest">Prepaid Only • Secure UPI Payment</p>
        </div>
    </div>

    <div id="order-success" class="fixed inset-0 z-[110] bg-white hidden flex flex-col items-center justify-center p-10 text-center">
        <div class="w-24 h-24 border-8 border-slate-50 border-t-orange-500 rounded-full animate-spin mb-8"></div>
        <h2 class="text-3xl font-800 italic mb-2">Connecting to <span class="text-orange-500">Payment</span></h2>
        <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">Please do not refresh</p>
    </div>

    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-slate-900/60 z-[95] hidden backdrop-blur-md"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];
        let allMenuItems = [];
        let userData = { 
            phone: localStorage.getItem('customerPhone') || '', 
            location: localStorage.getItem('customerLoc') || '' 
        };

        // --- Auth Check ---
        window.onload = () => {
            if(userData.phone) {
                document.getElementById('login-modal').style.display = 'none';
                if(userData.location) {
                    document.getElementById('current-loc').innerText = userData.location;
                } else { showLocationPicker(); }
            }
        };

        window.saveUser = () => {
            const ph = document.getElementById('phone-input').value.trim();
            if(ph.length < 10) return alert("Enter valid WhatsApp number");
            userData.phone = ph;
            localStorage.setItem('customerPhone', ph);
            document.getElementById('login-modal').style.display = 'none';
            showLocationPicker();
        };

        window.showLocationPicker = () => document.getElementById('loc-modal').classList.remove('hidden');

        window.setLoc = (loc) => {
            userData.location = loc;
            localStorage.setItem('customerLoc', loc);
            document.getElementById('current-loc').innerText = loc;
            document.getElementById('loc-modal').classList.add('hidden');
        };

        // --- Menu Rendering ---
        onSnapshot(collection(db, "menu"), (snap) => {
            allMenuItems = [];
            snap.forEach(d => allMenuItems.push({id: d.id, ...d.data()}));
            renderMenu('all');
        });

        window.renderMenu = (filter) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            
            // UI Filter State Update
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('filter-active', 'bg-slate-900', 'text-white'));
            
            const items = filter === 'all' ? allMenuItems : allMenuItems.filter(i => i.type === filter);
            
            items.forEach(item => {
                const isStock = item.inStock !== false;
                list.innerHTML += `
                <div class="momo-card ${!isStock ? 'opacity-50 grayscale' : ''}">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${item.image}" class="w-full h-full object-cover">
                        ${item.isBestseller ? '<div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-2xl text-[10px] font-800 tracking-widest text-orange-500 shadow-xl italic">BESTSELLER</div>' : ''}
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-800 text-lg italic">${item.name}</h4>
                                <p class="text-[10px] font-bold text-slate-300 uppercase tracking-widest mt-1">${item.type || 'Freshfry Special'}</p>
                            </div>
                            <span class="text-xl font-800 text-slate-900">₹${item.price}</span>
                        </div>
                        <button onclick="${isStock ? `addToCart('${item.name}', ${item.price}, '${item.image}')` : ''}" 
                            class="w-full ${isStock ? 'btn-primary text-white' : 'bg-slate-100 text-slate-400'} py-4 rounded-2xl font-800 text-[10px] uppercase tracking-[0.2em] transition-all">
                            ${isStock ? 'Add to Box +' : 'Sold Out'}
                        </button>
                    </div>
                </div>`;
            });
        };

        window.addToCart = (name, price, image) => {
            const item = cart.find(i => i.name === name);
            if(item) item.qty++; else cart.push({name, price, image, qty: 1});
            updateCartUI();
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            document.getElementById('cart-badge').innerText = cart.reduce((a, b) => a + b.qty, 0);
            
            if(cart.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-20"><i class="fa-solid fa-bag-shopping text-6xl mb-4"></i><p class="font-800 uppercase text-xs tracking-widest">Empty Box</p></div>`;
                document.getElementById('cart-total').innerText = "₹0";
                return;
            }

            list.innerHTML = cart.map(item => {
                total += (item.price * item.qty);
                return `<div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-2xl">
                    <div class="flex-1">
                        <p class="text-xs font-800 italic uppercase">${item.name}</p>
                        <p class="text-[10px] font-bold text-slate-400 mt-1">₹${item.price} × ${item.qty}</p>
                    </div>
                    <div class="font-800 text-sm">₹${item.price * item.qty}</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = "₹" + total;
        };

        window.toggleCart = (o) => {
            document.getElementById('cart-sidebar').classList.toggle('cart-closed', !o);
            document.getElementById('cart-overlay').classList.toggle('hidden', !o);
        };

        // --- Payment Flow ---
        window.finalCheckout = async () => {
            const addr = document.getElementById('exact-address').value;
            const totalVal = document.getElementById('cart-total').innerText.replace('₹', '');
            if(cart.length === 0 || !addr) return alert("Enter address & items!");

            const upiId = "7008186187@ybl";
            const upiUrl = `upi://pay?pa=${upiId}&pn=Freshfry&am=${totalVal}&cu=INR&tn=MomoOrder`;

            try {
                const docRef = await addDoc(collection(db, "orders"), {
                    customer: userData.phone,
                    location: userData.location,
                    address: addr,
                    total: "₹" + totalVal,
                    items: cart,
                    status: 'pending',
                    riderName: '',
                    time: serverTimestamp()
                });

                localStorage.setItem('currentOrderId', docRef.id);
                document.getElementById('order-success').classList.remove('hidden');

                // Redirect Flow
                window.location.href = upiUrl;
                
                setTimeout(() => {
                    let waMsg = `*🍱 FRESHFRY ORDER CONFIRMED*%0A------------------%0A*Phone:* ${userData.phone}%0A*Address:* ${addr}%0A*Total Paid:* ₹${totalVal}%0A------------------%0A`;
                    cart.forEach(i => waMsg += `• ${i.name} (x${i.qty})%0A`);
                    window.location.href = `https://wa.me/917008186187?text=${waMsg}`;
                }, 4000);

            } catch(e) { alert("Checkout failed!"); }
        };
        
        window.filterMenu = (t) => renderMenu(t);
    </script>
</body>
</html>
