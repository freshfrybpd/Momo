<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --primary: #ff5e00; --dark: #0f172a; }
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: var(--dark); overflow-x: hidden; }
        
        /* Marquee */
        .marquee-wrapper { background: #000; overflow: hidden; white-space: nowrap; padding: 12px 0; display: flex; border-bottom: 2px solid var(--primary); }
        .marquee-content { display: inline-block; animation: scroll-left 25s linear infinite; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: white; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Momo Cards */
        .momo-card { border-radius: 2.5rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white; border: 1px solid rgba(0,0,0,0.03); position: relative; overflow: hidden; }
        .momo-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(255, 94, 0, 0.15); }
        .food-badge { position: absolute; top: 20px; left: 20px; padding: 5px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; z-index: 10; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* Sidebar Navigation */
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 420px; background: white; }
        .sidebar-open { transform: translateX(0); box-shadow: -20px 0 60px rgba(0,0,0,0.1); }
        .sidebar-closed { transform: translateX(100%); }
        
        .btn-gradient { background: linear-gradient(135deg, #ff8a00 0%, #ff5e00 100%); }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }

        .qty-btn { width: 32px; height: 32px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; border: 1px solid #eee; }
        .qty-btn:active { transform: scale(0.9); background: #f8fafc; }
        
        #overlay { background: rgba(0,0,0,0.5); }
        
        .filter-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-filter { background: #0f172a !important; color: white !important; border-color: #0f172a !important; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <div class="marquee-wrapper">
        <div id="promo-text" class="marquee-content italic uppercase font-black">FRESHFRY MOMOS IS LIVE IN BARIPADA! • ORDER NOW • 100% PREMIUM QUALITY •</div>
    </div>

    <div id="user-info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-6 z-[3000]">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 btn-gradient"></div>
        
        <h3 class="text-2xl font-900 italic uppercase mb-2">Welcome to <span class="text-orange-500">Freshfry</span></h3>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">Enter your details to start ordering</p>

        <div class="space-y-4">
            <div class="relative">
                <i class="fa-solid fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                <input type="text" id="modal-name" placeholder="Full Name" class="w-full bg-gray-50 border-none rounded-2xl py-4 pl-12 pr-6 font-bold text-sm focus:ring-2 focus:ring-orange-500 transition-all">
            </div>
            
            <div class="relative">
                <i class="fa-solid fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-gray-300 text-xs"></i>
                <input type="tel" id="modal-phone" placeholder="Mobile Number" class="w-full bg-gray-50 border-none rounded-2xl py-4 pl-12 pr-6 font-bold text-sm focus:ring-2 focus:ring-orange-500 transition-all">
            </div>

            <div class="relative">
                <i class="fa-solid fa-location-dot absolute left-5 top-5 text-gray-300 text-xs"></i>
                <textarea id="modal-location" rows="3" placeholder="Exact Delivery Location" class="w-full bg-gray-50 border-none rounded-2xl py-4 pl-12 pr-6 font-bold text-sm focus:ring-2 focus:ring-orange-500 resize-none transition-all"></textarea>
            </div>
        </div>

        <button onclick="saveUserDetails()" class="w-full btn-gradient text-white py-5 rounded-[2rem] font-black text-lg mt-8 shadow-xl active:scale-95 transition-all uppercase italic tracking-tight">
            Start Feasting
        </button>

        <button onclick="logoutUser()" id="logout-btn" class="w-full mt-4 py-2 text-[10px] font-black text-red-500 uppercase tracking-[0.2em] opacity-60 hover:opacity-100 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-power-off"></i> Logout Account
        </button>
    </div>
</div>


    <nav class="sticky top-0 z-40 px-6 py-4 glass-nav border-b border-gray-100 flex justify-between items-center">
        <h1 class="text-2xl font-900 tracking-tighter italic uppercase">Fresh<span class="text-orange-600">fry.</span></h1>
        <div class="flex items-center gap-3">
            <button onclick="toggleOrders(true)" class="bg-gray-100 text-gray-900 h-11 w-11 rounded-2xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-receipt text-lg"></i></button>
            <div onclick="toggleCart(true)" class="bg-gray-900 text-white h-11 w-11 rounded-2xl cursor-pointer relative flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </div>
            <div onclick="document.getElementById('user-info-modal').classList.remove('hidden')" class="h-11 w-11 rounded-2xl border-2 border-orange-500 overflow-hidden cursor-pointer">
                <img id="user-profile-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" class="h-full w-full object-cover">
            </div>
        </div>
    </nav>
    
    <div class="flex justify-center gap-2 px-6 mt-8 overflow-x-auto no-scrollbar">
        <button onclick="filterMenu('All')" id="btn-all" class="filter-btn active-filter px-6 py-3 rounded-2xl text-[10px] font-900 uppercase tracking-widest border border-slate-100 bg-white shadow-sm">All</button>
        <button onclick="filterMenu('Veg')" id="btn-veg" class="filter-btn px-6 py-3 rounded-2xl text-[10px] font-900 uppercase tracking-widest border border-slate-100 bg-white text-slate-400 shadow-sm">Veg Only 🥗</button>
        <button onclick="filterMenu('Non-Veg')" id="btn-nonveg" class="filter-btn px-6 py-3 rounded-2xl text-[10px] font-900 uppercase tracking-widest border border-slate-100 bg-white text-slate-400 shadow-sm">Non-Veg 🍗</button>
    </div>

    <main class="px-6 mt-8 max-w-6xl mx-auto">
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="cart-sidebar" class="sidebar sidebar-closed flex flex-col">
        <div class="p-6 flex justify-between items-center border-b font-900 italic uppercase">
            <h2 class="text-2xl tracking-tighter">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-50 h-10 w-10 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 bg-white border-t space-y-3">
            <div class="flex justify-between text-[11px] font-900 text-gray-400 uppercase tracking-widest">
                <span>Items Total</span>
                <span id="cart-subtotal">₹0</span>
            </div>
            <div class="flex justify-between text-[11px] font-900 text-green-600 uppercase tracking-widest">
                <span>Delivery Fee</span>
                <span>₹20</span>
            </div>
            <div class="flex justify-between font-900 text-2xl pt-3 border-t border-dashed border-gray-100 uppercase italic">
                <span>Total Bill</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-4">
                <button onclick="processOrder('whatsapp')" class="bg-[#25D366] text-white py-4 rounded-2xl font-black text-[11px] uppercase flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
                <button onclick="processOrder('online')" class="btn-gradient text-white py-4 rounded-2xl font-black text-[11px] uppercase">Pay Online</button>
            </div>
        </div>
    </div>

    <div id="orders-sidebar" class="sidebar sidebar-closed flex flex-col">
        <div class="p-6 flex justify-between items-center border-b font-900 italic uppercase">
            <h2 class="text-2xl tracking-tighter">My Orders</h2>
            <button onclick="toggleOrders(false)" class="bg-gray-50 h-10 w-10 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="my-orders-list" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50"></div>
    </div>

    <div id="overlay" onclick="closeAllSidebars()" class="fixed inset-0 z-50 hidden backdrop-blur-sm"></div>

    <div id="feedback-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-6 z-[5000]">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-star"></i>
            </div>
            <h3 class="text-2xl font-900 italic uppercase">How was the <span class="text-orange-500">Taste?</span></h3>
            <div class="flex justify-center gap-2 my-6">
                <button onclick="setStar(1)" class="star-btn text-2xl text-slate-200"><i class="fa-solid fa-star"></i></button>
                <button onclick="setStar(2)" class="star-btn text-2xl text-slate-200"><i class="fa-solid fa-star"></i></button>
                <button onclick="setStar(3)" class="star-btn text-2xl text-slate-200"><i class="fa-solid fa-star"></i></button>
                <button onclick="setStar(4)" class="star-btn text-2xl text-slate-200"><i class="fa-solid fa-star"></i></button>
                <button onclick="setStar(5)" class="star-btn text-2xl text-slate-200"><i class="fa-solid fa-star"></i></button>
            </div>
            <textarea id="feedback-text" placeholder="Anything else? (Optional)" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold mb-4 focus:ring-2 focus:ring-orange-500 resize-none"></textarea>
            <button onclick="submitFeedback()" class="w-full btn-gradient text-white py-4 rounded-2xl font-black uppercase text-[11px] shadow-lg active:scale-95 transition">Submit Review</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, setDoc, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];
        let currentFilter = 'All';

        // Filter Logic
        window.filterMenu = (type) => {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active-filter');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`btn-${type.toLowerCase().replace('-','')}`).classList.add('active-filter');
            loadMenu(); 
        };

        // Real-time Menu Loader (Corrected)
        function loadMenu() {
            onSnapshot(collection(db, "menu"), (snap) => {
                const list = document.getElementById('menu-list'); 
                list.innerHTML = '';
                snap.forEach(d => {
                    const item = d.data();
                    if(currentFilter !== 'All' && item.type !== currentFilter) return;

                    const isAvailable = item.inStock !== false; 
                    const badgeColor = item.type === 'Veg' ? 'bg-green-600' : 'bg-red-600';

                    list.innerHTML += `
                        <div class="momo-card p-4">
                            <div class="food-badge ${badgeColor}">${item.type || 'Veg'}</div>
                            <img src="${item.image}" class="w-full h-56 object-cover rounded-[2rem] mb-4 ${isAvailable ? '' : 'grayscale opacity-60'}">
                            <div class="flex justify-between font-900 text-lg uppercase px-2 italic">
                                <span class="${isAvailable ? '' : 'text-gray-400'}">${item.name}</span>
                                <span class="text-orange-600">₹${item.price}</span>
                            </div>
                            ${isAvailable ? 
                                `<button onclick="addToCart('${item.name}', ${item.price}, '${item.image}')" class="w-full bg-gray-900 text-white py-4 rounded-2xl mt-4 font-black active:scale-95 shadow-lg">ADD TO BOX</button>` 
                                : 
                                `<button class="w-full bg-gray-200 text-gray-500 py-4 rounded-2xl mt-4 font-black cursor-not-allowed" disabled>SOLD OUT</button>`
                            }
                        </div>`;
                });
            });
        }

        // Cart & Orders Logic
        window.addToCart = (n, p, i) => { 
            const ex = cart.find(x => x.name === n); 
            if(ex) ex.qty++; else cart.push({name:n, price:p, image:i, qty:1}); 
            updateCartUI(); 
        };
        
        window.changeQty = (idx, d) => { 
            cart[idx].qty += d; 
            if(cart[idx].qty < 1) cart.splice(idx, 1); 
            updateCartUI(); 
        };
        
        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            let subtotal = 0, count = 0;
            list.innerHTML = cart.map((i, idx) => {
                subtotal += (i.price * i.qty);
                count += i.qty;
                return `
                    <div class="flex items-center gap-4 bg-white p-4 rounded-[2rem] border border-gray-50">
                        <img src="${i.image}" class="w-16 h-16 object-cover rounded-[1.2rem]">
                        <div class="flex-1">
                            <p class="font-900 text-[11px] uppercase">${i.name}</p>
                            <p class="text-orange-500 font-900 text-[10px]">₹${i.price}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-xl">
                            <button onclick="changeQty(${idx},-1)" class="qty-btn">-</button>
                            <span class="font-900 text-xs w-5 text-center">${i.qty}</span>
                            <button onclick="changeQty(${idx},1)" class="qty-btn">+</button>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('cart-badge').innerText = count;
            document.getElementById('cart-subtotal').innerText = "₹" + subtotal;
            document.getElementById('cart-total').innerText = "₹" + (subtotal > 0 ? subtotal + 20 : 0);
        };

        window.processOrder = async (method) => {
            if (cart.length === 0) return alert("Box khali hai!");
            const phone = localStorage.getItem('ff_phone');
            if(!phone) return document.getElementById('user-info-modal').classList.remove('hidden');

            const orderPin = Math.floor(1000 + Math.random() * 9000);
            const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            
            const orderData = {
                customerName: localStorage.getItem('ff_user'),
                customerPhone: phone,
                customerLocation: localStorage.getItem('ff_location'),
                items: cart,
                total: "₹" + (subtotal + 20),
                status: 'pending',
                orderPin: orderPin,
                createdAt: serverTimestamp()
            };

            const docRef = await addDoc(collection(db, "orders"), orderData);
            if (method === 'whatsapp') {
                const msg = `*NEW ORDER*%0AOrder ID: #${docRef.id.slice(0,5)}%0APIN: ${orderPin}%0AItems: ${cart.map(i => `${i.qty}x ${i.name}`).join(', ')}`;
                window.open(`https://wa.me/917008186187?text=${msg}`);
            }
            cart = []; updateCartUI(); toggleCart(false);
            alert(`Order Placed! Your PIN is ${orderPin}`);
        };

        window.loadMyOrders = () => {
    const p = localStorage.getItem('ff_phone');
    if(!p) return;

    // Firebase query to get user's orders
    const q = query(collection(db, "orders"), where("customerPhone", "==", p));
    
    onSnapshot(q, (snap) => {
        const list = document.getElementById('my-orders-list');
        
        if(snap.empty) {
            list.innerHTML = `
                <div class="text-center py-10">
                    <i class="fa-solid fa-box-open text-gray-200 text-5xl mb-4"></i>
                    <p class="text-[10px] text-gray-400 font-black uppercase tracking-widest">No orders yet!</p>
                </div>`;
            return;
        }

        const ordersArray = [];
        snap.forEach(d => ordersArray.push({ id: d.id, ...d.data() }));
        
        // Latest orders first (Sorting by time)
        ordersArray.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

        list.innerHTML = ordersArray.map(o => {
            // Status Styling
            let sCol = o.status === 'delivered' ? 'text-green-600' : 'text-orange-600';
            let sBg = o.status === 'delivered' ? 'bg-green-50' : 'bg-orange-50';
            
            // --- RIDER SECTION LOGIC ---
            let riderSection = "";
            if (o.riderName) {
                riderSection = `
                    <div class="mt-4 p-4 bg-slate-900 rounded-[1.8rem] flex justify-between items-center border-l-4 border-orange-500 shadow-xl transition-all animate-in fade-in slide-in-from-bottom-2">
                        <div class="flex-1">
                            <p class="text-[7px] text-orange-400 font-black uppercase tracking-widest opacity-80">Rider Assigned</p>
                            <p class="text-sm text-white font-black italic uppercase leading-none mt-1">${o.riderName}</p>
                            <p class="text-[10px] text-slate-400 font-bold mt-1.5 tracking-tight">
                                ${o.riderPhone ? `<i class="fa-solid fa-phone-flip text-[8px] mr-1"></i> ${o.riderPhone}` : 'Contacting Rider...'}
                            </p>
                        </div>
                        
                        ${o.riderPhone ? `
                        <a href="tel:${o.riderPhone}" class="h-11 w-11 bg-orange-500 text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all border-2 border-white/10">
                            <i class="fa-solid fa-phone"></i>
                        </a>` : `
                        <div class="h-11 w-11 bg-slate-800 text-slate-600 rounded-2xl flex items-center justify-center border border-slate-700">
                            <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                        </div>`}
                    </div>
                `;
            }

            return `
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm mb-5 relative border border-gray-100">
                    <div class="absolute top-5 right-5 bg-gray-900 text-white p-2.5 rounded-2xl text-center min-w-[55px] shadow-lg">
                        <p class="text-[7px] text-gray-500 font-black uppercase tracking-tighter">Order PIN</p>
                        <p class="text-xs font-black text-orange-400">${o.orderPin || '----'}</p>
                    </div>

                    <span class="${sBg} ${sCol} px-3 py-1 rounded-full text-[9px] font-900 uppercase italic border border-current/20 tracking-wider">
                        ${o.status.replace(/_/g, ' ')}
                    </span>

                    <p class="font-900 text-2xl italic mt-3 text-slate-800 tracking-tighter">${o.total}</p>
                    <div class="flex items-center gap-2 mt-1">
                        <i class="fa-solid fa-utensils text-[8px] text-slate-300"></i>
                        <p class="text-[10px] text-gray-400 uppercase font-black tracking-tight">
                            ${o.items ? o.items.map(i => `${i.qty}x ${i.name}`).join(' • ') : 'Delicious Items'}
                        </p>
                    </div>
                    
                    ${riderSection}
                </div>`;
        }).join('');
    });
};





        // User Session & Feedback
        window.loadUserSession = () => {
    const name = localStorage.getItem('ff_user');
    const phone = localStorage.getItem('ff_phone');
    const loc = localStorage.getItem('ff_location');

    if (name) {
        document.getElementById('user-profile-img').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
        
        // Inputs fill karein
        if(document.getElementById('modal-name')) document.getElementById('modal-name').value = name;
        if(document.getElementById('modal-phone')) document.getElementById('modal-phone').value = phone;
        if(document.getElementById('modal-location')) document.getElementById('modal-location').value = loc;
    } else {
        document.getElementById('user-info-modal').classList.remove('hidden');
    }
};



        window.saveUserDetails = async () => {
    const name = document.getElementById('modal-name').value;
    const phone = document.getElementById('modal-phone').value;
    const loc = document.getElementById('modal-location').value;

    if(!name || !phone || !loc) {
        alert("Bhai, saari details bharna zaroori hai! 😊");
        return;
    }

    try {
        // 1. Firebase mein store karna (Phone number ko Unique ID maante hue)
        await setDoc(doc(db, "users", phone), {
            name: name,
            phone: phone,
            location: loc,
            joinedAt: serverTimestamp()
        });

        // 2. Local browser mein save karna taaki baar-baar login na maange
        localStorage.setItem('ff_user', name);
        localStorage.setItem('ff_phone', phone);
        localStorage.setItem('ff_location', loc);

        // 3. Modal band karna
        document.getElementById('user-info-modal').classList.add('hidden');

        // 4. Beautiful Success UI dikhana
        showSuccessToast(name);

        loadUserSession();
    } catch (error) {
        console.error("Firebase Error:", error);
        alert("Data store nahi ho paya. Connection check karein.");
    }
};

// Beautiful Toast Notification Function
function showSuccessToast(userName) {
    // Purane toast ko remove karne ke liye agar koi screen par ho
    const oldToast = document.getElementById('ff-toast');
    if(oldToast) oldToast.remove();

    const toast = document.createElement('div');
    toast.id = "ff-toast";
    // Styling: Bottom center, Glass effect, Bold Border
    toast.className = "fixed bottom-10 left-1/2 -translate-x-1/2 z-[9999] w-[90%] max-w-[350px] animate-bounce";
    
    toast.innerHTML = `
        <div class="bg-slate-900/95 backdrop-blur-xl border-t-4 border-orange-500 shadow-[0_20px_50px_rgba(0,0,0,0.3)] rounded-[2.5rem] p-5 flex items-center gap-4 border border-white/10">
            <div class="bg-gradient-to-tr from-orange-500 to-yellow-400 h-12 w-12 rounded-full flex items-center justify-center shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-check text-white text-xl"></i>
            </div>
            <div class="flex-1">
                <p class="text-[8px] font-black uppercase tracking-[0.2em] text-orange-400 opacity-80">System Secured</p>
                <p class="text-[13px] font-black text-white italic uppercase tracking-tight">
                    Welcome to <span class="text-orange-500">Freshfry</span>, ${userName}!
                </p>
                <p class="text-[9px] text-slate-400 font-bold">Data synced to Baripada HQ</p>
            </div>
        </div>
    `;

    document.body.appendChild(toast);

    // 4 second baad fade out hokar remove ho jayega
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = '0.5s all ease';
        setTimeout(() => toast.remove(), 500);
    }, 4000);
}



        let selectedRating = 0, pendingFeedbackId = null;
        window.setStar = (n) => {
            selectedRating = n;
            document.querySelectorAll('.star-btn').forEach((b, i) => b.classList.toggle('text-orange-500', i < n));
        };

        window.submitFeedback = async () => {
            if(!selectedRating) return alert("Select Stars!");
            await updateDoc(doc(db, "orders", pendingFeedbackId), { rating: selectedRating, feedback: document.getElementById('feedback-text').value, showFeedback: false });
            document.getElementById('feedback-modal').classList.add('hidden');
        };

        setInterval(() => {
            const p = localStorage.getItem('ff_phone');
            if(!p) return;
            onSnapshot(query(collection(db, "orders"), where("customerPhone", "==", p), where("showFeedback", "==", true)), snap => {
                snap.forEach(d => { pendingFeedbackId = d.id; document.getElementById('feedback-modal').classList.remove('hidden'); });
            });
        }, 10000);

        window.toggleCart = (s) => { document.getElementById('cart-sidebar').classList.toggle('sidebar-open', s); document.getElementById('cart-sidebar').classList.toggle('sidebar-closed', !s); document.getElementById('overlay').classList.toggle('hidden', !s); };
        window.toggleOrders = (s) => { document.getElementById('orders-sidebar').classList.toggle('sidebar-open', s); document.getElementById('orders-sidebar').classList.toggle('sidebar-closed', !s); document.getElementById('overlay').classList.toggle('hidden', !s); if(s) loadMyOrders(); };
        window.closeAllSidebars = () => { toggleCart(false); toggleOrders(false); };

        window.onload = () => { loadUserSession(); loadMenu(); };
        
        
        window.logoutUser = () => {
    // 1. Confirm karein ki logout karna hai
    if(confirm("Bhai, logout karna chahte ho? 🥺")) {
        // 2. Browser se saara data uda dein
        localStorage.clear();
        
        // 3. Page ko refresh karein taaki fresh login screen aaye
        window.location.reload();
    }
};

    </script>
