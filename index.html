<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        .momo-card { border-radius: 2rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .momo-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        
        #cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-open { transform: translateX(0); }
        .cart-closed { transform: translateX(100%); }

        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-32">

    <nav class="sticky top-0 z-40 p-5 glass border-b border-gray-100 flex justify-between items-center">
        <h1 class="text-2xl font-900 tracking-tighter">Fresh<span class="text-orange-500">fry.</span></h1>
        <div onclick="toggleCart(true)" class="bg-gray-900 text-white p-3 rounded-2xl cursor-pointer relative active:scale-90 transition-all">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-badge" class="absolute -top-2 -right-2 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </div>
    </nav>

    <div id="promo-banner" class="hidden mx-6 mt-6 p-5 bg-gradient-to-r from-orange-500 to-orange-600 rounded-[2.5rem] text-white shadow-xl shadow-orange-200 relative overflow-hidden">
        <div class="relative z-10 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-80">Today's Deal</p>
                <h3 id="p-title" class="text-xl font-900 leading-tight">--</h3>
            </div>
            <div id="p-code" class="bg-black/20 backdrop-blur-md px-4 py-2 rounded-xl font-900 text-sm border border-white/20">--</div>
        </div>
        <i class="fa-solid fa-fire absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
    </div>

    <main class="px-6 mt-10">
        <h2 class="text-2xl font-900 mb-8">Baripada's <span class="text-orange-500 underline decoration-orange-200">Favorites</span></h2>
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full py-20 text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-orange-500"></i>
            </div>
        </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-50 shadow-2xl cart-closed flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-2xl font-900">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-100 p-3 rounded-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4 font-bold text-gray-700">
            <p class="text-center text-gray-400 py-10">Empty! 🥟 Add some momos.</p>
        </div>

        <div class="p-8 bg-gray-50 border-t space-y-4">
            <div class="flex justify-between font-900 text-xl">
                <span>Total Amount</span>
                <span id="cart-total" class="text-orange-500">₹0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gray-900 text-white py-5 rounded-[2rem] font-black shadow-xl active:scale-95 transition-all">CHECKOUT NOW</button>
        </div>
    </div>
    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/40 z-40 hidden backdrop-blur-sm"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];

        // --- FETCH PROMO ---
        onSnapshot(doc(db, "settings", "promo"), (d) => {
            if(d.exists()) {
                const data = d.data();
                document.getElementById('promo-banner').classList.remove('hidden');
                document.getElementById('p-title').innerText = data.text;
                document.getElementById('p-code').innerText = data.code;
            }
        });

        // --- FETCH MENU ---
        onSnapshot(collection(db, "menu"), (snap) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                list.innerHTML += `
                    <div class="momo-card bg-white p-4 border border-gray-100 shadow-sm relative overflow-hidden">
                        <img src="${item.image}" class="w-full h-52 object-cover rounded-[1.8rem] mb-4 shadow-inner" onerror="this.src='https://via.placeholder.com/400x300?text=Freshfry+Momo'">
                        <div class="px-2">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-900 text-xl text-gray-800">${item.name}</h4>
                                <span class="font-900 text-xl text-orange-500">₹${item.price}</span>
                            </div>
                            <p class="text-[10px] font-black uppercase tracking-widest ${item.type === 'veg' ? 'text-green-500' : 'text-red-500'} mb-4">
                                <i class="fa-solid fa-circle text-[8px] mr-1"></i>${item.type}
                            </p>
                            <button onclick="addToCart('${item.name}', ${item.price}, '${item.image}')" 
                                class="w-full bg-gray-50 hover:bg-orange-500 hover:text-white py-4 rounded-2xl font-black transition-all border border-gray-100 active:scale-95">
                                ADD TO BOX +
                            </button>
                        </div>
                    </div>`;
            });
        });

        // --- CART LOGIC ---
        window.addToCart = (name, price, image) => {
            cart.push({ name, price, image });
            updateCartUI();
            
            // Subtle feedback
            const btn = event.target;
            btn.innerText = "ADDED! ✨";
            setTimeout(() => btn.innerText = "ADD TO BOX +", 800);
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            
            badge.innerText = cart.length;
            
            if(cart.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 py-10">Empty! 🥟 Add some momos.</p>`;
                totalEl.innerText = "₹0";
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, index) => {
                total += parseInt(item.price);
                return `
                    <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl shadow-sm">
                        <div class="flex-1">
                            <p class="text-sm font-900">${item.name}</p>
                            <p class="text-orange-500 text-xs font-bold">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-gray-300 hover:text-red-500 px-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            }).join('');
            
            totalEl.innerText = "₹" + total;
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            updateCartUI();
        };

        window.toggleCart = (open) => {
            const sb = document.getElementById('cart-sidebar');
            const ov = document.getElementById('cart-overlay');
            if(open) {
                sb.classList.replace('cart-closed', 'cart-open');
                ov.classList.remove('hidden');
            } else {
                sb.classList.replace('cart-open', 'cart-closed');
                ov.classList.add('hidden');
            }
        };

        window.checkout = () => {
            if(cart.length === 0) return alert("Box is empty!");
            alert("This will open Payment/Order Page 🥟");
        };
    </script>
</body>
</html>
