<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Premium Momos Baripada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: #0f172a; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .momo-card { border-radius: 2.5rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white; border: 1px solid #f1f5f9; position: relative; }
        .momo-card:hover { transform: translateY(-8px); shadow: 0 25px 50px -12px rgba(255, 94, 0, 0.15); }
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1); }
        .cart-closed { transform: translateX(100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <div id="login-modal" class="fixed inset-0 z-[60] bg-white flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center">
            <h1 class="text-4xl font-900 tracking-tighter mb-2">Fresh<span class="text-orange-500">fry.</span></h1>
            <p class="text-gray-400 font-bold uppercase tracking-widest text-[10px] mb-8">Baripada's Premium Momos</p>
            <div class="bg-gray-50 p-8 rounded-[2.5rem] border border-gray-100 shadow-inner">
                <input id="phone-input" type="tel" maxlength="10" placeholder="Enter Phone Number" 
                    class="w-full px-6 py-5 bg-white border border-gray-200 rounded-2xl focus:ring-2 focus:ring-orange-500 outline-none font-bold text-center text-lg mb-4">
                <button onclick="saveUser()" class="w-full bg-gray-900 text-white py-5 rounded-2xl font-black shadow-xl active:scale-95 transition-all">START ORDERING</button>
            </div>
        </div>
    </div>

    <div id="loc-modal" class="fixed inset-0 z-[55] bg-black/60 backdrop-blur-sm hidden flex items-end">
        <div class="bg-white w-full rounded-t-[3rem] p-8">
            <h3 class="text-2xl font-900 mb-6 px-2">Delivery Location</h3>
            <div class="grid grid-cols-2 gap-3 mb-8">
                <button onclick="setLoc('Murgabadi')" class="p-4 border-2 border-gray-100 rounded-2xl font-bold hover:border-orange-500 hover:text-orange-500 transition-all text-sm">Murgabadi</button>
                <button onclick="setLoc('Station Bazar')" class="p-4 border-2 border-gray-100 rounded-2xl font-bold hover:border-orange-500 hover:text-orange-500 transition-all text-sm">Station Bazar</button>
                <button onclick="setLoc('Lal Bazar')" class="p-4 border-2 border-gray-100 rounded-2xl font-bold hover:border-orange-500 hover:text-orange-500 transition-all text-sm">Lal Bazar</button>
                <button onclick="setLoc('Ambika Mandir')" class="p-4 border-2 border-gray-100 rounded-2xl font-bold hover:border-orange-500 hover:text-orange-500 transition-all text-sm">Ambika Mandir</button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-40 px-6 py-4 glass border-b border-gray-100 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-900 tracking-tighter">Fresh<span class="text-orange-500">fry.</span></h1>
            <button onclick="showLocationPicker()" class="text-[10px] font-black text-gray-400 flex items-center gap-1 uppercase tracking-tighter">
                <i class="fa-solid fa-location-dot text-orange-500"></i> <span id="current-loc">Select Location</span> <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>
        <div onclick="toggleCart(true)" class="bg-gray-900 text-white h-12 w-12 rounded-2xl cursor-pointer relative flex items-center justify-center active:scale-90 transition-all shadow-lg">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-orange-500 text-[10px] font-black h-5 w-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </div>
    </nav>

    <main class="px-6 mt-8">
        <div class="flex gap-3 mb-8 overflow-x-auto no-scrollbar py-2">
            <button onclick="filterMenu('all')" id="btn-all" class="filter-btn bg-gray-900 text-white px-6 py-2.5 rounded-2xl font-black text-xs transition-all shadow-lg">ALL</button>
            <button onclick="filterMenu('veg')" id="btn-veg" class="filter-btn bg-white text-gray-400 border border-gray-100 px-6 py-2.5 rounded-2xl font-black text-xs transition-all">🥦 VEG</button>
            <button onclick="filterMenu('non-veg')" id="btn-non-veg" class="filter-btn bg-white text-gray-400 border border-gray-100 px-6 py-2.5 rounded-2xl font-black text-xs transition-all">🍗 NON-VEG</button>
        </div>

        <h2 class="text-2xl font-900 mb-6 italic">Hot & Fresh 🔥</h2>
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="mt-20 px-8 py-12 bg-white border-t border-gray-100 text-center">
        <div class="inline-flex items-center gap-2 bg-orange-50 px-4 py-2 rounded-full text-orange-600 font-bold text-xs mb-4">
            <i class="fa-solid fa-heart animate-pulse"></i> Handcrafted with love in Baripada
        </div>
        <p class="text-gray-400 text-sm font-medium leading-relaxed max-w-xs mx-auto">
            We use <span class="text-gray-800 font-bold">100% fresh ingredients</span> daily to ensure you get the best taste.
        </p>
    </footer>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-50 shadow-2xl cart-closed flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-2xl font-900 italic">Your Box</h2>
            <button onclick="toggleCart(false)" class="bg-gray-50 p-3 rounded-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="mx-6 p-4 bg-orange-50 rounded-2xl border border-orange-100 mb-4">
            <p class="text-[10px] font-black text-orange-600 uppercase mb-3 tracking-widest">Personalize Your Box (Free)</p>
            <div class="space-y-3">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-bold text-gray-700">🌶️ Extra Spicy Chutney</span>
                    <input type="checkbox" id="extra-spicy" class="w-5 h-5 accent-orange-500 rounded-lg">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-bold text-gray-700">🤍 Classic Mayo</span>
                    <input type="checkbox" id="extra-mayo" class="w-5 h-5 accent-orange-500 rounded-lg">
                </label>
            </div>
        </div>

        <div class="p-6 bg-white border-t space-y-4">
            <input type="text" id="exact-address" placeholder="Flat No / Landmark / Street" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-orange-500">
            <div class="flex justify-between font-900 text-xl px-2">
                <span>Total</span>
                <span id="cart-total" class="text-orange-600 font-900">₹0</span>
            </div>
            <button onclick="finalCheckout()" class="w-full bg-orange-500 text-white py-5 rounded-[2rem] font-black shadow-xl shadow-orange-100 active:scale-95 transition-all">CONFIRM ORDER</button>
        </div>
    </div>

    <div id="order-success" class="fixed inset-0 z-[100] bg-orange-600 text-white hidden flex flex-col items-center justify-center p-10 text-center">
        <div class="w-24 h-24 bg-white text-orange-600 rounded-full flex items-center justify-center text-4xl mb-6 shadow-2xl animate-bounce">
            <i class="fa-check"></i>
        </div>
        <h2 class="text-3xl font-900 mb-2 tracking-tighter">Order Processing!</h2>
        <p class="font-bold opacity-80">Opening WhatsApp to confirm your box...</p>
    </div>

    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/40 z-40 hidden backdrop-blur-sm"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];
        let allMenuItems = [];
        let userData = { phone: '', location: '' };

        window.saveUser = () => {
            const ph = document.getElementById('phone-input').value;
            if(ph.length < 10) return alert("Enter 10-digit number");
            userData.phone = ph;
            document.getElementById('login-modal').classList.add('hidden');
            showLocationPicker();
        };

        window.showLocationPicker = () => document.getElementById('loc-modal').classList.remove('hidden');

        window.setLoc = (loc) => {
            userData.location = loc;
            document.getElementById('current-loc').innerText = loc;
            document.getElementById('loc-modal').classList.add('hidden');
        };

        onSnapshot(collection(db, "menu"), (snap) => {
            allMenuItems = [];
            snap.forEach(d => allMenuItems.push({id: d.id, ...d.data()}));
            renderMenu('all');
        });

        window.renderMenu = (filter) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            const items = filter === 'all' ? allMenuItems : allMenuItems.filter(i => i.type === filter);
            
            items.forEach(item => {
                const isStock = item.inStock !== false;
                const bestTag = item.isBestseller ? `<div class="absolute top-4 right-4 bg-yellow-400 text-[9px] font-black px-3 py-1.5 rounded-full shadow-lg z-10 animate-bounce text-black">🔥 BESTSELLER</div>` : '';
                
                list.innerHTML += `
                <div class="momo-card p-4 ${isStock ? '' : 'opacity-60 grayscale'}">
                    ${bestTag}
                    <div class="relative overflow-hidden rounded-[2rem] mb-4">
                        <img src="${item.image}" class="w-full h-52 object-cover">
                    </div>
                    <div class="flex justify-between items-center mb-1 px-1">
                        <h4 class="font-900 text-lg">${item.name}</h4>
                        <span class="font-900 text-orange-500 font-bold">₹${item.price}</span>
                    </div>
                    <div class="flex items-center gap-2 mb-4 px-1 text-[10px] font-black uppercase text-gray-400">
                        <span class="w-2 h-2 rounded-full ${item.type === 'veg' ? 'bg-green-500' : 'bg-red-500'}"></span>
                        ${item.type}
                    </div>
                    <button onclick="${isStock ? `addToCart('${item.name}', ${item.price}, '${item.image}')` : ''}" 
                        class="w-full ${isStock ? 'bg-gray-900 text-white' : 'bg-gray-200 text-gray-500 cursor-not-allowed'} py-4 rounded-2xl font-black active:scale-95 transition-all">
                        ${isStock ? 'ADD TO BOX +' : 'SOLD OUT ❌'}
                    </button>
                </div>`;
            });
        };

        window.filterMenu = (type) => {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.replace('bg-gray-900', 'bg-white');
                b.classList.replace('text-white', 'text-gray-400');
                b.classList.remove('shadow-lg');
            });
            const active = document.getElementById('btn-' + type);
            active.classList.replace('bg-white', 'bg-gray-900');
            active.classList.replace('text-gray-400', 'text-white');
            active.classList.add('shadow-lg');
            renderMenu(type);
        };

        window.addToCart = (name, price, image) => {
            const item = cart.find(i => i.name === name);
            if(item) item.qty++; else cart.push({name, price, image, qty: 1});
            updateCartUI();
            if(cart.length === 1) toggleCart(true);
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            document.getElementById('cart-badge').innerText = cart.reduce((a, b) => a + b.qty, 0);
            list.innerHTML = cart.map((item, i) => {
                total += (item.price * item.qty);
                return `<div class="flex items-center gap-4 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl">
                    <div class="flex-1 text-sm font-900">${item.name}<br><span class="text-orange-600">₹${item.price} x ${item.qty}</span></div>
                    <div class="flex gap-2">
                        <button onclick="changeQty(${i}, -1)" class="w-7 h-7 bg-white rounded-lg border font-bold">-</button>
                        <button onclick="changeQty(${i}, 1)" class="w-7 h-7 bg-white rounded-lg border font-bold">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = "₹" + total;
        };

        window.changeQty = (i, d) => {
            cart[i].qty += d;
            if(cart[i].qty < 1) cart.splice(i, 1);
            updateCartUI();
        };

        window.toggleCart = (o) => {
            document.getElementById('cart-sidebar').classList.toggle('cart-closed', !o);
            document.getElementById('cart-overlay').classList.toggle('hidden', !o);
        };

        window.finalCheckout = async () => {
            const addr = document.getElementById('exact-address').value;
            const spicy = document.getElementById('extra-spicy').checked ? "YES ✅" : "NO";
            const mayo = document.getElementById('extra-mayo').checked ? "YES ✅" : "NO";

            if(cart.length === 0 || !addr) return alert("Fill address & cart!");

            // 1. Save order to Admin Dashboard
            try {
                await addDoc(collection(db, "orders"), {
                    customer: userData.phone,
                    location: userData.location,
                    address: addr,
                    total: document.getElementById('cart-total').innerText,
                    items: cart,
                    time: serverTimestamp()
                });
            } catch(e) { console.error("History failed but continuing..."); }

            // 2. Open WhatsApp
            let msg = `*🍱 NEW ORDER - FRESHFRY BARIPADA*%0A--------------------------%0A*Phone:* ${userData.phone}%0A*Area:* ${userData.location}%0A*Address:* ${addr}%0A--------------------------%0A*🌶️ Spicy:* ${spicy}%0A*🤍 Mayo:* ${mayo}%0A--------------------------%0A`;
            cart.forEach(i => msg += `• ${i.name} (x${i.qty})%0A`);
            msg += `--------------------------%0A*TOTAL: ${document.getElementById('cart-total').innerText}*`;

            document.getElementById('order-success').classList.remove('hidden');
            setTimeout(() => {
                window.open(`https://wa.me/917008186187?text=${msg}`);
                location.reload(); 
            }, 2000);
        };
    </script>
</body>
</html>
