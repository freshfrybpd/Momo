<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Baripada's Premium Momos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary: #FF5C00; --dark: #0A0F1D; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F0F4F8; color: var(--dark); overflow-x: hidden; }
        
        /* Smooth Entrance Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        
        .momo-card { 
            border-radius: 2rem; 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .momo-card:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.15); }
        
        .btn-pay { 
            background: linear-gradient(135deg, #0A0F1D 0%, #1E293B 100%);
            box-shadow: 0 15px 30px -10px rgba(10, 15, 29, 0.3);
        }
        
        .cart-sidebar { transition: transform 0.8s cubic-bezier(0.8, 0, 0.1, 1); }
        .cart-closed { transform: translateX(110%); }
        
        .filter-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .filter-active { background: var(--primary) !important; color: white !important; box-shadow: 0 10px 20px -5px rgba(255, 92, 0, 0.4); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gradient-orange { background: linear-gradient(135deg, #FF8A00 0%, #FF5C00 100%); }

        @keyframes pulse-custom { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        .animate-wa { animation: pulse-custom 2s infinite; }
    </style>
</head>
<body class="pb-24">

    <div id="login-modal" class="fixed inset-0 z-[200] bg-white flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center animate-fade">
            <div class="mb-10 inline-block p-6 bg-orange-50 rounded-[3rem]">
                <h1 class="text-5xl font-800 tracking-tighter italic">F<span class="text-orange-500">f.</span></h1>
            </div>
            <h2 class="text-2xl font-800 mb-2">Welcome to Freshfry</h2>
            <p class="text-slate-400 text-sm font-semibold mb-10">Baripada's Finest Momos</p>
            <div class="space-y-4">
                <input id="phone-input" type="tel" maxlength="10" placeholder="WhatsApp Number" 
                    class="w-full px-8 py-6 bg-slate-100 border-none rounded-[2rem] focus:ring-2 focus:ring-orange-500 outline-none font-bold text-center text-lg transition-all">
                <button onclick="saveUser()" class="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-800 shadow-2xl active:scale-95 transition-all">Start Exploring</button>
            </div>
        </div>
    </div>

    <div id="loc-modal" class="fixed inset-0 z-[150] bg-slate-900/20 backdrop-blur-xl hidden flex items-end">
        <div class="bg-white w-full rounded-t-[4rem] p-10 shadow-2xl">
            <div class="w-16 h-1.5 bg-slate-100 rounded-full mx-auto mb-10"></div>
            <h3 class="text-3xl font-800 mb-10 text-center italic">Select <span class="text-orange-500">Zone</span></h3>
            <div class="grid grid-cols-2 gap-6 mb-8">
                <button onclick="setLoc('Murgabadi')" class="p-8 border border-slate-100 rounded-[2.5rem] font-800 hover:bg-orange-500 hover:text-white transition-all text-xs uppercase tracking-widest">Murgabadi</button>
                <button onclick="setLoc('Station Bazar')" class="p-8 border border-slate-100 rounded-[2.5rem] font-800 hover:bg-orange-500 hover:text-white transition-all text-xs uppercase tracking-widest">Station Bazar</button>
                <button onclick="setLoc('Lal Bazar')" class="p-8 border border-slate-100 rounded-[2.5rem] font-800 hover:bg-orange-500 hover:text-white transition-all text-xs uppercase tracking-widest">Lal Bazar</button>
                <button onclick="setLoc('Ambika Mandir')" class="p-8 border border-slate-100 rounded-[2.5rem] font-800 hover:bg-orange-500 hover:text-white transition-all text-xs uppercase tracking-widest">Ambika Mandir</button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-[100] px-8 py-6 glass-nav flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-800 tracking-tighter italic">Fresh<span class="text-orange-500">fry.</span></h1>
            <button onclick="showLocationPicker()" class="flex items-center gap-2 mt-1">
                <div class="w-2 h-2 bg-orange-500 rounded-full"></div>
                <span id="current-loc" class="text-[10px] font-800 uppercase text-slate-400 tracking-tighter">Choose Location</span>
            </button>
        </div>
        <button onclick="toggleCart(true)" class="relative h-14 w-14 bg-white rounded-full flex items-center justify-center text-slate-900 shadow-xl border border-slate-50 active:scale-90 transition-all">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 gradient-orange text-[10px] font-800 h-6 w-6 rounded-full flex items-center justify-center text-white border-4 border-white">0</span>
        </button>
    </nav>

    <main class="max-w-6xl mx-auto px-8 mt-12">
        <div class="mb-12">
            <p class="text-orange-500 font-800 uppercase tracking-[0.3em] text-[10px] mb-2">Premium Quality</p>
            <h2 class="text-5xl font-800 tracking-tight italic leading-tight">Taste the<br>Original <span class="text-orange-500">Craft.</span></h2>
        </div>

        <div class="flex gap-4 mb-12 overflow-x-auto no-scrollbar">
            <button onclick="filterMenu('all')" id="f-all" class="filter-btn filter-active px-10 py-4 rounded-full font-800 text-[11px] uppercase tracking-widest bg-white border border-slate-100">All</button>
            <button onclick="filterMenu('veg')" id="f-veg" class="filter-btn px-10 py-4 rounded-full font-800 text-[11px] uppercase tracking-widest bg-white border border-slate-100 text-slate-400">Veg</button>
            <button onclick="filterMenu('non-veg')" id="f-non-veg" class="filter-btn px-10 py-4 rounded-full font-800 text-[11px] uppercase tracking-widest bg-white border border-slate-100 text-slate-400">Non-Veg</button>
        </div>

        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 animate-fade"></div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[480px] bg-white z-[160] cart-sidebar cart-closed flex flex-col shadow-[-40px_0_80px_rgba(0,0,0,0.1)]">
        <div class="p-10 border-b flex justify-between items-center">
            <h2 class="text-3xl font-800 italic">My <span class="text-orange-500">Cart</span></h2>
            <button onclick="toggleCart(false)" class="h-14 w-14 bg-slate-50 rounded-full text-slate-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-10 space-y-8 no-scrollbar"></div>

        <div class="p-10 bg-white border-t space-y-8">
            <div class="space-y-2">
                <label class="text-[10px] font-800 uppercase tracking-widest text-slate-400 ml-2">Delivery Address</label>
                <input type="text" id="exact-address" placeholder="e.g. House No. 42, Near Park" 
                    class="w-full px-8 py-6 bg-slate-50 rounded-[2rem] font-bold text-sm outline-none focus:ring-2 focus:ring-orange-500 transition-all">
            </div>
            
            <div class="flex justify-between items-center px-2">
                <span class="text-xs font-800 uppercase text-slate-400">Subtotal</span>
                <span id="cart-total" class="text-3xl font-800">₹0</span>
            </div>

            <button onclick="finalCheckout()" class="w-full btn-pay text-white py-7 rounded-[2.5rem] font-800 shadow-2xl active:scale-95 transition-all uppercase tracking-[0.3em] text-xs">
                Pay & Place Order 🚀
            </button>
        </div>
    </div>

    <a href="https://wa.me/917008186187" class="fixed bottom-8 right-8 z-[140] flex items-center justify-center w-16 h-16 bg-[#25D366] text-white rounded-full shadow-2xl animate-wa">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
    </a>

    <div id="order-success" class="fixed inset-0 z-[300] bg-white hidden flex flex-col items-center justify-center p-10">
        <div class="w-16 h-16 border-4 border-slate-100 border-t-orange-500 rounded-full animate-spin mb-6"></div>
        <h2 class="text-xl font-800 italic tracking-tight">Initiating <span class="text-orange-500">Secure Payment</span></h2>
    </div>

    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-slate-900/40 z-[155] hidden backdrop-blur-md"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];
        let allMenuItems = [];
        let userData = { 
            phone: localStorage.getItem('customerPhone') || '', 
            location: localStorage.getItem('customerLoc') || '' 
        };

        window.onload = () => {
            if(userData.phone) {
                document.getElementById('login-modal').style.display = 'none';
                if(userData.location) {
                    document.getElementById('current-loc').innerText = userData.location;
                } else { showLocationPicker(); }
            }
        };

        window.saveUser = () => {
            const ph = document.getElementById('phone-input').value.trim();
            if(ph.length < 10) return alert("Enter valid 10-digit number");
            userData.phone = ph;
            localStorage.setItem('customerPhone', ph);
            document.getElementById('login-modal').classList.add('animate-fade-out');
            setTimeout(() => {
                document.getElementById('login-modal').style.display = 'none';
                showLocationPicker();
            }, 500);
        };

        window.showLocationPicker = () => document.getElementById('loc-modal').classList.remove('hidden');

        window.setLoc = (loc) => {
            userData.location = loc;
            localStorage.setItem('customerLoc', loc);
            document.getElementById('current-loc').innerText = loc;
            document.getElementById('loc-modal').classList.add('hidden');
        };

        onSnapshot(collection(db, "menu"), (snap) => {
            allMenuItems = [];
            snap.forEach(d => allMenuItems.push({id: d.id, ...d.data()}));
            renderMenu('all');
        });

        window.renderMenu = (filter) => {
            const list = document.getElementById('menu-list');
            list.innerHTML = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('filter-active'));
            const activeBtn = document.getElementById('f-' + filter);
            if(activeBtn) activeBtn.classList.add('filter-active');

            const items = filter === 'all' ? allMenuItems : allMenuItems.filter(i => i.type === filter);
            
            items.forEach(item => {
                const isStock = item.inStock !== false;
                list.innerHTML += `
                <div class="momo-card overflow-hidden ${!isStock ? 'opacity-50 grayscale' : ''}">
                    <div class="h-72 overflow-hidden relative">
                        <img src="${item.image}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                        ${item.isBestseller ? '<div class="absolute top-6 left-6 gradient-orange px-5 py-2 rounded-full text-[9px] font-800 tracking-widest text-white uppercase">Top Pick</div>' : ''}
                    </div>
                    <div class="p-8">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h4 class="font-800 text-xl italic">${item.name}</h4>
                                <p class="text-[10px] font-bold text-slate-300 uppercase tracking-widest mt-1">${item.type}</p>
                            </div>
                            <span class="text-2xl font-800 text-slate-900">₹${item.price}</span>
                        </div>
                        <button onclick="${isStock ? `addToCart('${item.name}', ${item.price}, '${item.image}')` : ''}" 
                            class="w-full ${isStock ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-400'} py-5 rounded-[1.8rem] font-800 text-[10px] uppercase tracking-[0.2em] transition-all active:scale-95 shadow-lg">
                            ${isStock ? 'Add to Box' : 'Out of Stock'}
                        </button>
                    </div>
                </div>`;
            });
        };

        window.addToCart = (name, price, image) => {
            const item = cart.find(i => i.name === name);
            if(item) item.qty++; else cart.push({name, price, image, qty: 1});
            updateCartUI();
        };

        window.updateCartUI = () => {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            document.getElementById('cart-badge').innerText = cart.reduce((a, b) => a + b.qty, 0);
            
            if(cart.length === 0) {
                list.innerHTML = `<div class="text-center py-20 opacity-10"><i class="fa-solid fa-bag-shopping text-7xl mb-4"></i><p class="font-800 uppercase tracking-widest text-xs">Box Empty</p></div>`;
                document.getElementById('cart-total').innerText = "₹0";
                return;
            }

            list.innerHTML = cart.map(item => {
                total += (item.price * item.qty);
                return `<div class="flex items-center gap-6 bg-slate-50 p-6 rounded-[2.2rem] border border-slate-100">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-[1.2rem]">
                    <div class="flex-1">
                        <p class="text-[11px] font-800 italic uppercase">${item.name}</p>
                        <p class="text-[11px] font-bold text-slate-400 mt-1">₹${item.price} × ${item.qty}</p>
                    </div>
                    <div class="font-800 text-lg">₹${item.price * item.qty}</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = "₹" + total;
        };

        window.toggleCart = (o) => {
            document.getElementById('cart-sidebar').classList.toggle('cart-closed', !o);
            document.getElementById('cart-overlay').classList.toggle('hidden', !o);
        };

        window.finalCheckout = async () => {
            const addr = document.getElementById('exact-address').value.trim();
            const totalVal = document.getElementById('cart-total').innerText.replace('₹', '');
            if(cart.length === 0 || !addr) return alert("Fill details first!");

            const upiId = "7008186187@ybl";
            const upiUrl = `upi://pay?pa=${upiId}&pn=Freshfry&am=${totalVal}&cu=INR&tn=MomoOrder`;

            try {
                const docRef = await addDoc(collection(db, "orders"), {
                    customer: userData.phone,
                    location: userData.location,
                    address: addr,
                    total: "₹" + totalVal,
                    items: cart,
                    status: 'pending',
                    riderName: '',
                    time: serverTimestamp()
                });

                localStorage.setItem('currentOrderId', docRef.id);
                document.getElementById('order-success').classList.remove('hidden');

                window.location.href = upiUrl;
                
                setTimeout(() => {
                    let waMsg = `*🍱 FRESHFRY NEW ORDER*%0A------------------%0A*Phone:* ${userData.phone}%0A*Address:* ${addr}%0A*Total:* ₹${totalVal}%0A------------------%0A`;
                    cart.forEach(i => waMsg += `• ${i.name} (x${i.qty})%0A`);
                    window.location.href = `https://wa.me/917008186187?text=${waMsg}`;
                }, 4000);
            } catch(e) { alert("Error!"); }
        };
        
        window.filterMenu = (t) => renderMenu(t);
    </script>
</body>
</html>
