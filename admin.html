<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Master Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar-link:hover { background-color: #fff7ed; border-right: 4px solid #f97316; color: #f97316; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex">

    <aside class="w-64 h-screen bg-white border-r border-gray-200 sticky top-0 hidden lg:block shadow-sm">
        <div class="p-6">
            <div class="text-2xl font-black text-orange-500 mb-10 tracking-tighter">Freshfry<span class="text-gray-900">.</span></div>
            <nav class="space-y-2">
                <a href="#" class="sidebar-link flex items-center p-3 text-orange-600 font-bold bg-orange-50 rounded-xl transition-all">
                    <i class="fa-solid fa-chart-pie mr-3"></i> Dashboard
                </a>
                <a href="#" class="sidebar-link flex items-center p-3 text-gray-400 font-semibold transition-all">
                    <i class="fa-solid fa-utensils mr-3"></i> Manage Menu
                </a>
                <a href="#" class="sidebar-link flex items-center p-3 text-gray-400 font-semibold transition-all">
                    <i class="fa-solid fa-truck-fast mr-3"></i> Live Orders
                </a>
                <a href="#" class="sidebar-link flex items-center p-3 text-gray-400 font-semibold transition-all">
                    <i class="fa-solid fa-motorcycle mr-3"></i> Rider Fleet
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-8 h-screen overflow-y-auto custom-scrollbar">
        
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-900">Master Console</h1>
                <p class="text-gray-500 text-sm font-medium">Monitoring business in real-time.</p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="bg-white px-4 py-2 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-xs font-bold text-gray-600">Store Online</span>
                </div>
                <img src="https://ui-avatars.com/api/?name=Admin&background=f97316&color=fff" class="w-10 h-10 rounded-2xl shadow-lg">
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-800 mb-4">Revenue Analytics</h3>
                <div class="h-48">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            <div class="bg-orange-500 p-8 rounded-[2rem] shadow-xl shadow-orange-200 text-white relative overflow-hidden">
                <i class="fa-solid fa-bag-shopping absolute -right-4 -bottom-4 text-white/10 text-9xl"></i>
                <p class="text-orange-100 text-sm font-bold uppercase tracking-wider">Total Sales Today</p>
                <h3 class="text-4xl font-black mt-2">₹45,280</h3>
                <div class="mt-8 flex items-center text-xs font-bold bg-white/20 backdrop-blur-md w-fit px-4 py-2 rounded-xl">
                    <i class="fa-solid fa-arrow-up mr-2"></i> 12% Better than yesterday
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-800 mb-6">Register New Rider</h3>
                <div class="space-y-4">
                    <input type="text" id="riderName" placeholder="Rider Full Name" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-orange-500 outline-none text-sm font-bold">
                    <input type="tel" id="riderPhone" placeholder="Phone Number" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-orange-500 outline-none text-sm font-bold">
                    <button onclick="addNewRider()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black tracking-widest text-xs hover:bg-orange-500 transition-all shadow-lg active:scale-95">
                        ADD TO FLEET
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white rounded-[2.5rem] border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-gray-50 flex justify-between items-center bg-white">
                    <h2 class="font-bold text-gray-800">Riders Management</h2>
                    <span id="riderCountBadge" class="bg-orange-100 text-orange-600 px-4 py-1.5 rounded-xl text-[10px] font-black uppercase">0 Total</span>
                </div>
                <div class="max-h-64 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-widest">
                            <tr>
                                <th class="px-6 py-4">Rider Info</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="riderTableBody" class="divide-y divide-gray-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- Revenue Chart ---
        const ctx = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['6AM', '9AM', '12PM', '3PM', '6PM', '9PM'],
                datasets: [{
                    label: 'Sales',
                    data: [2000, 8000, 15000, 12000, 28000, 45280],
                    borderColor: '#f97316',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(249, 115, 22, 0.05)',
                    borderWidth: 4,
                    pointRadius: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });

        // --- Rider Management Logic ---
        let riders = JSON.parse(localStorage.getItem('freshfry_riders')) || [
            { id: 101, name: "Mahesh Singh", phone: "9876543210" },
            { id: 102, name: "Sunil Kumar", phone: "9900887766" }
        ];

        function renderRiders() {
            const container = document.getElementById('riderTableBody');
            const badge = document.getElementById('riderCountBadge');
            container.innerHTML = '';
            
            riders.forEach(rider => {
                container.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-800">${rider.name}</div>
                            <div class="text-[11px] text-gray-400 font-bold tracking-tight">${rider.phone}</div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="removeRider(${rider.id})" class="text-red-100 hover:text-red-500 bg-red-500/5 hover:bg-red-500/10 p-2.5 rounded-xl transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            badge.innerText = `${riders.length} Riders`;
            localStorage.setItem('freshfry_riders', JSON.stringify(riders));
        }

        function addNewRider() {
            const name = document.getElementById('riderName').value;
            const phone = document.getElementById('riderPhone').value;

            if(!name || !phone) return alert("Details bhariye, Boss!");

            riders.unshift({ id: Date.now(), name, phone });
            renderRiders();
            
            document.getElementById('riderName').value = '';
            document.getElementById('riderPhone').value = '';
        }

        function removeRider(id) {
            riders = riders.filter(r => r.id !== id);
            renderRiders();
        }

        // Initialize
        renderRiders();
    </script>
</body>
</html>
