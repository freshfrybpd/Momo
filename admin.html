<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="robots" content="noindex,nofollow">
<title>FreshFry | Admin Dashboard</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --orange:#ff5e00;
  --dark:#171717;
  --muted:#777b85;
  --bg:#f6f6f7;
  --line:#eaeaea;
  --green:#15803d;
  --red:#dc2626;
}
* { box-sizing:border-box }
body {
  margin:0;
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--dark);
}
button,input { font:inherit }
button { cursor:pointer }
button:disabled { opacity:.55;cursor:not-allowed }
[hidden] { display:none!important }
.wrap { width:min(1100px,calc(100% - 28px));margin:auto }

header {
  background:#171717;color:white;
  position:sticky;top:0;z-index:10;
  box-shadow:0 4px 20px #00000012;
}
.header-inner {
  min-height:66px;display:flex;
  align-items:center;gap:12px;
}
.brand {
  font-size:23px;font-weight:900;
  font-style:italic;letter-spacing:-1px;
}
.brand span { color:var(--orange) }
.header-label {
  margin-left:auto;font-size:10px;
  font-weight:900;letter-spacing:1.5px;color:#ccc;
}
.header-label i { color:var(--orange);margin-right:5px }

main { padding:25px 0 45px }
.login-screen {
  width:min(410px,100%);
  margin:35px auto;
  background:white;border:1px solid var(--line);
  border-radius:22px;padding:27px;
  box-shadow:0 15px 45px #00000008;
}
.login-logo {
  height:65px;width:65px;border-radius:20px;
  display:grid;place-items:center;
  background:#fff0e6;color:var(--orange);
  font-size:27px;margin-bottom:20px;
}
.login-screen h1 { font-size:25px;margin:0 0 8px }
.login-screen p {
  font-size:12px;line-height:1.7;
  color:var(--muted);margin:0 0 22px;
}
.label {
  display:block;font-size:11px;
  font-weight:900;margin-bottom:8px;
}
.pin-input {
  width:100%;padding:15px;
  border:1px solid #dedede;border-radius:12px;
  font-size:22px;letter-spacing:8px;
  text-align:center;outline:none;
}
.pin-input:focus { border-color:var(--orange) }
.btn {
  border:0;border-radius:11px;padding:13px 16px;
  font-size:11px;font-weight:900;
  display:inline-flex;justify-content:center;
  align-items:center;gap:8px;
}
.btn-primary { background:var(--orange);color:white }
.btn-dark { background:#171717;color:white }
.btn-light { background:white;border:1px solid var(--line);color:#222 }
.btn-danger { background:#fff1f1;color:#b91c1c }
.btn-block { width:100%;margin-top:14px }
.error-text { color:#b91c1c;font-size:11px;margin-top:12px;line-height:1.6 }

.topbar {
  display:flex;align-items:center;
  justify-content:space-between;gap:15px;
  flex-wrap:wrap;margin-bottom:22px;
}
.topbar h1 { font-size:27px;letter-spacing:-.7px;margin:0 }
.topbar p { font-size:11px;color:var(--muted);margin:5px 0 0 }
.actions { display:flex;gap:8px;flex-wrap:wrap }

.stats {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;margin-bottom:22px;
}
.stat {
  background:white;border:1px solid var(--line);
  border-radius:16px;padding:17px;
}
.stat-icon {
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:#fff0e6;color:var(--orange);
  margin-bottom:13px;
}
.stat-label { font-size:10px;color:var(--muted);font-weight:700 }
.stat-value { font-size:25px;font-weight:900;margin-top:5px }

.panel {
  background:white;border:1px solid var(--line);
  border-radius:17px;overflow:hidden;
}
.panel-head {
  padding:17px;
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.panel-head h2 { font-size:15px;margin:0;font-weight:900 }
.filters { display:flex;gap:8px;flex-wrap:wrap }
.search {
  padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;min-width:180px;
  font-size:11px;outline:none;
}
.filter {
  padding:10px;border:1px solid var(--line);
  background:white;border-radius:10px;
  font-size:11px;max-width:190px;
}
.order-list { padding:14px }
.order {
  border:1px solid var(--line);
  border-radius:14px;padding:16px;
  margin-bottom:12px;background:white;
}
.order:last-child { margin-bottom:0 }
.order-head {
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;
}
.order-id { font-size:12px;font-weight:900;overflow-wrap:anywhere }
.order-date { font-size:10px;color:var(--muted);margin-top:5px }
.badge {
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 9px;border-radius:30px;
  background:#fff7ed;color:#9a3412;
  font-size:9px;font-weight:900;white-space:nowrap;
}
.badge.preparing { background:#eff6ff;color:#1d4ed8 }
.badge.out_for_delivery { background:#f3e8ff;color:#7e22ce }
.badge.delivered { background:#effcf4;color:#166534 }
.badge.cancelled,.badge.rejected { background:#fef2f2;color:#b91c1c }
.badge.payment_pending { background:#fff7ed;color:#9a3412 }

.order-grid {
  display:grid;grid-template-columns:1fr 1fr;
  gap:15px;margin-top:17px;
}
.detail-label {
  font-size:9px;color:var(--muted);
  font-weight:900;letter-spacing:.7px;
  text-transform:uppercase;margin-bottom:6px;
}
.detail-value {
  font-size:12px;font-weight:700;
  line-height:1.7;overflow-wrap:anywhere;
}
.detail-value a { color:var(--orange) }
.items {
  display:grid;gap:8px;
  margin-top:8px;
}
.item {
  display:flex;justify-content:space-between;
  gap:10px;font-size:11px;
}
.item span:first-child { overflow-wrap:anywhere }
.item strong { white-space:nowrap }
.order-total {
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;
  padding-top:12px;margin-top:12px;
  border-top:1px dashed #ddd;
}
.total-amount { color:var(--orange);font-size:21px;font-weight:900 }
.mini { color:var(--muted);font-size:10px;line-height:1.7 }
.order-controls {
  display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;margin-top:15px;padding-top:14px;
  border-top:1px solid var(--line);
}
.order-controls label { font-size:10px;font-weight:900 }
.status-select {
  flex:1;min-width:160px;max-width:240px;
  padding:11px;border:1px solid var(--line);
  border-radius:10px;background:white;font-size:11px;
}
.empty {
  text-align:center;padding:35px 15px;
  color:var(--muted);font-size:12px;line-height:1.8;
}
.empty i { font-size:30px;color:var(--orange);margin-bottom:10px }
.message {
  padding:12px;border-radius:10px;
  margin-bottom:15px;font-size:11px;line-height:1.7;
}
.message.error { background:#fef2f2;color:#991b1b }
.message.success { background:#effcf4;color:#166534 }
.message.info { background:#eff6ff;color:#1d4ed8 }
.footer { text-align:center;padding:20px;color:var(--muted);font-size:10px }

@media(max-width:700px) {
  .stats { grid-template-columns:repeat(2,minmax(0,1fr));gap:9px }
  .stat { padding:13px }
  .stat-value { font-size:23px }
  .topbar h1 { font-size:23px }
  .order-grid { grid-template-columns:1fr }
  .search { min-width:0;width:100% }
  .filters { width:100% }
  .filter { flex:1;max-width:none }
  .panel-head { align-items:flex-start }
}
</style>
</head>

<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="index.html">Fresh<span>Fry.</span></a>
    <div class="header-label"><i class="fa-solid fa-shield-halved"></i> ADMIN</div>
  </div>
</header>

<main class="wrap">

  <!-- PIN LOGIN -->
  <section id="login-screen" class="login-screen">
    <div class="login-logo"><i class="fa-solid fa-lock"></i></div>
    <h1>Admin Login</h1>
    <p>Enter your admin PIN to open the FreshFry order dashboard.</p>

    <form id="login-form">
      <label class="label" for="admin-pin">ADMIN PIN</label>
      <input
        class="pin-input"
        id="admin-pin"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
        required
      >
      <button class="btn btn-primary btn-block" type="submit">
        LOGIN TO DASHBOARD <i class="fa-solid fa-arrow-right"></i>
      </button>
      <div id="login-error" class="error-text" role="alert"></div>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" hidden>
    <div class="topbar">
      <div>
        <h1>Orders Dashboard</h1>
        <p>Manage FreshFry Momo customer orders.</p>
      </div>
      <div class="actions">
        <button class="btn btn-light" id="refresh-btn">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
        <button class="btn btn-dark" id="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <div id="message" hidden></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-icon"><i class="fa-solid fa-receipt"></i></div>
        <div class="stat-label">TOTAL ORDERS LOADED</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
        <div class="stat-label">PENDING</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat">
        <div class="stat-icon"><i class="fa-solid fa-motorcycle"></i></div>
        <div class="stat-label">OUT FOR DELIVERY</div>
        <div class="stat-value" id="stat-delivery">0</div>
      </div>
      <div class="stat">
        <div class="stat-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
        <div class="stat-label">LOADED ORDER VALUE</div>
        <div class="stat-value" id="stat-revenue">₹0</div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2><i class="fa-solid fa-list-check" style="color:#ff5e00"></i> All Orders</h2>
        <div class="filters">
          <input class="search" id="search-input" placeholder="Search ID, name or phone..." aria-label="Search orders">
          <select class="filter" id="status-filter" aria-label="Filter by order status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="payment_pending">Payment pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready for pickup</option>
            <option value="out_for_delivery">Out for delivery</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div id="order-list" class="order-list">
        <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading orders...</div>
      </div>
    </section>
  </section>
</main>

<div class="footer">FreshFry Momo · Baripada, Odisha</div>

<script type="module">
import { initializeApp, getApps, getApp }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore, collection, getDocs, updateDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/*
  IMPORTANT:
  This PIN is a client-side gate, not secure authentication.
  Protect Firestore using Firebase Authentication and admin-only rules.
*/

const ADMIN_PIN = "7788";

const firebaseConfig = {
  apiKey: "AIzaSyDCbZ8RaDfMc--BzT2S_LllBA4G2d0dfUM",
  authDomain: "freshfry-39a10.firebaseapp.com",
  projectId: "freshfry-39a10",
  storageBucket: "freshfry-39a10.firebasestorage.app",
  messagingSenderId: "928483976893",
  appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let orders = [];
let busy = false;
let isLoggedIn = false;

const VALID_STATUSES = [
  "pending",
  "payment_pending",
  "confirmed",
  "preparing",
  "ready",
  "out_for_delivery",
  "delivered",
  "cancelled"
];

function money(value) {
  return "₹" + Number(value || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function normalizeStatus(value) {
  return String(value || "pending")
    .toLowerCase()
    .trim()
    .replace(/[\s-]+/g, "_");
}

function formatDate(timestamp) {
  try {
    if (!timestamp) return "Date unavailable";

    const date = typeof timestamp.toDate === "function"
      ? timestamp.toDate()
      : new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "Date unavailable";

    return date.toLocaleString("en-IN", {
      day:"numeric",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  } catch {
    return "Date unavailable";
  }
}

function showMessage(text, type = "info") {
  const el = $("message");
  el.textContent = text;
  el.className = "message " + type;
  el.hidden = false;
}

function hideMessage() {
  $("message").hidden = true;
  $("message").textContent = "";
}

function safePhone(value) {
  return String(value || "").replace(/[^\d+ ]/g, "");
}

function login(event) {
  event.preventDefault();

  const pin = $("admin-pin").value;
  if (pin !== ADMIN_PIN) {
    $("login-error").textContent = "Incorrect PIN. Please try again.";
    $("admin-pin").value = "";
    $("admin-pin").focus();
    return;
  }

  $("login-error").textContent = "";
  $("admin-pin").value = "";
  isLoggedIn = true;

  $("login-screen").hidden = true;
  $("dashboard").hidden = false;

  loadOrders();
}

function logout() {
  isLoggedIn = false;
  orders = [];
  $("dashboard").hidden = true;
  $("login-screen").hidden = false;
  $("order-list").innerHTML = "";
  hideMessage();
  $("admin-pin").value = "";
  $("admin-pin").focus();
}

async function loadOrders() {
  if (!isLoggedIn || busy) return;

  busy = true;
  $("refresh-btn").disabled = true;
  $("order-list").innerHTML =
    '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading orders...</div>';

  hideMessage();

  try {
    const snapshot = await getDocs(collection(db, "orders"));

    orders = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));

    orders.sort((a, b) => {
      const dateA = a.createdAt?.toMillis?.() || 0;
      const dateB = b.createdAt?.toMillis?.() || 0;
      return dateB - dateA;
    });

    renderStats();
    renderOrders();
  } catch (error) {
    console.error("Failed to load orders:", error);

    orders = [];
    renderStats();

    $("order-list").innerHTML =
      '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>Could not load orders.<br>Check your internet connection and Firestore permissions.</div>';

    showMessage(
      "Orders could not be loaded. Firebase read permissions may be blocking this request.",
      "error"
    );
  } finally {
    busy = false;
    $("refresh-btn").disabled = false;
  }
}

function renderStats() {
  $("stat-total").textContent = orders.length;

  $("stat-pending").textContent = orders.filter(order =>
    ["pending", "payment_pending"].includes(normalizeStatus(order.status))
  ).length;

  $("stat-delivery").textContent = orders.filter(order =>
    normalizeStatus(order.status) === "out_for_delivery"
  ).length;

  const total = orders.reduce((sum, order) =>
    sum + (Number(order.total) || 0), 0
  );

  $("stat-revenue").textContent = money(total);
}

function getFilteredOrders() {
  const term = $("search-input").value.trim().toLowerCase();
  const status = $("status-filter").value;

  return orders.filter(order => {
    const orderStatus = normalizeStatus(order.status);

    const matchesStatus = status === "all" ||
      orderStatus === status ||
      (status === "confirmed" && orderStatus === "accepted");

    const searchable = [
      order.id,
      order.customerName,
      order.customerPhone,
      order.deliveryAddress,
      order.paymentMethod
    ].join(" ").toLowerCase();

    return matchesStatus && searchable.includes(term);
  });
}

function renderOrders() {
  const list = $("order-list");
  const filtered = getFilteredOrders();

  if (!filtered.length) {
    list.innerHTML =
      '<div class="empty"><i class="fa-solid fa-box-open"></i><br>No matching orders found.</div>';
    return;
  }

  list.innerHTML = filtered.map(order => {
    const status = normalizeStatus(order.status);
    const badgeClass = VALID_STATUSES.includes(status) ? status : "pending";
    const statusLabel = status.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());

    const items = Array.isArray(order.items) ? order.items : [];
    const itemsHTML = items.length
      ? items.map(item => `
          <div class="item">
            <span>${escapeHTML(item.name || "Food item")} × ${Number(item.qty) || 1}</span>
            <strong>${money((Number(item.price) || 0) * (Number(item.qty) || 1))}</strong>
          </div>
        `).join("")
      : '<div class="mini">Item details unavailable.</div>';

    const phone = safePhone(order.customerPhone);
    const phoneHTML = phone
      ? `<a href="tel:${escapeHTML(phone)}">${escapeHTML(phone)}</a>`
      : "Not provided";

    const address = escapeHTML(order.deliveryAddress || order.customerLocation || "Not provided");
    const note = order.note
      ? `<div style="margin-top:8px"><span class="detail-label">Customer note</span><div class="mini">${escapeHTML(order.note)}</div></div>`
      : "";

    const mapLink = order.deliveryMapUrl
      ? `<div style="margin-top:7px"><a href="${escapeHTML(order.deliveryMapUrl)}" target="_blank" rel="noopener noreferrer">Open delivery map ↗</a></div>`
      : "";

    const options = VALID_STATUSES.map(value =>
      `<option value="${value}" ${status === value ? "selected" : ""}>${value.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase())}</option>`
    ).join("");

    const paymentStatus = String(order.paymentStatus || "not specified").replace(/_/g, " ");

    return `
      <article class="order" data-order-id="${escapeHTML(order.id)}">
        <div class="order-head">
          <div>
            <div class="order-id">ORDER #${escapeHTML(order.id)}</div>
            <div class="order-date">${escapeHTML(formatDate(order.createdAt))}</div>
          </div>
          <span class="badge ${badgeClass}">
            <i class="fa-solid fa-circle"></i> ${escapeHTML(statusLabel)}
          </span>
        </div>

        <div class="order-grid">
          <div>
            <div class="detail-label">Customer</div>
            <div class="detail-value">${escapeHTML(order.customerName || "Not provided")}</div>
            <div class="detail-value">${phoneHTML}</div>

            <div class="detail-label" style="margin-top:14px">Delivery address</div>
            <div class="detail-value">${address}</div>
            ${mapLink}
            ${note}
          </div>

          <div>
            <div class="detail-label">Order items</div>
            <div class="items">${itemsHTML}</div>

            <div class="order-total">
              <div>
                <div class="detail-label">Payment</div>
                <div class="detail-value">${escapeHTML(order.paymentMethod || "Not specified")}</div>
                <div class="mini">Status: ${escapeHTML(paymentStatus)}</div>
                <div class="mini">Delivery fee: ${money(order.deliveryFee)}</div>
              </div>
              <div style="text-align:right">
                <div class="detail-label">Total</div>
                <div class="total-amount">${money(order.total)}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="order-controls">
          <label for="status-${escapeHTML(order.id)}">UPDATE STATUS</label>
          <select class="status-select" id="status-${escapeHTML(order.id)}" data-status-select>
            ${options}
          </select>
          <button class="btn btn-primary" data-save-status="${escapeHTML(order.id)}">
            <i class="fa-solid fa-check"></i> Save status
          </button>
        </div>
      </article>
    `;
  }).join("");
}

async function updateOrderStatus(orderId, newStatus, button) {
  if (!isLoggedIn) return;

  if (!VALID_STATUSES.includes(newStatus)) {
    showMessage("Invalid order status.", "error");
    return;
  }

  const order = orders.find(item => item.id === orderId);
  if (!order) {
    showMessage("Order not found. Refresh and try again.", "error");
    return;
  }

  const oldText = button.innerHTML;
  button.disabled = true;
  button.textContent = "Saving...";

  try {
    await updateDoc(doc(db, "orders", orderId), {
      status: newStatus,
      updatedAt: serverTimestamp()
    });

    order.status = newStatus;

    renderStats();
    renderOrders();

    showMessage("Order status updated successfully.", "success");
  } catch (error) {
    console.error("Status update failed:", error);

    showMessage(
      "Could not update status. Firestore update permissions may be blocking this action.",
      "error"
    );

    button.disabled = false;
    button.innerHTML = oldText;
  }
}

$("login-form").addEventListener("submit", login);
$("logout-btn").addEventListener("click", logout);
$("refresh-btn").addEventListener("click", loadOrders);

$("search-input").addEventListener("input", renderOrders);
$("status-filter").addEventListener("change", renderOrders);

$("order-list").addEventListener("click", event => {
  const button = event.target.closest("[data-save-status]");
  if (!button) return;

  const orderId = button.dataset.saveStatus;
  const select = button.closest(".order")?.querySelector("[data-status-select]");

  if (!select) return;

  updateOrderStatus(orderId, select.value, button);
});
</script>
</body>
