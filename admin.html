<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Admin | Command Centre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        #main-content { display: none; }
        .order-card { transition: all 0.3s ease; border-radius: 2rem; }
        .order-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-slate-50">

    <div id="admin-login-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-[3rem] p-10 shadow-2xl text-center">
            <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6">
                <i class="fa-solid fa-shield-check"></i>
            </div>
            <h2 class="text-3xl font-900 text-slate-800 mb-2 italic tracking-tighter">Freshfry<span class="text-orange-500">Admin.</span></h2>
            <div class="space-y-4">
                <input type="password" id="adminPassInput" placeholder="Master Password" class="w-full px-6 py-5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-bold text-center">
                <button onclick="checkAdminLogin()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black shadow-xl uppercase tracking-widest text-xs">Unlock Console</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="p-4 lg:p-10 max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-800 text-slate-900 italic tracking-tighter">Command Centre<span class="text-orange-500">.</span></h1>
                <p id="live-indicator" class="text-green-500 font-black text-[10px] uppercase tracking-[0.3em] flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> System Live & Connected
                </p>
            </div>
            <button onclick="logout()" class="bg-white p-4 rounded-2xl shadow-sm border text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <section class="mb-12">
            <div class="flex items-center gap-3 mb-6">
                <h2 class="text-xl font-800 text-slate-800">Active Deliveries</h2>
                <span id="order-count" class="bg-slate-900 text-white text-[10px] px-3 py-1 rounded-full font-black">0</span>
            </div>
            <div id="admin-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <h3 class="font-800 text-slate-800 mb-6 uppercase text-xs tracking-widest text-orange-500">Add New Item</h3>
                    <div class="space-y-4">
                        <input type="text" id="foodName" placeholder="Momo Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                        <input type="number" id="foodPrice" placeholder="Price (₹)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                        <input type="text" id="foodImage" placeholder="Image URL" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm">
                        <button id="submitBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-lg">UPLOAD TO MENU</button>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2">
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                            <tr><th class="px-6 py-5">Dish</th><th class="px-6 py-5">Status</th><th class="px-6 py-5 text-right">Action</th></tr>
                        </thead>
                        <tbody id="menuTableBody" class="text-sm font-bold divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- AUTH ---
        window.checkAdminLogin = () => {
            if(document.getElementById('adminPassInput').value === "admin5") {
                document.getElementById('admin-login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                sessionStorage.setItem('isAdmin', 'true');
            } else alert("Wrong Password!");
        };
        window.logout = () => { sessionStorage.clear(); location.reload(); };

        // --- ORDER MANAGEMENT ---
        onSnapshot(query(collection(db, "orders"), orderBy("time", "desc")), (snap) => {
            const grid = document.getElementById('admin-orders-grid');
            grid.innerHTML = '';
            let count = 0;

            snap.forEach(d => {
                const order = d.data();
                const id = d.id;
                const status = order.status || 'pending';
                if(status === 'delivered') return;

                count++;
                grid.innerHTML += `
                <div class="bg-white p-6 order-card shadow-lg border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${status==='pending'?'bg-orange-100 text-orange-600':'bg-blue-100 text-blue-600'}">${status}</span>
                        <p class="text-[10px] text-slate-300 font-bold">#${id.slice(-5)}</p>
                    </div>
                    <h4 class="font-800 text-slate-900">${order.customer}</h4>
                    <p class="text-[10px] text-slate-400 font-bold mb-4 uppercase tracking-tighter italic">${order.location}</p>
                    
                    <div class="bg-slate-50 p-3 rounded-xl mb-4 text-xs font-bold text-slate-600">
                        ${order.items.map(i => `<div>${i.qty} x ${i.name}</div>`).join('')}
                    </div>

                    ${status === 'out_for_delivery' ? `
                        <div class="mb-4 text-[10px] font-black text-blue-600 bg-blue-50 p-2 rounded-lg flex items-center gap-2 uppercase">
                            <i class="fa-solid fa-motorcycle"></i> Assigned to: ${order.riderName}
                        </div>
                    ` : ''}

                    <div class="flex gap-2">
                        ${status === 'pending' ? `
                            <button onclick="updateStatus('${id}', 'accepted')" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Accept</button>
                            <button onclick="rejectOrder('${id}')" class="flex-1 bg-red-50 text-red-500 py-3 rounded-xl font-black text-[10px] uppercase">Reject</button>
                        ` : status === 'accepted' ? `
                            <button onclick="assignRider('${id}')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest">Assign Rider 🛵</button>
                        ` : `
                            <div class="w-full text-center text-blue-500 font-black text-[10px] uppercase italic py-2">On the Way...</div>
                        `}
                    </div>
                </div>`;
            });
            document.getElementById('order-count').innerText = count;
        });

        // --- FUNCTIONS ---
        window.updateStatus = async (id, s) => { await updateDoc(doc(db, "orders", id), { status: s }); };
        window.rejectOrder = async (id) => { if(confirm("Reject?")) await deleteDoc(doc(db, "orders", id)); };
        
        window.assignRider = async (id) => {
            const rName = prompt("Enter Delivery Boy Name:");
            if(rName) {
                await updateDoc(doc(db, "orders", id), { 
                    status: 'out_for_delivery', 
                    riderName: rName.toUpperCase() 
                });
            }
        };

        // --- MENU LOGIC ---
        onSnapshot(collection(db, "menu"), (snap) => {
            const body = document.getElementById('menuTableBody');
            body.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                body.innerHTML += `
                <tr>
                    <td class="px-6 py-4 flex items-center gap-3">
                        <img src="${item.image}" class="w-8 h-8 rounded-lg object-cover">
                        <div><p class="text-slate-900">${item.name}</p><p class="text-[10px] text-orange-500">₹${item.price}</p></div>
                    </td>
                    <td class="px-6 py-4">
                        <button onclick="toggleStock('${d.id}', ${item.inStock})" class="text-[9px] px-2 py-1 rounded-md font-black ${item.inStock?'bg-green-100 text-green-600':'bg-red-100 text-red-600'}">
                            ${item.inStock ? 'STOCK' : 'OUT'}
                        </button>
                    </td>
                    <td class="px-6 py-4 text-right"><button onclick="deleteItem('${d.id}')" class="text-red-400"><i class="fa-solid fa-trash-can"></i></button></td>
                </tr>`;
            });
        });

        window.toggleStock = async (id, s) => { await updateDoc(doc(db, "menu", id), { inStock: !s }); };
        window.deleteItem = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "menu", id)); };

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const name = document.getElementById('foodName').value;
            const price = document.getElementById('foodPrice').value;
            const image = document.getElementById('foodImage').value;
            if(name && price) {
                await addDoc(collection(db, "menu"), { name, price: parseInt(price), image, inStock: true });
                alert("Dish Added!");
                document.querySelectorAll('input').forEach(i => i.value = '');
            }
        });

        if(sessionStorage.getItem('isAdmin') === 'true') {
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    </script>
</body>
</html>
