<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Admin | Professional Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .momo-card { border-radius: 2.5rem; background: white; transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.05); position: relative; }
        .status-pill { font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 6px 12px; border-radius: 12px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .admin-tab { display: none; }
        .active-tab { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-gradient { background: linear-gradient(135deg, #ff8a00 0%, #ff5e00 100%); }
        .food-badge { position: absolute; top: 15px; left: 15px; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; text-transform: uppercase; z-index: 10; color: white; }
    </style>
</head>
<body class="pb-20">

    <nav class="bg-white/80 backdrop-blur-md p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center border-b">
        <h1 class="text-2xl font-900 italic tracking-tighter">Freshfry <span class="text-orange-600 underline">Admin</span></h1>
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
             <button onclick="showTab('orders')" class="bg-orange-600 text-white px-5 py-2.5 rounded-2xl text-[10px] font-900 uppercase shadow-lg shadow-orange-100">Orders</button>
             <button onclick="showTab('menu')" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-[10px] font-900 uppercase">Menu</button>
             <button onclick="showTab('users')" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-[10px] font-900 uppercase">Users</button>
             <button onclick="showTab('riders')" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-[10px] font-900 uppercase">Riders</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        
        <div id="tab-orders" class="admin-tab active-tab">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-6 rounded-[2.5rem] border-b-8 border-orange-500 shadow-xl shadow-orange-50">
                    <p class="text-[10px] font-900 text-slate-400 uppercase tracking-widest">Active Box</p>
                    <h2 id="active-orders-count" class="text-4xl font-900 italic">0</h2>
                </div>
                <div class="bg-white p-6 rounded-[2.5rem] border-b-8 border-green-500 shadow-xl shadow-green-50">
                    <p class="text-[10px] font-900 text-slate-400 uppercase tracking-widest">Done Today</p>
                    <h2 id="delivered-count" class="text-4xl font-900 italic">0</h2>
                </div>
            </div>
            <div id="admin-orders-list" class="space-y-4"></div>
        </div>

        <div id="tab-menu" class="admin-tab">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl mb-10 border border-orange-50">
                <h3 class="text-xl font-900 italic mb-6 uppercase tracking-tighter">Add <span class="text-orange-600">New Item</span></h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="m-name" placeholder="Item Name" class="bg-slate-50 p-4 rounded-2xl text-sm font-bold border-none ring-1 ring-slate-200">
                    <input type="number" id="m-price" placeholder="Price (₹)" class="bg-slate-50 p-4 rounded-2xl text-sm font-bold border-none ring-1 ring-slate-200">
                    <input type="text" id="m-img" placeholder="Image URL" class="bg-slate-50 p-4 rounded-2xl text-sm font-bold border-none ring-1 ring-slate-200">
                    <select id="m-type" class="bg-slate-50 p-4 rounded-2xl text-sm font-bold border-none ring-1 ring-slate-200">
                        <option value="Veg">Veg</option>
                        <option value="Non-Veg">Non-Veg</option>
                    </select>
                    <button onclick="addNewMomo()" class="btn-gradient text-white py-4 rounded-2xl font-900 uppercase text-[11px] md:col-span-2 shadow-lg active:scale-95 transition">Upload to Menu +</button>
                </div>
            </div>
            <h3 class="text-xs font-900 text-slate-400 uppercase mb-4 px-2 tracking-widest">Live Menu Cards</h3>
            <div id="menu-management-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="tab-users" class="admin-tab">
            <h3 class="font-900 italic mb-4 uppercase text-slate-400 px-2">Customer Base</h3>
            <div id="user-list" class="space-y-3"></div>
        </div>

        <div id="tab-riders" class="admin-tab">
            <h3 class="font-900 italic mb-4 uppercase text-slate-400 px-2">Rider Fleet</h3>
            <div id="rider-management-list" class="space-y-4"></div>
        </div>

    </main>

    <div id="rider-modal" class="modal p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-900 italic mb-1 uppercase tracking-tighter">Assign Rider</h3>
            <div id="rider-list-container" class="space-y-3 mt-6"></div>
            <button onclick="closeRiderModal()" class="w-full mt-6 py-4 text-slate-400 font-900 uppercase text-[10px]">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, updateDoc, deleteDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentOrderId = null;

        window.deleteItem = async (coll, id) => {
            if(confirm("Permanently Delete?")) await deleteDoc(doc(db, coll, id));
        };
        
        // --- UPDATED TOGGLE STOCK FUNCTION ---
        window.toggleStock = async (id, currentStatus) => {
            try {
                await updateDoc(doc(db, "menu", id), { inStock: !currentStatus });
            } catch (e) {
                console.error("Error updating stock", e);
            }
        };

        window.showTab = (name) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + name).classList.add('active-tab');
        };

        window.greetUser = (phone, name) => {
            const msg = encodeURIComponent(`Hello ${name}! 🔥 Welcome to Freshfry. Hope you are enjoying our premium momos!`);
            window.open(`https://wa.me/91${phone}?text=${msg}`);
        };

        // --- ORDERS ---
        onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-orders-list');
            let active = 0; let delivered = 0;
            list.innerHTML = '';
            snap.forEach(d => {
                const o = d.data();
                if(o.status !== 'delivered') active++; else delivered++;
                list.innerHTML += `
                <div class="bg-white p-6 momo-card shadow-sm border-l-8 ${o.status === 'pending' ? 'border-orange-500' : 'border-green-500'} mb-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-900 uppercase text-lg italic">${o.customerName}</h4>
                            <span class="status-pill ${o.status === 'pending' ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'}">${o.status}</span>
                        </div>
                        <h4 class="font-900 text-2xl text-slate-800 italic">₹${o.total}</h4>
                    </div>
                    <div class="my-4 text-[11px] font-bold text-slate-600 bg-slate-50 p-4 rounded-2xl italic">${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</div>
                    <div class="flex gap-2">
                        ${o.status === 'pending' ? `<button onclick="updateStatus('${d.id}', 'preparing')" class="bg-slate-900 text-white px-4 py-3 rounded-xl text-[10px] font-900 uppercase flex-1">Prepare</button>` : ''}
                        ${o.status === 'preparing' ? `<button onclick="openRiderModal('${d.id}')" class="bg-orange-600 text-white px-4 py-3 rounded-xl text-[10px] font-900 uppercase flex-1">Assign</button>` : ''}
                        <button onclick="deleteItem('orders', '${d.id}')" class="bg-red-50 text-red-500 px-4 py-3 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('active-orders-count').innerText = active;
            document.getElementById('delivered-count').innerText = delivered;
        });

        // --- MENU (With Fix for Stock Toggle) ---
        onSnapshot(collection(db, "menu"), (snap) => {
            const list = document.getElementById('menu-management-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                const badgeColor = item.type === 'Veg' ? 'bg-green-500' : 'bg-red-500';
                
                // Real-time value check for stock
                const isAvailable = item.inStock !== false;

                list.innerHTML += `
                <div class="momo-card overflow-hidden shadow-lg border-none">
                    <div class="food-badge ${badgeColor}">${item.type || 'Veg'}</div>
                    <img src="${item.image}" class="w-full h-44 object-cover ${isAvailable ? '' : 'grayscale opacity-50'}">
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-900 uppercase italic text-sm ${isAvailable ? '' : 'text-slate-400'}">${item.name}</h4>
                            <span class="text-orange-600 font-900">₹${item.price}</span>
                        </div>
                        
                        <button onclick="toggleStock('${d.id}', ${isAvailable})" 
                            class="w-full mb-2 ${isAvailable ? 'bg-green-100 text-green-600 border border-green-200' : 'bg-slate-100 text-slate-400 border border-slate-200'} py-3 rounded-xl font-900 text-[10px] uppercase tracking-widest transition-all">
                            ${isAvailable ? '● In Stock' : '○ Out of Stock'}
                        </button>

                        <button onclick="deleteItem('menu', '${d.id}')" class="w-full bg-red-50 text-red-500 py-3 rounded-xl font-900 text-[10px] uppercase tracking-widest active:bg-red-100 transition"><i class="fa-solid fa-trash-can mr-2"></i> Remove</button>
                    </div>
                </div>`;
            });
        });

        // --- RIDERS & USERS logic... (same as before) ---
        // ... (Rider and User code included correctly in final check) ...
        
        window.updateStatus = async (id, status) => { await updateDoc(doc(db, "orders", id), { status }); };
        window.addNewMomo = async () => {
            const n = document.getElementById('m-name').value;
            const p = document.getElementById('m-price').value;
            const i = document.getElementById('m-img').value;
            const t = document.getElementById('m-type').value;
            if(!n || !p) return alert("Enter Details");
            // Default inStock: true for new items
            await addDoc(collection(db, "menu"), { name: n, price: parseInt(p), image: i, type: t, inStock: true });
            alert("Added!");
            document.getElementById('m-name').value = '';
            document.getElementById('m-price').value = '';
            document.getElementById('m-img').value = '';
        };

        // (Keeping remaining functions loadRiders, payRider etc.)
        window.payRider = (upi, name, amt) => {
            window.location.href = `upi://pay?pa=${upi}&pn=${encodeURIComponent(name)}&am=${amt}&cu=INR`;
        };
        window.openRiderModal = (id) => {
            currentOrderId = id;
            document.getElementById('rider-modal').style.display = 'flex';
            onSnapshot(collection(db, "riders"), (snap) => {
                const container = document.getElementById('rider-list-container');
                container.innerHTML = '';
                snap.forEach(d => {
                    container.innerHTML += `<button onclick="assignOrder('${d.data().riderName}')" class="w-full bg-slate-50 p-4 rounded-2xl font-900 uppercase text-xs flex justify-between items-center">
                        ${d.data().riderName} <span class="${d.data().status === 'Online' ? 'text-green-500' : 'text-slate-300'} font-black">${d.data().status || 'OFF'}</span>
                    </button>`;
                });
            });
        };
        window.assignOrder = async (name) => {
            await updateDoc(doc(db, "orders", currentOrderId), { status: 'out_for_delivery', riderName: name });
            document.getElementById('rider-modal').style.display = 'none';
        };
        window.closeRiderModal = () => document.getElementById('rider-modal').style.display = 'none';

        function loadRiders() {
            const today = new Date(); today.setHours(0,0,0,0);
            onSnapshot(collection(db, "riders"), (riderSnap) => {
                onSnapshot(query(collection(db, "orders"), where("status", "==", "delivered")), (orderSnap) => {
                    const list = document.getElementById('rider-management-list');
                    list.innerHTML = '';
                    riderSnap.forEach(rDoc => {
                        const r = rDoc.data();
                        let count = 0;
                        orderSnap.forEach(oDoc => { if(oDoc.data().riderName === r.riderName && oDoc.data().createdAt?.toDate() >= today) count++; });
                        const earnings = count * 20;
                        const online = r.status === "Online";

                        list.innerHTML += `
                        <div class="bg-white p-6 momo-card shadow-sm border-l-8 ${online ? 'border-green-500' : 'border-slate-300'}">
                            <div class="flex justify-between items-center mb-4">
                                <div><h4 class="font-900 uppercase italic">${r.riderName}</h4><p class="text-[10px] font-bold text-slate-400">${r.riderUpi || 'No UPI'}</p></div>
                                <div class="text-right"><p class="text-[8px] font-black text-slate-400 uppercase">Today</p><p class="text-xl font-900 text-orange-600 italic">₹${earnings}</p></div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="payRider('${r.riderUpi}', '${r.riderName}', ${earnings})" class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-900 text-[10px] uppercase ${earnings <= 0 ? 'opacity-20' : ''}" ${earnings <= 0 ? 'disabled' : ''}>Pay ₹${earnings}</button>
                                <button onclick="deleteItem('riders', '${rDoc.id}')" class="bg-red-50 text-red-500 px-4 rounded-xl"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>`;
                    });
                });
            });
        }

        onSnapshot(collection(db, "users"), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            snap.forEach(d => {
                const u = d.data();
                list.innerHTML += `
                <div class="bg-white p-5 momo-card shadow-sm flex justify-between items-center">
                    <div><h4 class="font-900 uppercase italic text-sm">${u.name || 'User'}</h4><p class="text-[10px] font-bold text-slate-400">${u.phone || 'No Phone'}</p></div>
                    <div class="flex gap-2">
                        <button onclick="greetUser('${u.phone}', '${u.name}')" class="bg-green-100 text-green-600 h-10 w-10 rounded-xl flex items-center justify-center text-lg"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="deleteItem('users', '${d.id}')" class="bg-red-50 text-red-400 h-10 w-10 rounded-xl flex items-center justify-center text-sm"><i class="fa-solid fa-user-xmark"></i></button>
                    </div>
                </div>`;
            });
        });

        loadRiders();
    </script>
</body>
</html>
