<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Admin | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; }
        .order-card { border-radius: 2rem; transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .status-pill { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; border-radius: 12px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    </style>
</head>
<body class="pb-20">

    <nav class="bg-white p-6 sticky top-0 z-50 shadow-sm flex justify-between items-center">
        <h1 class="text-2xl font-900 italic tracking-tighter">Freshfry <span class="text-orange-500 underline">Admin</span></h1>
        <div class="flex gap-4">
             <div class="bg-orange-100 text-orange-600 px-4 py-2 rounded-2xl text-xs font-900">Live Kitchen</div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-6 rounded-[2rem] border-b-4 border-orange-500 shadow-sm">
                <p class="text-[10px] font-900 text-slate-400 uppercase tracking-widest">Active Orders</p>
                <h2 id="active-orders-count" class="text-4xl font-900 italic">0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2rem] border-b-4 border-green-500 shadow-sm">
                <p class="text-[10px] font-900 text-slate-400 uppercase tracking-widest">Delivered Today</p>
                <h2 id="delivered-count" class="text-4xl font-900 italic">0</h2>
            </div>
        </div>

        <h3 class="text-xs font-900 text-slate-400 uppercase tracking-widest mb-4 px-2">Kitchen Feed</h3>
        <div id="admin-orders-list" class="space-y-4">
            </div>
    </main>

    <div id="rider-modal" class="modal p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-900 italic mb-1 uppercase tracking-tighter">Select Rider</h3>
            <p class="text-[9px] font-900 text-slate-400 uppercase tracking-widest mb-6">Showing Online Riders Only</p>
            
            <div id="rider-list-container" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                </div>

            <button onclick="closeRiderModal()" class="w-full mt-6 py-4 text-slate-400 font-900 uppercase text-[10px] tracking-widest">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentOrderId = null;

        // --- FETCH ORDERS ---
        function loadAdminOrders() {
            const q = query(collection(db, "orders"), orderBy("time", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('admin-orders-list');
                let activeCount = 0;
                let delCount = 0;
                list.innerHTML = '';

                snap.forEach(d => {
                    const order = d.data();
                    if(order.status !== 'delivered') activeCount++; else delCount++;

                    list.innerHTML += `
                    <div class="bg-white p-6 order-card shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="text-xl font-900 italic uppercase tracking-tighter">${order.customerName}</h4>
                                <p class="text-[10px] font-bold text-slate-400">${order.customer} | ${order.paymentMethod}</p>
                            </div>
                            <span class="status-pill ${getStatusClass(order.status)}">${order.status.replace(/_/g,' ')}</span>
                        </div>
                        
                        <div class="bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100">
                             <p class="text-[9px] font-900 text-slate-400 uppercase mb-1">Items:</p>
                             <p class="text-xs font-bold text-slate-700">${order.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                             <p class="mt-3 text-[9px] font-900 text-slate-400 uppercase mb-1">Address:</p>
                             <p class="text-xs font-bold text-slate-800">${order.address}</p>
                        </div>

                        <div class="flex items-center justify-between gap-3">
                            <h5 class="text-2xl font-900 italic">₹${order.total}</h5>
                            <div class="flex gap-2">
                                ${order.status === 'pending' ? 
                                `<button onclick="updateStatus('${d.id}', 'preparing')" class="bg-orange-500 text-white px-4 py-3 rounded-xl font-900 text-[10px] uppercase tracking-widest">Accept</button>` : ''}
                                
                                ${order.status === 'preparing' ? 
                                `<button onclick="openRiderModal('${d.id}')" class="bg-slate-900 text-white px-4 py-3 rounded-xl font-900 text-[10px] uppercase tracking-widest">Assign Rider</button>` : ''}
                                
                                <button onclick="deleteOrder('${d.id}')" class="bg-red-50 text-red-500 p-3 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        ${order.riderName ? `<p class="mt-3 text-[9px] font-900 text-blue-500 uppercase tracking-widest italic">Rider: ${order.riderName}</p>` : ''}
                    </div>`;
                });
                document.getElementById('active-orders-count').innerText = activeCount;
                document.getElementById('delivered-count').innerText = delCount;
            });
        }

        function getStatusClass(s) {
            if(s === 'pending') return 'bg-yellow-100 text-yellow-600';
            if(s === 'preparing') return 'bg-blue-100 text-blue-600';
            if(s === 'out_for_delivery') return 'bg-purple-100 text-purple-600';
            return 'bg-green-100 text-green-600';
        }

        // --- RIDER MODAL LOGIC (FIXED) ---
        window.openRiderModal = (orderId) => {
            currentOrderId = orderId;
            document.getElementById('rider-modal').style.display = 'flex';
            
            // "Online" match with Rider App exactly
            const q = query(collection(db, "riders"), where("status", "==", "Online"));
            
            onSnapshot(q, (snap) => {
                const container = document.getElementById('rider-list-container');
                container.innerHTML = '';
                
                if(snap.empty) {
                    container.innerHTML = `
                        <div class="text-center py-6">
                            <p class="text-red-500 font-900 text-xs uppercase mb-2">No Riders Online ❌</p>
                            <p class="text-[9px] text-slate-400 px-4 font-bold">Ask rider to login and 'Start Duty'</p>
                        </div>`;
                    return;
                }

                snap.forEach(d => {
                    const rider = d.data();
                    container.innerHTML += `
                        <button onclick="confirmRider('${rider.riderName}')" class="w-full bg-slate-50 hover:bg-orange-500 hover:text-white transition-all p-5 rounded-2xl flex justify-between items-center group mb-2 border border-slate-100">
                            <span class="font-900 text-sm uppercase tracking-tighter">${rider.riderName}</span>
                            <span class="bg-green-500 w-2 h-2 rounded-full animate-pulse"></span>
                        </button>`;
                });
            });
        };

        window.confirmRider = async (riderName) => {
            if(!currentOrderId) return;
            try {
                await updateDoc(doc(db, "orders", currentOrderId), {
                    status: 'out_for_delivery',
                    riderName: riderName
                });
                closeRiderModal();
                alert(`Order assigned to ${riderName} 🏍️`);
            } catch (e) { alert("Assignment Failed!"); }
        };

        window.closeRiderModal = () => { document.getElementById('rider-modal').style.display = 'none'; };

        window.updateStatus = async (id, status) => { await updateDoc(doc(db, "orders", id), { status }); };
        window.deleteOrder = async (id) => { if(confirm("Delete this order?")) await deleteDoc(doc(db, "orders", id)); };

        loadAdminOrders();
    </script>
</body>
</html>
