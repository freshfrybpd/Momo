<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .food-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-800 text-gray-900">Console<span class="text-orange-500">.</span></h1>
                <p class="text-gray-500 font-medium">Manage Menu & Offers</p>
            </div>
            <div class="bg-green-500 h-3 w-3 rounded-full animate-pulse"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
                    <h3 id="form-title" class="font-800 text-gray-800 mb-4 uppercase text-xs tracking-widest">Add New Item</h3>
                    <div class="space-y-3">
                        <input type="text" id="foodName" placeholder="Item Name" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-bold text-sm">
                        <input type="number" id="foodPrice" placeholder="Price (₹)" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-bold text-sm">
                        <input type="text" id="foodImage" placeholder="Image URL" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-bold text-sm">
                        <select id="foodType" class="w-full p-4 bg-gray-50 rounded-2xl outline-none font-bold text-sm">
                            <option value="veg">Veg</option>
                            <option value="non-veg">Non-Veg</option>
                        </select>
                        <button id="submitBtn" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all">UPLOAD ITEM</button>
                    </div>
                </div>

                <div class="bg-gray-900 p-6 rounded-[2rem] shadow-xl text-white">
                    <h3 class="font-800 mb-4 uppercase text-xs tracking-widest text-orange-500">Live Coupon</h3>
                    <div class="space-y-3">
                        <input type="text" id="cpCode" placeholder="Code (FRESH50)" class="w-full p-4 bg-white/10 rounded-2xl outline-none font-bold text-sm">
                        <input type="text" id="cpText" placeholder="Offer (20% OFF)" class="w-full p-4 bg-white/10 rounded-2xl outline-none font-bold text-sm">
                        <button onclick="updateCoupon()" class="w-full bg-white text-gray-900 py-3 rounded-2xl font-black text-sm">UPDATE HOME</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase">
                        <tr>
                            <th class="px-6 py-4">Dish</th>
                            <th class="px-6 py-4">Price</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="menuTableBody" class="text-sm font-bold divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let editModeId = null;

        // --- MANAGE MENU ---
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const data = {
                name: document.getElementById('foodName').value,
                price: document.getElementById('foodPrice').value,
                image: document.getElementById('foodImage').value,
                type: document.getElementById('foodType').value
            };

            if(!data.name || !data.price) return alert("Details bhariye");

            try {
                if(editModeId) {
                    await updateDoc(doc(db, "menu", editModeId), data);
                    editModeId = null;
                    document.getElementById('submitBtn').innerText = "UPLOAD ITEM";
                } else {
                    await addDoc(collection(db, "menu"), data);
                }
                document.querySelectorAll('input').forEach(i => i.value = '');
            } catch(e) { alert(e.message); }
        });

        onSnapshot(collection(db, "menu"), (snap) => {
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const item = d.data();
                tbody.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 flex items-center gap-3">
                            <img src="${item.image}" class="food-preview">
                            <span>${item.name}</span>
                        </td>
                        <td class="px-6 py-4">₹${item.price}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="editItem('${d.id}','${item.name}','${item.price}','${item.image}')" class="text-blue-500 mr-3"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem('${d.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        });

        window.editItem = (id, n, p, img) => {
            editModeId = id;
            document.getElementById('foodName').value = n;
            document.getElementById('foodPrice').value = p;
            document.getElementById('foodImage').value = img;
            document.getElementById('submitBtn').innerText = "CONFIRM EDIT";
        };

        window.deleteItem = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "menu", id)); };

        // --- COUPON ---
        window.updateCoupon = async () => {
            const code = document.getElementById('cpCode').value;
            const text = document.getElementById('cpText').value;
            await setDoc(doc(db, "settings", "promo"), { code, text });
            alert("Coupon Live!");
        };
    </script>
</body>
</html>
