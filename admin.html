<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry Admin | Command Centre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        #main-content { display: none; }
        .order-card { transition: all 0.3s ease; border-radius: 2.5rem; border: 1px solid #f1f5f9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Rider Popup Styles */
        #rider-modal { display: none; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <div id="rider-modal" class="fixed inset-0 z-[200] bg-slate-900/50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-xl font-800 mb-2 italic tracking-tighter">Select Rider<span class="text-orange-500">.</span></h3>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Showing Online Riders Only</p>
            <div id="rider-list-container" class="space-y-3 max-h-60 overflow-y-auto no-scrollbar">
                </div>
            <button onclick="closeRiderModal()" class="w-full mt-6 py-4 text-slate-400 font-bold text-xs uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <div id="admin-login-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-[3.5rem] p-12 shadow-2xl text-center">
            <div class="w-20 h-20 bg-orange-500 text-white rounded-[2rem] flex items-center justify-center text-3xl mx-auto mb-8 shadow-xl shadow-orange-200">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h2 class="text-3xl font-800 text-slate-800 mb-2 italic tracking-tighter">Freshfry <span class="text-orange-500">HQ.</span></h2>
            <div class="space-y-4 mt-8">
                <input type="password" id="adminPassInput" placeholder="Master Key" class="w-full px-8 py-5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 font-bold text-center">
                <button onclick="checkAdminLogin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl uppercase tracking-widest text-[10px]">Access Console</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="p-6 lg:p-12 max-w-[1600px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <p class="text-orange-500 font-900 text-[10px] uppercase tracking-[0.4em] mb-1">System Version 2.0</p>
                <h1 class="text-4xl font-800 text-slate-900 italic tracking-tighter">Command Centre<span class="text-orange-500">.</span></h1>
            </div>
            <div class="flex items-center gap-4 bg-white p-3 rounded-[2rem] shadow-sm border border-slate-100">
                <div class="flex items-center gap-2 px-4 border-r border-slate-100">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-black uppercase text-slate-400">Live</span>
                </div>
                <button onclick="logout()" class="w-12 h-12 flex items-center justify-center rounded-xl text-red-500 hover:bg-red-50 transition"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Pending Orders</p>
                <h3 id="order-count" class="text-4xl font-800">0</h3>
            </div>
            <div class="bg-orange-500 p-8 rounded-[2.5rem] shadow-xl shadow-orange-100 text-white">
                <p class="text-[10px] font-black text-orange-100 uppercase tracking-widest mb-1">Active Riders</p>
                <h3 id="rider-count-stats" class="text-4xl font-800">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Registered Users</p>
                <h3 id="user-count" class="text-4xl font-800">0</h3>
            </div>
            <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-sm text-white">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Total Sales</p>
                <h3 class="text-4xl font-800">₹<span id="total-revenue">0</span></h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
            <div class="lg:col-span-12">
                <h2 class="text-2xl font-800 text-slate-800 tracking-tighter mb-6">Kitchen Feed</h2>
                <div id="admin-orders-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, addDoc, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCb8ZRaDfMc--BzT2S_LllBA4G2d0dfUM",
            authDomain: "freshfry-39a10.firebaseapp.com",
            projectId: "freshfry-39a10",
            storageBucket: "freshfry-39a10.firebasestorage.app",
            messagingSenderId: "928483976893",
            appId: "1:928483976893:web:3459478b550ba0e12fb9d4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentOrderId = null;

        // --- AUTH ---
        window.checkAdminLogin = () => {
            if(document.getElementById('adminPassInput').value === "admin5") {
                document.getElementById('admin-login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                sessionStorage.setItem('isAdmin', 'true');
            } else alert("Wrong Passkey!");
        };
        window.logout = () => { sessionStorage.clear(); location.reload(); };

        // --- ORDER MANAGEMENT ---
        onSnapshot(query(collection(db, "orders"), orderBy("time", "desc")), (snap) => {
            const grid = document.getElementById('admin-orders-grid');
            grid.innerHTML = '';
            let count = 0; let revenue = 0;
            
            snap.forEach(d => {
                const order = d.data();
                const id = d.id;
                const status = order.status || 'pending';
                if(status === 'delivered') { revenue += order.total; return; }

                count++;
                grid.innerHTML += `
                <div class="bg-white p-8 order-card shadow-lg relative">
                    <div class="flex justify-between items-start mb-6">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest ${status==='pending'?'bg-red-100 text-red-500':'bg-blue-100 text-blue-500'}">${status}</span>
                        <p class="text-2xl font-900 text-slate-800 italic">₹${order.total}</p>
                    </div>
                    <h4 class="font-800 text-slate-900 text-lg uppercase tracking-tighter">${order.customerName || 'Customer'}</h4>
                    <p class="text-xs font-bold text-slate-400 mb-4 tracking-widest italic">${order.address}</p>
                    
                    <div class="flex gap-3 mt-6">
                        ${status === 'pending' ? `
                            <button onclick="updateStatus('${id}', 'accepted')" class="flex-1 bg-green-500 text-white py-4 rounded-2xl font-black text-[10px] uppercase">Accept</button>
                        ` : status === 'accepted' ? `
                            <button onclick="openRiderModal('${id}')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest">Assign Rider 🛵</button>
                        ` : `
                            <div class="w-full text-center text-blue-500 font-black text-[10px] uppercase py-3 bg-blue-50 rounded-xl italic">On Delivery: ${order.riderName}</div>
                        `}
                    </div>
                </div>`;
            });
            document.getElementById('order-count').innerText = count;
            document.getElementById('total-revenue').innerText = revenue;
        });

        // --- DYNAMIC RIDER ASSIGNMENT ---
        window.openRiderModal = (orderId) => {
            currentOrderId = orderId;
            document.getElementById('rider-modal').style.display = 'flex';
            
            // Fetch Online Riders from 'riders' collection
            const q = query(collection(db, "riders"), where("status", "==", "Online"));
            
            onSnapshot(q, (snap) => {
                const container = document.getElementById('rider-list-container');
                container.innerHTML = '';
                
                if(snap.empty) {
                    container.innerHTML = '<p class="text-center text-red-500 font-bold text-xs py-4 uppercase">No Riders Online ❌</p>';
                    return;
                }

                snap.forEach(d => {
                    const rider = d.data();
                    container.innerHTML += `
                        <button onclick="confirmRider('${rider.riderName}')" class="w-full bg-slate-50 hover:bg-orange-500 hover:text-white transition-all p-5 rounded-2xl flex justify-between items-center group">
                            <span class="font-black text-sm uppercase tracking-tighter">${rider.riderName}</span>
                            <i class="fa-solid fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100"></i>
                        </button>
                    `;
                });
            });
        };

        window.confirmRider = async (rName) => {
            if(currentOrderId && rName) {
                await updateDoc(doc(db, "orders", currentOrderId), { 
                    status: 'out_for_delivery', 
                    riderName: rName.toUpperCase() 
                });
                closeRiderModal();
                alert(`Order assigned to ${rName}!`);
            }
        };

        window.closeRiderModal = () => {
            document.getElementById('rider-modal').style.display = 'none';
            currentOrderId = null;
        };

        // Standard Actions
        window.updateStatus = async (id, s) => { await updateDoc(doc(db, "orders", id), { status: s }); };

        // Active Rider Count Tracker
        onSnapshot(query(collection(db, "riders"), where("status", "==", "Online")), (snap) => {
            document.getElementById('rider-count-stats').innerText = snap.size;
        });

        if(sessionStorage.getItem('isAdmin') === 'true') {
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    </script>
</body>
</html>
