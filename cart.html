<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Your Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        .page-active { display: block; animation: slideUp 0.4s ease-out; }
        .page-hidden { display: none; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cart Sidebar Animation */
        #cart-sidebar { transition: transform 0.3s ease-in-out; }
        .cart-open { transform: translateX(0) !important; }
        .cart-closed { transform: translateX(100%); }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between px-6 py-5 bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-black text-orange-500 cursor-pointer" onclick="showPage('home')">
            Fresh<span class="text-gray-900">fry</span><span class="text-orange-500">.</span>
        </div>
        <div class="flex items-center space-x-4">
            <div onclick="showPage('profile')" class="bg-gray-100 p-2.5 rounded-full cursor-pointer hover:bg-orange-100 transition">
                <i class="fa-solid fa-user text-gray-700"></i>
            </div>
            <div onclick="toggleCart()" class="relative bg-orange-500 p-2.5 rounded-full cursor-pointer shadow-lg shadow-orange-200">
                <i class="fa-solid fa-bag-shopping text-white text-xl"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-[60] shadow-2xl cart-closed flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-2xl font-black italic">Your Basket</h2>
            <button onclick="toggleCart()" class="bg-gray-100 p-2 rounded-xl text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
            <div class="text-center py-20">
                <i class="fa-solid fa- basket-shopping text-5xl text-gray-200 mb-4"></i>
                <p class="text-gray-400 font-bold">Your cart is empty</p>
            </div>
        </div>

        <div class="p-6 bg-gray-50 border-t space-y-3">
            <div class="flex justify-between text-sm font-bold text-gray-500">
                <span>Item Total</span>
                <span id="bill-subtotal">₹0</span>
            </div>
            <div class="flex justify-between text-sm font-bold text-gray-500">
                <span>Delivery Fee</span>
                <span>₹20</span>
            </div>
            <div class="flex justify-between text-xl font-black text-gray-900 pt-2 border-t">
                <span>To Pay</span>
                <span id="bill-total" class="text-orange-500">₹0</span>
            </div>
            <button onclick="checkoutOrder()" class="w-full bg-gray-900 text-white py-5 rounded-[2rem] font-black tracking-widest mt-4 hover:bg-orange-500 transition shadow-xl active:scale-95">
                CHECKOUT <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <main id="page-home" class="page-active px-6 py-6 max-w-2xl mx-auto mb-28">
        <h2 class="text-3xl font-black mb-8">Special Menu</h2>
        <div class="space-y-8">
            <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-gray-100 p-4">
                <div class="relative mb-4">
                    <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=800" class="w-full h-48 object-cover rounded-[2rem]">
                </div>
                <div class="flex justify-between items-start px-2">
                    <div>
                        <h3 class="text-xl font-black">Freshfry Fried</h3>
                        <p class="text-sm font-bold text-orange-500">₹100 / Half</p>
                    </div>
                    <button onclick="addToCart('Fried Momos', 100)" class="bg-gray-900 text-white px-6 py-3 rounded-2xl font-bold shadow-lg active:scale-90 transition">Add +</button>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-gray-100 p-4">
                <div class="relative mb-4">
                    <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=800" class="w-full h-48 object-cover rounded-[2rem]">
                </div>
                <div class="flex justify-between items-start px-2">
                    <div>
                        <h3 class="text-xl font-black">Freshfry Stream</h3>
                        <p class="text-sm font-bold text-orange-500">₹100 / Half</p>
                    </div>
                    <button onclick="addToCart('Stream Momos', 100)" class="bg-gray-900 text-white px-6 py-3 rounded-2xl font-bold shadow-lg active:scale-90 transition">Add +</button>
                </div>
            </div>
        </div>
    </main>

    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>

    <script>
        let cart = [];

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('cart-open');
            overlay.classList.toggle('hidden');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            // Optional: Auto open cart on first add
            // toggleCart(); 
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            const subtotalEl = document.getElementById('bill-subtotal');
            const totalEl = document.getElementById('bill-total');

            badge.innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-300"><i class="fa-solid fa-basket-shopping text-5xl mb-4"></i><p class="font-bold">Cart is empty</p></div>`;
                subtotalEl.innerText = `₹0`;
                totalEl.innerText = `₹0`;
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map((item, index) => {
                subtotal += item.price;
                return `
                    <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl border border-gray-100 animate-slide-up">
                        <div>
                            <p class="font-black text-gray-800">${item.name}</p>
                            <p class="text-xs font-bold text-orange-500 italic">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            }).join('');

            subtotalEl.innerText = `₹${subtotal}`;
            totalEl.innerText = `₹${subtotal + 20}`; // Adding delivery fee
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkoutOrder() {
            if(cart.length === 0) return alert("Add items first!");
            
            alert("Order Confirmed! Your momos are being prepared. 🔥");
            cart = [];
            updateCartUI();
            toggleCart();
        }

        function showPage(page) {
            // Logic for switching pages as before
            alert("Navigating to " + page);
        }
    </script>

</body>
</html>
