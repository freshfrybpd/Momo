<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Your Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.85, 0, 0.15, 1); }
        .cart-open { transform: translateX(0) !important; }
        .cart-closed { transform: translateX(100%); }

        .momo-item-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .checkout-btn {
            background: linear-gradient(135deg, #111827 0%, #374151 100%);
            box-shadow: 0 15px 30px -10px rgba(17, 24, 39, 0.4);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-3xl font-extrabold text-orange-500 tracking-tighter cursor-pointer">
            Fresh<span class="text-gray-900">fry</span>.
        </div>
        <div onclick="toggleCart()" class="relative bg-orange-100 p-3 rounded-full cursor-pointer">
            <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[420px] bg-white z-[100] cart-sidebar cart-closed flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-800 tracking-tighter">My <span class="text-orange-500">Box</span></h2>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Freshly packed for you</p>
            </div>
            <button onclick="toggleCart()" class="h-12 w-12 bg-gray-50 rounded-2xl flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
            </div>

        <div class="p-8 bg-gray-50 border-t rounded-t-[2.5rem] shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.05)]">
            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-sm font-semibold text-gray-500 px-2">
                    <span>Momo Total</span>
                    <span id="bill-subtotal">₹0</span>
                </div>
                <div class="flex justify-between text-sm font-semibold text-gray-500 px-2">
                    <span>Delivery Fee</span>
                    <span class="text-green-600 font-bold">₹20</span>
                </div>
                <div class="pt-4 border-t border-dashed border-gray-300 flex justify-between items-center px-2">
                    <span class="text-lg font-800 text-gray-900">To Pay</span>
                    <span id="bill-total" class="text-3xl font-800 tracking-tighter text-gray-900">₹0</span>
                </div>
            </div>

            <button onclick="checkoutOrder()" class="checkout-btn w-full text-white py-6 rounded-[2rem] font-800 uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-3 active:scale-95 transition-all">
                Final Checkout <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>
    </div>

    <main class="max-w-2xl mx-auto p-6 pt-10">
        <h2 class="text-4xl font-800 tracking-tighter mb-8 italic text-gray-900">Today's <span class="text-orange-500">Specials</span></h2>
        
        <div class="space-y-6">
            <div class="bg-white p-4 rounded-[2.5rem] shadow-sm border border-gray-100 flex items-center gap-5">
                <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=300" class="w-24 h-24 object-cover rounded-[1.8rem]">
                <div class="flex-1">
                    <h3 class="font-800 text-lg uppercase tracking-tighter">Chicken Fried</h3>
                    <p class="text-orange-500 font-extrabold text-sm">₹100</p>
                </div>
                <button onclick="addToCart('Chicken Fried', 100)" class="h-12 w-12 bg-gray-900 text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div class="bg-white p-4 rounded-[2.5rem] shadow-sm border border-gray-100 flex items-center gap-5">
                <img src="https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?q=80&w=300" class="w-24 h-24 object-cover rounded-[1.8rem]">
                <div class="flex-1">
                    <h3 class="font-800 text-lg uppercase tracking-tighter">Veg Steamed</h3>
                    <p class="text-orange-500 font-extrabold text-sm">₹60</p>
                </div>
                <button onclick="addToCart('Veg Steamed', 60)" class="h-12 w-12 bg-gray-900 text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>
    </main>

    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[90] hidden transition-opacity"></div>

    <script>
        let cart = [];
        const deliveryFee = 20;

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('cart-open');
            overlay.classList.toggle('hidden');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            const subtotalEl = document.getElementById('bill-subtotal');
            const totalEl = document.getElementById('bill-total');

            badge.innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-basket-shopping text-3xl text-gray-200"></i>
                        </div>
                        <p class="text-gray-400 font-bold uppercase text-[10px] tracking-widest">Your box is empty</p>
                    </div>`;
                subtotalEl.innerText = `₹0`;
                totalEl.innerText = `₹0`;
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map((item, index) => {
                subtotal += item.price;
                return `
                    <div class="momo-item-card p-5 flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="h-2 w-2 rounded-full bg-orange-500"></div>
                            <div>
                                <p class="font-800 text-gray-900 text-sm uppercase tracking-tighter">${item.name}</p>
                                <p class="text-xs font-bold text-gray-400 tracking-widest">1 Plate</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-800 text-gray-900">₹${item.price}</span>
                            <button onclick="removeFromCart(${index})" class="h-8 w-8 text-gray-300 hover:text-red-500 transition">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            subtotalEl.innerText = `₹${subtotal}`;
            totalEl.innerText = `₹${subtotal + deliveryFee}`;
        }

        function checkoutOrder() {
            if(cart.length === 0) return alert("Select some momos first!");
            const finalPay = document.getElementById('bill-total').innerText;
            alert("Order Confirmed! Final Bill: " + finalPay);
            // Redirection logic can go here
        }
    </script>
</body>
</html>
