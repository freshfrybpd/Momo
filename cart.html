<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshfry | Your Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .cart-sidebar { transition: transform 0.5s cubic-bezier(0.85, 0, 0.15, 1); }
        .cart-open { transform: translateX(0) !important; }
        .cart-closed { transform: translateX(100%); }
        .momo-item-card { background: #ffffff; border: 1px solid #f1f5f9; border-radius: 1.5rem; transition: all 0.3s ease; }
        .checkout-btn { background: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%); box-shadow: 0 15px 30px -10px rgba(242, 153, 74, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between px-6 py-5 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-3xl font-extrabold text-orange-500 tracking-tighter cursor-pointer">
            Fresh<span class="text-gray-900">fry</span>.
        </div>
        <div onclick="toggleCart()" class="relative bg-orange-100 p-3 rounded-full cursor-pointer">
            <i class="fa-solid fa-bag-shopping text-orange-600 text-xl"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[420px] bg-white z-[100] cart-sidebar cart-closed flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-800 tracking-tighter italic">Review <span class="text-orange-500">Order</span></h2>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Baripada's Best Momos</p>
            </div>
            <button onclick="toggleCart()" class="h-10 w-10 bg-gray-50 rounded-xl text-gray-400"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-3 no-scrollbar">
            </div>

        <div class="px-8 pb-4">
            <input id="user-address" type="text" placeholder="House No / Street / Landmark" class="w-full px-5 py-4 bg-gray-50 rounded-2xl outline-none border border-gray-100 font-semibold text-sm focus:border-orange-400">
        </div>

        <div class="p-8 bg-gray-50 border-t rounded-t-[2.5rem]">
            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-sm font-semibold text-gray-500 px-2">
                    <span>Momo Total</span>
                    <span id="bill-subtotal">₹0</span>
                </div>
                <div class="flex justify-between text-sm font-semibold text-gray-500 px-2">
                    <span>Delivery Fee</span>
                    <span class="text-green-600 font-bold">₹20</span>
                </div>
                <div class="pt-4 border-t border-dashed border-gray-300 flex justify-between items-center px-2">
                    <span class="text-lg font-800 text-gray-900">TO PAY</span>
                    <span id="bill-total" class="text-3xl font-800 tracking-tighter text-orange-500">₹0</span>
                </div>
            </div>

            <button onclick="initiateCheckout()" class="checkout-btn w-full text-white py-6 rounded-[2rem] font-800 uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-3 active:scale-95 transition-all">
                Pay & Confirm Order <i class="fa-solid fa-bolt text-[10px]"></i>
            </button>
        </div>
    </div>

    <main class="max-w-2xl mx-auto p-6">
        <h2 class="text-4xl font-800 tracking-tighter mb-8 italic text-gray-900">Today's <span class="text-orange-500">Specials</span></h2>
        <div class="space-y-6">
            <div class="bg-white p-4 rounded-[2.5rem] shadow-sm border border-gray-100 flex items-center gap-5">
                <img src="https://images.unsplash.com/photo-1534422298391-e4f8c170db06?q=80&w=300" class="w-20 h-20 object-cover rounded-2xl">
                <div class="flex-1">
                    <h3 class="font-800 text-gray-800 uppercase tracking-tighter">Chicken Fried</h3>
                    <p class="text-orange-500 font-extrabold text-sm">₹100</p>
                </div>
                <button onclick="addToCart('Chicken Fried', 100)" class="h-10 w-10 bg-gray-900 text-white rounded-xl shadow-lg active:scale-90 transition"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
    </main>

    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[90] hidden transition-opacity"></div>

    <script>
        let cart = [];
        const deliveryFee = 20;

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('cart-open');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            const subtotalEl = document.getElementById('bill-subtotal');
            const totalEl = document.getElementById('bill-total');

            badge.innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-300 font-bold uppercase text-[10px] tracking-widest">Your box is empty</div>`;
                subtotalEl.innerText = `₹0`;
                totalEl.innerText = `₹0`; // Jab cart khali ho tab total bhi 0 dikhao
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map((item, index) => {
                subtotal += item.price;
                return `
                    <div class="momo-item-card p-4 flex items-center justify-between">
                        <p class="font-800 text-gray-900 text-sm uppercase tracking-tighter">${item.name}</p>
                        <div class="flex items-center gap-4">
                            <span class="font-800 text-gray-900">₹${item.price}</span>
                            <button onclick="removeFromCart(${index})" class="text-gray-300 hover:text-red-500 transition">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>`;
            }).join('');

            subtotalEl.innerText = `₹${subtotal}`;
            totalEl.innerText = `₹${subtotal + deliveryFee}`;
        }

        function initiateCheckout() {
            const address = document.getElementById('user-address').value;
            const total = document.getElementById('bill-total').innerText.replace('₹', '');
            
            if (cart.length === 0) return alert("Select momos first!");
            if (!address) return alert("Please enter delivery address!");

            // 1. Payment Link (Deep Linking)
            const upiUrl = `upi://pay?pa=7008186187@ybl&pn=Freshfry&am=${total}&cu=INR`;
            
            // 2. WhatsApp Message Construction
            const itemList = cart.map(i => `• ${i.name} (₹${i.price})`).join('%0A');
            const waMsg = `*🍱 NEW ORDER - FRESHFRY*%0A%0A*Items:*%0A${itemList}%0A%0A*Bill Summary:*%0A- Subtotal: ₹${total-20}%0A- Delivery: ₹20%0A- *Total Paid: ₹${total}*%0A%0A*Delivery Details:*%0A📍 ${address}%0A%0A_Payment initiated via UPI App_`;

            // Open Payment App
            window.location.href = upiUrl;

            // Open WhatsApp after short delay for confirmation
            setTimeout(() => {
                window.location.href = `https://wa.me/917008186187?text=${waMsg}`;
            }, 3000);
        }
    </script>
</body>
</html>
